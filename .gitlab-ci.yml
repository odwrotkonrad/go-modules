##[>] 🤖🤖
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#[why] every job that compiles or tests che needs the catalog it embeds: the vendored
#   builtin is gitignored, so each job fetches the pinned release before anything runs
#[why] retry infrastructure flakes (image pulls, runner/network, stuck jobs) twice; script failures never retry, a real test failure stays red
#[why] a superseded pipeline holds pods for a commit nobody will merge, so cancellable by default.
#   release, tag and publish jobs opt out individually: each pushes something the outside world then
#   sees, and a half-published tag, package or apt tree is worse than a slow one
default:
  interruptible: true
  tags:
    - gke-linux-amd64
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

stages:
  - warm
  - verify
  - test-unit
  - test-e2e
  - test-e2e-method-installs
  - coverage
  - release
  - publish
  - trigger-downstream

variables:
  CI_IMAGE: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux:$GRP_VAR_CI_IMAGES_REF
  CI_IMAGE_ARM64: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux:$GRP_VAR_CI_IMAGES_REF-arm64
  CI_IMAGE_DIND: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux-dind:$GRP_VAR_CI_IMAGES_REF
  CI_IMAGE_DIND_ARM64: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux-dind:$GRP_VAR_CI_IMAGES_REF-arm64
  CHE_PACKAGES_REF: $GRP_VAR_CHE_PACKAGES_REF
  #[why] set but never cached: it holds dependencies, and cache: here carries intermediates only.
  #   it stays to keep downloads in the project dir, off the pod's root fs
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  CC: clang

#[why] the vendored builtin catalog is gitignored, so any job that compiles or tests che has to
#   fetch the pinned release first. an explicit anchor, not a default before_script: jobs like
#   pages-preview run on images with no zsh and need no catalog, and a global hook broke them
.vendors-packages:
  before_script:
    - ci/vendor-packages-defs.zsh

#[what] amd64 linux warm build: the go build cache plus the amd64 che artifacts the e2e jobs reuse
#[why] builds only what the automatic jobs consume. build-linux lives in warm-go-linux-amd64 instead:
#   it is a CGO_ENABLED=0 cross-target that shares no compiled package with this host build, cost 107s
#   of this job's critical path, and is read only by the manual install-methods matrix
warm-go:
  extends: .vendors-packages
  stage: warm
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
  #[why] one go-build key per (compiler target × trust boundary): host-native, zig-amd64, zig-arm64,
  #   darwin share no compiled package. the mr- prefix keeps what an MR writes out of what a tag
  #   release restores, since the cache is trusted unverified
  cache:
    - key: go-build
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - for m in lib che get-os-open-files-with get-term-open-files-with; do (cd $m && echo "## download $m" && go mod download all) || exit 1; done
    - for m in lib che; do (cd $m && echo "## build $m" && go build -v ./...) || exit 1; done
    - make -C che build-cover build-e2e-test
  artifacts:
    paths:
      - che/dist/

##[>] 🤖🤖
#[what] arm64 linux warm build: zig-cross arm64 che artifacts for the arm64 install e2e jobs
warm-go-linux-arm64:
  extends: .vendors-packages
  stage: warm
  image: $CI_IMAGE
  needs: []
  #[why] only feeds the manual arm64 install-e2e matrix: stays manual with it, never auto
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    - key: mr-go-build-che-zig-arm64
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - make -C che build-linux build-cover-linux build-e2e-test-linux PLATFORM=linux-arm64
  artifacts:
    paths:
      - che/dist/linux-arm64/
      - che/dist/che-linux-arm64

#[what] amd64 linux cross-build: the CGO_ENABLED=0 che binary the amd64 install-methods matrix runs
#[why] split out of warm-go, where it cost 107s in front of every automatic unit, e2e and prerelease
#   job while serving only the manual matrix below. manual and optional, exactly like the matrix it
#   feeds: unclicked, the matrix still builds the binary itself, so nothing depends on this running
warm-go-linux-amd64:
  extends: .vendors-packages
  stage: warm
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    - key: mr-go-build-che-zig-amd64
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - make -C che build-linux PLATFORM=linux-amd64
  artifacts:
    paths:
      - che/dist/che-linux-amd64
##[<] 🤖🤖

verify-precommit-all:
  extends: .vendors-packages
  stage: verify
  image: $CI_IMAGE
  #[why] takes warm-go's che/dist: render-templates reuses it instead of compiling a fourth che per
  #   pipeline. the cover binary renders identically, it only writes covdata under GOCOVERDIR
  needs:
    - warm-go
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    LEFTHOOK_OUTPUT: meta,summary,execution,execution_info,execution_out
  #[why] cache still pulled: `make lint` and `render-docs` compile the tree, no artifact replaces that
  cache:
    - key: go-build
      paths:
        - .cache/go-build
      policy: pull
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

.test-module:
  image: $CI_IMAGE
  stage: test-unit
  #[why] starts immediately. these jobs never consumed warm-go's artifacts (artifacts: false), only
  #   its go build cache, so waiting on it bought nothing but latency: `go test` links its own test
  #   binaries, a different artifact set from the single binary warm-go produces. with a distributed
  #   cache they pull the same warm GOCACHE without the dependency
  needs: []
  script:
    - make -C $MODULE test-cover
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $MODULE/coverage.xml

test-unit-che:
  extends: .test-module
  before_script:
    - ci/vendor-packages-defs.zsh
  variables:
    MODULE: che
  cache:
    - key: go-build
      paths:
        - .cache/go-build
      policy: pull
  coverage: null
  artifacts:
    reports: null
    paths:
      - che/cover-unit/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]

.test-e2e-che:
  extends: .vendors-packages
  image: $CI_IMAGE
  stage: test-e2e
  #[why] only the built artifacts move: the prebuilt binary and e2e harness, no go caches
  needs:
    - warm-go
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-e2e-che-dryrun:
  extends: .test-e2e-che
  script:
    - make -C che e2e-dryrun BUILD_DEP= E2E_USE_TEST_BIN=1
  artifacts:
    paths:
      - che/cover-e2e-dryrun/

test-e2e-che-run:
  extends: .test-e2e-che
  script:
    - make -C che e2e-run BUILD_DEP= E2E_USE_TEST_BIN=1
  artifacts:
    paths:
      - che/cover-e2e-run/

test-e2e-che-backup:
  extends: .test-e2e-che
  script:
    - make -C che e2e-backup BUILD_DEP= E2E_USE_TEST_BIN=1
  artifacts:
    paths:
      - che/cover-e2e-backup/

##[>] 🤖🤖
#[what] registry e2e: every brew formula/cask name in the builtin packages file resolves upstream
#[why] the real-install e2e samples one package per method and brew only runs on darwin:
#   a renamed upstream name (cask ollama -> ollama-app) is invisible without this sweep
test-e2e-che-registry:
  extends: .test-e2e-che
  script:
    - make -C che e2e-registry E2E_USE_TEST_BIN=1
##[<] 🤖🤖

##[>] 🤖🤖
#[what] build the install-e2e container base image (debian + ca-certificates) once per pipeline, both arches, shared as docker-save tars
warm-e2e-pkg-installs-image:
  stage: warm
  image: $GRP_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/docker:28
  services:
    - name: $GRP_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/docker:dind
      alias: docker
  needs: []
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  #[why] only feeds the manual install-e2e matrices: stays manual with them, never auto
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use dind
    - mkdir -p e2e-images
    - docker buildx build --platform linux/amd64 --tag che-e2e-debian:amd64 --build-arg "BASE_IMAGE=$GRP_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/debian:bookworm-slim" --output type=docker,dest=e2e-images/che-e2e-debian-amd64.tar --file che/e2e/install-methods.Dockerfile che/e2e
    - docker buildx build --platform linux/arm64 --tag che-e2e-debian:arm64 --build-arg "BASE_IMAGE=$GRP_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/debian:bookworm-slim" --output type=docker,dest=e2e-images/che-e2e-debian-arm64.tar --file che/e2e/install-methods.Dockerfile che/e2e
  artifacts:
    paths:
      - e2e-images/

#[what] darwin warm build: cover binary + e2e harness, shared by the darwin install jobs via artifact
#[why] the linux artifact is the wrong platform: without this every darwin matrix job links its own
warm-go-darwin:
  extends: .vendors-packages
  stage: warm
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  needs: []
  cache:
    - key: mr-go-build-che-darwin
      paths:
        - .cache/go-build
      policy: pull-push
  #[why] only feeds the manual darwin install-e2e matrix: stays manual with it, never auto
  rules:
    - if: $GRP_VAR_ENABLE_DARWIN_CI != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - curl -fsSL --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -o /tmp/go.tar.gz "https://go.dev/dl/go1.26.4.darwin-arm64.tar.gz"
    - sudo tar -xzf /tmp/go.tar.gz -C /usr/local
    - export PATH=/usr/local/go/bin:$PATH
  script:
    - make -C che build-cover build-e2e-test
  artifacts:
    paths:
      - che/dist/

#[what] no-deps install e2e: up to 5 chosen packages per method, each install in a fresh debian container via dind
#[why] with_no_deps proves each package pulls its own dependencies; the curated per-method subset keeps MR pipelines fast and deterministic, the manual per-package jobs and local PACKAGE=all cover the full set
test-e2e-install-methods:
  extends: .vendors-packages
  stage: test-e2e-method-installs
  image: $CI_IMAGE_DIND
  services:
    - name: $GRP_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/docker:dind
      alias: docker
  needs:
    - job: warm-go
      optional: true
    #[why] optional like the rest: unclicked, the script's `test -x` fallback builds the binary in-job
    - job: warm-go-linux-amd64
      optional: true
    - job: warm-e2e-pkg-installs-image
      optional: true
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    #[why] docker run -v paths must live under /builds, the only volume the dind service shares with the job
    E2E_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/che-e2e-install
  parallel:
    matrix:
      - METHOD: [apt, binariesRemoteArchive, script, pyenv, nvm, npm, go, nix, buildFromSource]
  #[why] never automatic: these dind matrix jobs flood the runner queue and starve every other repo's pipeline. manual, optional, always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  #[why] the chosen packages live here, not in the matrix: matrix variables all land in the job name, METHOD alone keeps it readable
  script:
    - case "$METHOD" in
        apt) PACKAGE=jq,bat,fd,htop,tree;;
        binariesRemoteArchive) PACKAGE=yq,kubectl,cilium,kind,lefthook;;
        script) PACKAGE=pyenv,nvm;;
        pyenv) PACKAGE=python3;;
        nvm) PACKAGE=node;;
        npm) PACKAGE=ccstatusline,pnpm,tsc,pyright,typescript-language-server;;
        go) PACKAGE=gopls,get-os-open-files-with;;
        nix) PACKAGE=jq,bat;;
        buildFromSource) PACKAGE=ruby;;
      esac
    - test -f e2e-images/che-e2e-debian-amd64.tar && docker load --quiet -i e2e-images/che-e2e-debian-amd64.tar || true
    - make -C che e2e-install-methods MODE=with_no_deps METHOD="$METHOD" PACKAGE="$PACKAGE" $(test -x che/dist/e2e.test && echo "BUILD_DEP= E2E_USE_TEST_BIN=1") $(test -x che/dist/che-linux-amd64 && echo "E2E_INSTALL_METHODS_DEPS=")
  artifacts:
    paths:
      - che/cover-e2e-install-methods/
##[<] 🤖🤖

coverage-che:
  extends: .vendors-packages
  image: $CI_IMAGE
  stage: coverage
  needs:
    - test-unit-che
    - test-e2e-che-dryrun
    - test-e2e-che-run
    - test-e2e-che-backup
    #[why] conditional/manual allow_failure jobs: optional so skipped runs don't block the report
    - job: test-install-methods
      optional: true
  script:
    - make -C che cover-report
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: che/coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-unit-get-os-open-files-with:
  extends: .test-module
  variables:
    MODULE: get-os-open-files-with
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [get-os-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-os-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-unit-get-term-open-files-with:
  extends: .test-module
  variables:
    MODULE: get-term-open-files-with
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [get-term-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-term-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-unit-lib:
  extends: .test-module
  variables:
    MODULE: lib
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lib/**/*, go.work, .gitlab-ci.yml]

.release-module:
  interruptible: false
  stage: release
  image: $CI_IMAGE
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GIT_DEPTH: "0"
  script:
    - make create-tag MODULE=$MODULE BRANCH="$CI_COMMIT_BRANCH" REF="$CI_COMMIT_SHA" DEFAULT_BRANCH="$CI_DEFAULT_BRANCH"

release-che:
  extends: .release-module
  variables:
    MODULE: che
  #[why] the catalog lives in konradodwrot/che-packages now, pinned by the $CHE_PACKAGES_REF group
  #   CI variable rather than a file in che/: raising it releases nothing here, and the next che
  #   release vendors and embeds whatever it names
  #[why] the publish scripts too, not just che/: the brew formula and the install script are written
  #   by them and only republished by a tag, so a fix to either sat unreleased on main while
  #   `brew install che` kept failing on binaries the tarball no longer ships
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, ci/publish-brew-formula.zsh, ci/publish.zsh]

release-get-os-open-files-with:
  extends: .release-module
  variables:
    MODULE: get-os-open-files-with
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-os-open-files-with/**/*]

release-get-term-open-files-with:
  extends: .release-module
  variables:
    MODULE: get-term-open-files-with
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-term-open-files-with/**/*]

release-lib:
  extends: .release-module
  variables:
    MODULE: lib
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lib/**/*]

.pages-build:
  image:
    name: squidfunk/mkdocs-material:9
    entrypoint: [""]
  needs: []
  #[why] off by default: only the job publishing the live site needs the carry
  variables:
    CARRY_APT: "0"
    APT_SITE_URL: https://konradodwrot.gitlab.io/go-modules/apt
  script:
    - mkdir -p che/docs/assets/data
    - cp che/assets/data/che.schema.json che/docs/assets/data/
    - sed -i 's|(\.\./assets/data/che.schema.json)|(assets/data/che.schema.json)|g' che/docs/spec.md
    - printf '# che\n' > che/docs/index.md
    ##[>] 🤖🤖
    - PROSE_REF=$(sed -n 's|.*konradodwrot/prose?ref=\(v[0-9.]*\)".*|\1|p' che.yml | head -1)
    - wget -qO che/docs/purpose-src.md "https://gitlab.com/konradodwrot/prose/-/raw/$PROSE_REF/repos/go-modules/che-purpose.md"
    - tail -n +2 che/docs/purpose-src.md >> che/docs/index.md
    - rm che/docs/purpose-src.md
    - printf '\n## Install\n\n' >> che/docs/index.md
    - printf '```sh\ncurl -fsSL https://konradodwrot.gitlab.io/go-modules/install.sh | sh\n```\n' >> che/docs/index.md
    ##[<] 🤖🤖
    - printf '# License\n\n```\n' > che/docs/license.md
    - cat LICENSE >> che/docs/license.md
    - printf '```\n' >> che/docs/license.md
    - cd che && mkdocs build --site-dir ../public
    ##[>] 🤖🤖
    - cp install.sh ../public/install.sh
    #[why] a Pages deploy replaces the whole site: without this, a build that has no apt tree drops
    #   apt/ from the live site and breaks `apt-get update` until the next che tag. from the site,
    #   not the job artifact: that expires in a day
    #[why] gnu wget, installed first: the mkdocs image is alpine, whose busybox wget has no --mirror
    #   and exits "unrecognized option". the `|| rm -rf` swallowed that, so the carry silently did
    #   nothing and a deploy dropped apt/ from the live site
    - if [ ! -d ../public-apt ] && [ "$CARRY_APT" = "1" ]; then
        (command -v wget >/dev/null && wget --help 2>&1 | grep -q -- --mirror) || apk add --no-cache wget;
        wget -q --mirror --no-host-directories --no-parent --cut-dirs=1 --directory-prefix=../public-apt "$APT_SITE_URL/" || rm -rf ../public-apt;
      fi
    #[why] a carry that was possible and did not happen fails the job: silently replacing the live
    #   apt repo with one that 404s is worse than not deploying. a site that serves no apt/ yet is
    #   the exception, since the tree only returns with the next che tag, so the probe decides
    - if [ "$CARRY_APT" = "1" ] && [ ! -s ../public-apt/dists/stable/Release ]; then
        if wget -q -O /dev/null "$APT_SITE_URL/dists/stable/Release"; then
          echo "apt is live but the carry produced no Release file, refusing to deploy without it" >&2;
          exit 1;
        fi;
        echo "no apt/ on the live site yet, deploying without it (returns with the next che tag)";
      fi
    - if [ -d ../public-apt ]; then cp -R ../public-apt ../public/apt; fi
    ##[<] 🤖🤖
    - echo "docs preview -> https://konradodwrot.gitlab.io/-/go-modules/-/jobs/$CI_JOB_ID/artifacts/public/index.html"
  artifacts:
    paths:
      - public

publish-pages:
  interruptible: false
  extends: .pages-build
  stage: publish
  pages: true
  #[why] no publish-apt-che: it is tag-only now, so no apt tree exists in a main pipeline. CARRY_APT
  #   copies the last published one through rather than rebuilding it
  needs:
    - release-che
  variables:
    CARRY_APT: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*]

docs-che:
  extends: .pages-build
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  variables:
    DOCS_DIR_URLS: "false"
  artifacts:
    paths:
      - public
    expire_in: 1 day

pages-preview:
  extends: .pages-build
  stage: verify
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    DOCS_DIR_URLS: "false"
  environment:
    name: docs-preview/$CI_MERGE_REQUEST_IID
    url: https://konradodwrot.gitlab.io/-/go-modules/-/jobs/$CI_JOB_ID/artifacts/public/index.html
  artifacts:
    expose_as: docs preview
    paths:
      - public
    expire_in: 1 week

#[why] goreleaser builds 5 binaries (che + 4 render CLIs) concurrently, each compiling the full
#   dep tree (gomplate, gcp sdk, go-git, otel): the peak was OOMKilled at exit 137 on the default
#   medium size's 6Gi ceiling, the big runner's 12Gi holds it. everything else stays medium
.goreleaser-build:
  extends: .vendors-packages
  tags:
    - gke-linux-amd64-big

#[why] darwin builds cross-compile on linux: che is CGO_ENABLED=0, so no macOS SDK or runner is needed
goreleaser-darwin-che:
  interruptible: false
  extends: .goreleaser-build
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  cache:
    - key: go-build-che-darwin
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - export MODULE_VERSION="${CI_COMMIT_TAG#che/v}"
    - cd che && goreleaser release --verbose --snapshot --clean -f .goreleaser.darwin.yaml
  artifacts:
    paths:
      - che/darwin-dist/*.tar.gz
    expire_in: 1 day

goreleaser-linux-che:
  interruptible: false
  extends: .goreleaser-build
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  cache:
    - key: go-build-che-zig-$ARCH
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - export MODULE_VERSION="${CI_COMMIT_TAG#che/v}"
    - cd che
    - yq '.builds[].goarch = [strenv(ARCH)]' .goreleaser.yaml > ".goreleaser.linux-$ARCH.yaml"
    - goreleaser release --verbose --snapshot --clean -f ".goreleaser.linux-$ARCH.yaml"
  artifacts:
    paths:
      - che/dist/*.tar.gz
      - che/dist/*.deb
    expire_in: 1 day

prerelease-darwin-che:
  interruptible: false
  extends: .goreleaser-build
  stage: release
  image: $CI_IMAGE
  #[why] unit + the automatic che e2e jobs: a prerelease must not publish from code failing them.
  #   the manual install-methods matrix stays out (it would block on a click) and so does the
  #   registry sweep (it asserts upstream package names, not the binary this ships), keeping the
  #   coverage stage off the critical path
  needs:
    - job: test-unit-che
      optional: true
      artifacts: false
    - job: test-e2e-che-dryrun
      optional: true
      artifacts: false
    - job: test-e2e-che-run
      optional: true
      artifacts: false
    - job: test-e2e-che-backup
      optional: true
      artifacts: false
  #[why] the publish path itself is in scope: a change to the prerelease script, the Makefile target
  #   or this file must publish a prerelease, or it can never be tested before merging
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, ci/publish-prerelease.zsh, Makefile, .gitlab-ci.yml]
  variables:
    MODULE_VERSION: 0.0.0-mr${CI_MERGE_REQUEST_IID}
  cache:
    - key: mr-go-build-che-darwin
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - cd che && goreleaser release --verbose --snapshot --clean -f .goreleaser.darwin.yaml
    - make -C .. publish-prerelease DIST_DIR=darwin-dist
  artifacts:
    expose_as: che darwin prerelease
    paths:
      - che/darwin-dist/
    expire_in: 1 week

prerelease-linux-che:
  interruptible: false
  extends: .goreleaser-build
  stage: release
  image: $CI_IMAGE
  #[why] unit + the automatic che e2e jobs: a prerelease must not publish from code failing them.
  #   the manual install-methods matrix stays out (it would block on a click) and so does the
  #   registry sweep (it asserts upstream package names, not the binary this ships), keeping the
  #   coverage stage off the critical path
  needs:
    - job: test-unit-che
      optional: true
      artifacts: false
    - job: test-e2e-che-dryrun
      optional: true
      artifacts: false
    - job: test-e2e-che-run
      optional: true
      artifacts: false
    - job: test-e2e-che-backup
      optional: true
      artifacts: false
  #[why] the publish path itself is in scope: a change to the prerelease script, the Makefile target
  #   or this file must publish a prerelease, or it can never be tested before merging
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, ci/publish-prerelease.zsh, Makefile, .gitlab-ci.yml]
  variables:
    MODULE_VERSION: 0.0.0-mr${CI_MERGE_REQUEST_IID}
    ARCH: amd64
  cache:
    - key: mr-go-build-che-zig-amd64
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - cd che
    - yq '.builds[].goarch = [strenv(ARCH)]' .goreleaser.yaml > ".goreleaser.linux-$ARCH.yaml"
    - goreleaser release --verbose --snapshot --clean -f ".goreleaser.linux-$ARCH.yaml"
    - make -C .. publish-prerelease DIST_DIR=dist
  artifacts:
    expose_as: che linux prerelease
    paths:
      - che/dist/
    expire_in: 1 week

publish-che:
  interruptible: false
  stage: publish
  image: $CI_IMAGE
  needs:
    - goreleaser-darwin-che
    - goreleaser-linux-che
    - docs-che
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  variables:
    PUBLISH_PREBUILT: "1"
  script:
    - make publish

##[>] 🤖🤖
#[why] tag only: the tree is rebuilt from the registry's .debs, and only a tag adds one. on main it
#   re-signed an unchanged tree on every commit touching che/
publish-apt-che:
  interruptible: false
  stage: publish
  image: $CI_IMAGE
  needs:
    - job: publish-che
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  script:
    - apt-get update && apt-get install -y --no-install-recommends aptly gnupg
    - make publish-apt
  artifacts:
    paths:
      - public-apt
    expire_in: 1 day

publish-pages-tag:
  interruptible: false
  extends: .pages-build
  stage: publish
  pages: true
  needs:
    - publish-apt-che
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/

publish-brew-che:
  interruptible: false
  stage: publish
  image: $CI_IMAGE
  needs:
    - publish-che
    - goreleaser-darwin-che
    - goreleaser-linux-che
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  script:
    - make publish-brew

publish-ci-image:
  interruptible: false
  stage: trigger-downstream
  needs: [publish-che]
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  inherit:
    variables: false
  variables:
    BUILD_ALL_IMAGES: "true"
  trigger:
    project: konradodwrot/infra/oci-images
    branch: main
    forward:
      yaml_variables: true
      pipeline_variables: false
##[<] 🤖🤖

publish-get-os-open-files-with:
  interruptible: false
  stage: publish
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^get-os-open-files-with\/v/
  script:
    - make publish

publish-get-term-open-files-with:
  interruptible: false
  stage: publish
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^get-term-open-files-with\/v/
  script:
    - make publish
