##[>] 🤖🤖
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: .gitlab/ci/test-install-packages.gitlab-ci.yml

#[why] retry infrastructure flakes (image pulls, runner/network, stuck jobs) twice; script failures never retry, a real test failure stays red
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

stages:
  - warm
  - verify
  - test-unit
  - test-e2e
  - test-e2e-method-installs
  - test-e2e-package-installs-darwin-arm64
  - test-e2e-package-installs-linux-amd64
  - test-e2e-package-installs-linux-arm64
  - coverage
  - release
  - publish
  - trigger-downstream

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
  CI_IMAGE_ARM64: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest-arm64
  CI_IMAGE_DIND: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux-dind:latest
  CI_IMAGE_DIND_ARM64: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux-dind:latest-arm64
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  CC: clang

#[what] amd64 linux warm build: go caches plus the amd64 che artifacts the e2e jobs reuse, native plus zig-cross amd64
warm-go:
  stage: warm
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
  cache:
    - key: go-mod
      paths:
        - .cache/go-mod
      policy: pull-push
    - key: go-build
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - for m in lib che get-os-open-files-with get-term-open-files-with; do (cd $m && echo "## download $m" && go mod download all) || exit 1; done
    - for m in lib che; do (cd $m && echo "## build $m" && go build -v ./...) || exit 1; done
    - make -C che build-cover build-e2e-test build-linux
  artifacts:
    paths:
      - che/dist/

##[>] 🤖🤖
#[what] arm64 linux warm build: zig-cross arm64 che artifacts for the arm64 install e2e jobs
#[why] shares goreleaser-linux-che [arm64]'s go-build key: both zig-cross che for arm64, tag and MR pipelines warm each other
warm-go-linux-arm64:
  stage: warm
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
  cache:
    - key: go-mod
      paths:
        - .cache/go-mod
      policy: pull
    - key: go-build-che-zig-arm64
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - make -C che build-linux build-cover-linux build-e2e-test-linux PLATFORM=linux-arm64
  artifacts:
    paths:
      - che/dist/linux-arm64/
      - che/dist/che-linux-arm64
##[<] 🤖🤖

verify-precommit-all:
  stage: verify
  image: $CI_IMAGE
  needs: [warm-go]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    LEFTHOOK_OUTPUT: meta,summary,execution,execution_info,execution_out
  cache:
    - key: go-mod
      paths:
        - .cache/go-mod
      policy: pull
    - key: go-build
      paths:
        - .cache/go-build
      policy: pull
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

.test-module:
  image: $CI_IMAGE
  stage: test-unit
  needs:
    - job: warm-go
      optional: true
      artifacts: false
  script:
    - make -C $MODULE test-cover
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $MODULE/coverage.xml

test-unit-che:
  extends: .test-module
  variables:
    MODULE: che
  cache:
    - key: go-mod
      paths:
        - .cache/go-mod
      policy: pull
    - key: go-build
      paths:
        - .cache/go-build
      policy: pull
  coverage: null
  artifacts:
    reports: null
    paths:
      - che/cover-unit/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]

.test-e2e-che:
  image: $CI_IMAGE
  stage: test-e2e
  #[why] only the built artifacts move: the prebuilt binary and e2e harness, no go caches
  needs:
    - warm-go
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-e2e-che-dryrun:
  extends: .test-e2e-che
  script:
    - make -C che e2e-dryrun BUILD_DEP= E2E_USE_TEST_BIN=1
  artifacts:
    paths:
      - che/cover-e2e-dryrun/

test-e2e-che-run:
  extends: .test-e2e-che
  script:
    - make -C che e2e-run BUILD_DEP= E2E_USE_TEST_BIN=1
  artifacts:
    paths:
      - che/cover-e2e-run/

test-e2e-che-backup:
  extends: .test-e2e-che
  script:
    - make -C che e2e-backup BUILD_DEP= E2E_USE_TEST_BIN=1
  artifacts:
    paths:
      - che/cover-e2e-backup/

##[>] 🤖🤖
#[what] registry e2e: every brew formula/cask name in the builtin packages file resolves upstream
#[why] the real-install e2e samples one package per method and brew only runs on darwin:
#   a renamed upstream name (cask ollama -> ollama-app) is invisible without this sweep
test-e2e-che-registry:
  extends: .test-e2e-che
  script:
    - make -C che e2e-registry E2E_USE_TEST_BIN=1
##[<] 🤖🤖

##[>] 🤖🤖
#[what] build the install-e2e container base image (debian + ca-certificates) once per pipeline, both arches, shared as docker-save tars
warm-e2e-pkg-installs-image:
  stage: warm
  image: docker:28
  services: [docker:dind]
  needs: []
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use dind
    - mkdir -p e2e-images
    - docker buildx build --platform linux/amd64 --tag che-e2e-debian:amd64 --output type=docker,dest=e2e-images/che-e2e-debian-amd64.tar --file che/e2e/install-methods.Dockerfile che/e2e
    - docker buildx build --platform linux/arm64 --tag che-e2e-debian:arm64 --output type=docker,dest=e2e-images/che-e2e-debian-arm64.tar --file che/e2e/install-methods.Dockerfile che/e2e
  artifacts:
    paths:
      - e2e-images/

#[what] darwin warm build: cover binary + e2e harness, shared by the darwin install jobs via artifact
#[why] the linux artifact is the wrong platform: without this every darwin matrix job links its own
warm-go-darwin:
  stage: warm
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  needs: []
  #[why] shares goreleaser-darwin-che's cache keys: both compile che on darwin, tag and MR pipelines warm each other
  cache:
    - key: go-mod-che
      paths:
        - .cache/go-mod
      policy: pull-push
    - key: go-build-che-darwin
      paths:
        - .cache/go-build
      policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
  before_script:
    - curl -fsSL --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -o /tmp/go.tar.gz "https://go.dev/dl/go1.26.4.darwin-arm64.tar.gz"
    - sudo tar -xzf /tmp/go.tar.gz -C /usr/local
    - export PATH=/usr/local/go/bin:$PATH
  script:
    - make -C che build-cover build-e2e-test
  artifacts:
    paths:
      - che/dist/

#[what] no-deps install e2e: up to 5 chosen packages per method, each install in a fresh debian container via dind
#[why] with_no_deps proves each package pulls its own dependencies; the curated per-method subset keeps MR pipelines fast and deterministic, the manual per-package jobs and local PACKAGE=all cover the full set
test-e2e-install-methods:
  stage: test-e2e-method-installs
  image: $CI_IMAGE_DIND
  services: [docker:dind]
  needs:
    - job: warm-go
      optional: true
    - job: warm-e2e-pkg-installs-image
      optional: true
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    #[why] docker run -v paths must live under /builds, the only volume the dind service shares with the job
    E2E_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/che-e2e-install
  parallel:
    matrix:
      - METHOD: [apt, binariesRemoteArchive, script, pyenv, nvm, npm, go, nix, buildFromSource]
  #[why] MR changes-triggered runs block the merge; main keeps allow_failure, manual stays optional
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  #[why] the chosen packages live here, not in the matrix: matrix variables all land in the job name, METHOD alone keeps it readable
  script:
    - case "$METHOD" in
        apt) PACKAGE=jq,bat,fd,htop,tree;;
        binariesRemoteArchive) PACKAGE=yq,kubectl,cilium,kind,lefthook;;
        script) PACKAGE=pyenv,nvm;;
        pyenv) PACKAGE=python3;;
        nvm) PACKAGE=node;;
        npm) PACKAGE=ccstatusline,pnpm,tsc,pyright,typescript-language-server;;
        go) PACKAGE=gopls,get-os-open-files-with;;
        nix) PACKAGE=jq,bat;;
        buildFromSource) PACKAGE=ruby;;
      esac
    - test -f e2e-images/che-e2e-debian-amd64.tar && docker load --quiet -i e2e-images/che-e2e-debian-amd64.tar || true
    - make -C che e2e-install-methods MODE=with_no_deps METHOD="$METHOD" PACKAGE="$PACKAGE" $(test -x che/dist/e2e.test && echo "BUILD_DEP= E2E_USE_TEST_BIN=1") $(test -x che/dist/che-linux-amd64 && echo "E2E_INSTALL_METHODS_DEPS=")
  artifacts:
    paths:
      - che/cover-e2e-install-methods/
##[<] 🤖🤖

coverage-che:
  image: $CI_IMAGE
  stage: coverage
  needs:
    - test-unit-che
    - test-e2e-che-dryrun
    - test-e2e-che-run
    - test-e2e-che-backup
    #[why] conditional/manual allow_failure jobs: optional so skipped runs don't block the report
    - job: test-install-methods
      optional: true
  script:
    - make -C che cover-report
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: che/coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-unit-get-os-open-files-with:
  extends: .test-module
  variables:
    MODULE: get-os-open-files-with
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [get-os-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-os-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-unit-get-term-open-files-with:
  extends: .test-module
  variables:
    MODULE: get-term-open-files-with
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [get-term-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-term-open-files-with/**/*, lib/**/*, go.work, .gitlab-ci.yml]

test-unit-lib:
  extends: .test-module
  variables:
    MODULE: lib
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [lib/**/*, go.work, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lib/**/*, go.work, .gitlab-ci.yml]

.release-module:
  stage: release
  image: $CI_IMAGE
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GIT_DEPTH: "0"
  script:
    - make create-tag MODULE=$MODULE BRANCH="$CI_COMMIT_BRANCH" REF="$CI_COMMIT_SHA" DEFAULT_BRANCH="$CI_DEFAULT_BRANCH"

release-che:
  extends: .release-module
  variables:
    MODULE: che
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*]

release-get-os-open-files-with:
  extends: .release-module
  variables:
    MODULE: get-os-open-files-with
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-os-open-files-with/**/*]

release-get-term-open-files-with:
  extends: .release-module
  variables:
    MODULE: get-term-open-files-with
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [get-term-open-files-with/**/*]

release-lib:
  extends: .release-module
  variables:
    MODULE: lib
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [lib/**/*]

.pages-build:
  image:
    name: squidfunk/mkdocs-material:9
    entrypoint: [""]
  needs: []
  script:
    - mkdir -p che/docs/assets/data
    - cp che/assets/data/che.schema.json che/docs/assets/data/
    - sed -i 's|(\.\./assets/data/che.schema.json)|(assets/data/che.schema.json)|g' che/docs/spec.md
    - printf '# che\n' > che/docs/index.md
    - tail -n +2 che/assets/docs-agents/purpose.md >> che/docs/index.md
    ##[>] 🤖🤖
    - printf '\n## Install\n\n' >> che/docs/index.md
    - printf '```sh\ncurl -fsSL https://konradodwrot.gitlab.io/go-modules/install.sh | sh\n```\n' >> che/docs/index.md
    ##[<] 🤖🤖
    - printf '# License\n\n```\n' > che/docs/license.md
    - cat LICENSE >> che/docs/license.md
    - printf '```\n' >> che/docs/license.md
    - cd che && mkdocs build --site-dir ../public
    ##[>] 🤖🤖
    - cp install.sh ../public/install.sh
    - if [ -d ../public-apt ]; then cp -R ../public-apt ../public/apt; fi
    ##[<] 🤖🤖
    - echo "docs preview -> https://konradodwrot.gitlab.io/-/go-modules/-/jobs/$CI_JOB_ID/artifacts/public/index.html"
  artifacts:
    paths:
      - public

publish-pages:
  extends: .pages-build
  stage: publish
  pages: true
  needs:
    - release-che
    - publish-apt-che
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*]

docs-che:
  extends: .pages-build
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  variables:
    DOCS_DIR_URLS: "false"
  artifacts:
    paths:
      - public
    expire_in: 1 day

pages-preview:
  extends: .pages-build
  stage: verify
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    DOCS_DIR_URLS: "false"
  environment:
    name: docs-preview/$CI_MERGE_REQUEST_IID
    url: https://konradodwrot.gitlab.io/-/go-modules/-/jobs/$CI_JOB_ID/artifacts/public/index.html
  artifacts:
    expose_as: docs preview
    paths:
      - public
    expire_in: 1 week

goreleaser-darwin-che:
  stage: release
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  variables:
    GOPATH: $CI_PROJECT_DIR/.cache/go-path
    GO_VERSION: 1.26.4
    GO_SHA256_DARWIN_ARM64: b62ad2b6d7d2464f12a5bcad7ff47f19d08325773b5efd21610e445a05a9bf53
    GORELEASER_VERSION: 2.16.0
    GORELEASER_SHA256_DARWIN_ARM64: 8f6898256f35531165d90f2db581c5ee0d32bda83ebc25ac231ff5bdb9d2071a
  cache:
    - key: go-mod-che
      paths:
        - .cache/go-mod
      policy: pull-push
    - key: go-build-che-darwin
      paths:
        - .cache/go-build
      policy: pull-push
  before_script:
    - curl --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go${GO_VERSION}.darwin-arm64.tar.gz"
    - echo "$GO_SHA256_DARWIN_ARM64  /tmp/go.tar.gz" | shasum -a 256 -c -
    - tar -C "$HOME" -xzf /tmp/go.tar.gz
    - curl --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -fsSL -o /tmp/goreleaser.tar.gz "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Darwin_arm64.tar.gz"
    - echo "$GORELEASER_SHA256_DARWIN_ARM64  /tmp/goreleaser.tar.gz" | shasum -a 256 -c -
    - mkdir -p "$HOME/bin"
    - tar -C "$HOME/bin" -xzf /tmp/goreleaser.tar.gz goreleaser
    - export PATH="$HOME/go/bin:$HOME/bin:$PATH"
    - go version
    - goreleaser --version
  script:
    - export MODULE_VERSION="${CI_COMMIT_TAG#che/v}"
    - cd che && goreleaser release --verbose --snapshot --clean -f .goreleaser.darwin.yaml
  artifacts:
    paths:
      - che/darwin-dist/*.tar.gz
    expire_in: 1 day

goreleaser-linux-che:
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  cache:
    - key: go-mod
      paths:
        - .cache/go-mod
      policy: pull
    - key: go-build-che-zig-$ARCH
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - export MODULE_VERSION="${CI_COMMIT_TAG#che/v}"
    - cd che
    - yq '.builds[].goarch = [strenv(ARCH)]' .goreleaser.yaml > ".goreleaser.linux-$ARCH.yaml"
    - goreleaser release --verbose --snapshot --clean -f ".goreleaser.linux-$ARCH.yaml"
  artifacts:
    paths:
      - che/dist/*.tar.gz
      - che/dist/*.deb
    expire_in: 1 day

prerelease-darwin-che:
  stage: release
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*]
  variables:
    MODULE_VERSION: 0.0.0-mr${CI_MERGE_REQUEST_IID}
    GOPATH: $CI_PROJECT_DIR/.cache/go-path
    GO_VERSION: 1.26.4
    GO_SHA256_DARWIN_ARM64: b62ad2b6d7d2464f12a5bcad7ff47f19d08325773b5efd21610e445a05a9bf53
    GORELEASER_VERSION: 2.16.0
    GORELEASER_SHA256_DARWIN_ARM64: 8f6898256f35531165d90f2db581c5ee0d32bda83ebc25ac231ff5bdb9d2071a
  cache:
    - key: go-mod-che
      paths:
        - .cache/go-mod
      policy: pull-push
    - key: go-build-che-darwin
      paths:
        - .cache/go-build
      policy: pull-push
  before_script:
    - curl --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go${GO_VERSION}.darwin-arm64.tar.gz"
    - echo "$GO_SHA256_DARWIN_ARM64  /tmp/go.tar.gz" | shasum -a 256 -c -
    - tar -C "$HOME" -xzf /tmp/go.tar.gz
    - curl --connect-timeout 30 --retry 10 --retry-delay 30 --retry-all-errors -fsSL -o /tmp/goreleaser.tar.gz "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Darwin_arm64.tar.gz"
    - echo "$GORELEASER_SHA256_DARWIN_ARM64  /tmp/goreleaser.tar.gz" | shasum -a 256 -c -
    - mkdir -p "$HOME/bin"
    - tar -C "$HOME/bin" -xzf /tmp/goreleaser.tar.gz goreleaser
    - export PATH="$HOME/go/bin:$HOME/bin:$PATH"
    - go version
    - goreleaser --version
  script:
    - cd che && goreleaser release --verbose --snapshot --clean -f .goreleaser.darwin.yaml
  artifacts:
    expose_as: che darwin prerelease
    paths:
      - che/darwin-dist/
    expire_in: 1 week

prerelease-linux-che:
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [che/**/*, lib/**/*]
  variables:
    MODULE_VERSION: 0.0.0-mr${CI_MERGE_REQUEST_IID}
    ARCH: amd64
  cache:
    - key: go-mod
      paths:
        - .cache/go-mod
      policy: pull
    - key: go-build-che-zig-amd64
      paths:
        - .cache/go-build
      policy: pull-push
  script:
    - cd che
    - yq '.builds[].goarch = [strenv(ARCH)]' .goreleaser.yaml > ".goreleaser.linux-$ARCH.yaml"
    - goreleaser release --verbose --snapshot --clean -f ".goreleaser.linux-$ARCH.yaml"
  artifacts:
    expose_as: che linux prerelease
    paths:
      - che/dist/
    expire_in: 1 week

publish-che:
  stage: publish
  image: $CI_IMAGE
  needs:
    - goreleaser-darwin-che
    - goreleaser-linux-che
    - docs-che
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  variables:
    PUBLISH_PREBUILT: "1"
  script:
    - make publish

##[>] 🤖🤖
publish-apt-che:
  stage: publish
  image: $CI_IMAGE
  needs:
    - job: publish-che
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [che/**/*]
  script:
    - apt-get update && apt-get install -y --no-install-recommends aptly gnupg
    - make publish-apt
  artifacts:
    paths:
      - public-apt
    expire_in: 1 day

publish-pages-tag:
  extends: .pages-build
  stage: publish
  pages: true
  needs:
    - publish-apt-che
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/

publish-brew-che:
  stage: publish
  image: $CI_IMAGE
  needs:
    - publish-che
    - goreleaser-darwin-che
    - goreleaser-linux-che
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  script:
    - make publish-brew

publish-ci-image:
  stage: trigger-downstream
  needs: [publish-che]
  rules:
    - if: $CI_COMMIT_TAG =~ /^che\/v/
  inherit:
    variables: false
  variables:
    BUILD_ALL_IMAGES: "true"
  trigger:
    project: konradodwrot/infra/oci-images
    branch: main
    forward:
      yaml_variables: true
      pipeline_variables: false
