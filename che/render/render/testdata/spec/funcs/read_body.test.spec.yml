context:
  function: render.ReadBody
cases:
  - name: ShouldStripLeadingFrontmatter
    input:
      args:
        - files:
            d.yml: "---\ntitle: T\n---\nk: v\n"
        - path: d.yml
    expected:
      output: "k: v\n"
  - name: ShouldErrorOnMissingSource
    input:
      args:
        - files:
            d.yml: "k: v\n"
        - path: absent.yml
    expected:
      errorOutput: ['absent.yml', 'no such file or directory']
