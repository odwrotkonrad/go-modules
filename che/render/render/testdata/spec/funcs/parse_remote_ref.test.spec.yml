# [>] 🤖🤖
context:
  function: render.parseRemoteRef
cases:
  - name: ShouldParseBareHostPath
    input:
      args: [ref: "git::gitlab.com/konradodwrot/conventions//conventions/comments/convention.md"]
    expected:
      output:
        repoURL: "https://gitlab.com/konradodwrot/conventions.git"
        sshURL: "ssh://git@gitlab.com/konradodwrot/conventions.git"
        path: conventions/comments/convention.md
        gitRef: ""
  - name: ShouldParseRefSuffix
    input:
      args: [ref: "git::github.com/foo/bar@v1.2.3//docs/x.md"]
    expected:
      output:
        repoURL: "https://github.com/foo/bar.git"
        sshURL: "ssh://git@github.com/foo/bar.git"
        path: docs/x.md
        gitRef: v1.2.3
  - name: ShouldKeepExplicitSchemeVerbatim
    input:
      args: [ref: "git::file:///tmp/repo@main//a/b.md"]
    expected:
      output:
        repoURL: "file:///tmp/repo"
        sshURL: ""
        path: a/b.md
        gitRef: main
  - name: ShouldAnchorRefToLastAtBeforePath
    input:
      args: [ref: "git::git@gitlab.com:g/r.git@v1//p/x.md"]
    expected:
      output:
        repoURL: "https://git@gitlab.com:g/r.git.git"
        sshURL: "ssh://git@git@gitlab.com:g/r.git.git"
        path: p/x.md
        gitRef: v1
  - name: ShouldNotEatScpUserAsRef
    input:
      args: [ref: "git::ssh://git@gitlab.com/g/r.git//p/x.md"]
    expected:
      output:
        repoURL: "ssh://git@gitlab.com/g/r.git"
        sshURL: ""
        path: p/x.md
        gitRef: ""
  - name: ShouldErrorWithoutGitMarker
    input:
      args: [ref: "gitlab.com/x/y//a.md"]
    expected:
      errorOutput: ['want git::<repo>[@<ref>]//<path>']
  - name: ShouldErrorOnRefQuery
    input:
      args: [ref: "git::gitlab.com/x/y//a.md?ref=v1"]
    expected:
      errorOutput: ['?ref= is gone', 'git::<repo>@<ref>//<path>']
  - name: ShouldErrorOnBareTrailingAt
    input:
      args: [ref: "git::gitlab.com/x/y@//a.md"]
    expected:
      errorOutput: ['bare "@"']
  - name: ShouldErrorOnBareTrailingAtWithoutPathSegment
    input:
      args: [ref: "git::repo@//a.md"]
    expected:
      errorOutput: ['bare "@"']
  - name: ShouldErrorWithoutPathSeparator
    input:
      args: [ref: "git::gitlab.com/x/y"]
    expected:
      errorOutput: ['want git::<repo>[@<ref>]//<path>']
  - name: ShouldErrorOnEmptyPath
    input:
      args: [ref: "git::gitlab.com/x/y//"]
    expected:
      errorOutput: ['want git::<repo>[@<ref>]//<path>']
  - name: ShouldErrorOnEmptyRepo
    input:
      args: [ref: "git::///a.md"]
    expected:
      errorOutput: ['want git::<repo>[@<ref>]//<path>']
# [<] 🤖🤖
