# [>] 🤖🤖
context:
  function: render.Compose
cases:
  - name: ShouldPrefixAutogenHeader
    input:
      args:
        - body: "hello\n"
        - headerDest: out.md
        - tmplName: t.ontoRepo.tpl
    expected:
      output: "<!-- autogenerated using t.ontoRepo.tpl -->\nhello\n"
  - name: ShouldInlineAtIncludes
    input:
      args:
        - body: "@inc.md\n"
        - headerDest: AGENTS.md
        - tmplName: a.ontoRepo.tpl
        - opts: {renderReferencedFiles: true}
        - existing: ""
        - files:
            inc.md: "INLINED\n"
    expected:
      output: "<!-- autogenerated using a.ontoRepo.tpl -->\nINLINED\n"
  - name: ShouldMergeUpsertUnderExisting
    input:
      args:
        - body: "A=default\nB=default\n"
        - headerDest: ""
        - tmplName: ""
        - opts: {writeType: mergeUpsert}
        - existing: "B=kept\n"
    expected:
      output: "A=default\nB=kept\n"
  - name: ShouldConsumeMergeActionsUnderMergeUpsert
    input:
      args:
        - body: "A=\x1ealwaysUpdate\x1fnew\nB=\x1ekeepIfExisting\x1fnew\n"
        - headerDest: ""
        - tmplName: ""
        - opts: {writeType: mergeUpsert}
        - existing: "A=old\nB=old\n"
    expected:
      output: "A=new\nB=old\n"
  - name: ShouldStripMergeActionsOnOverwrite
    input:
      args:
        - body: "A=\x1ekeepIfExisting\x1fnew\n"
        - headerDest: out.env
        - tmplName: t.tpl
        - opts: {skipAutoGeneratedHeader: true}
    expected:
      output: "A=new\n"
  - name: ShouldSkipAutoGeneratedHeader
    input:
      args:
        - body: "-----BEGIN OPENSSH PRIVATE KEY-----\nabc\n-----END OPENSSH PRIVATE KEY-----\n"
        - headerDest: /home/ko/.ssh/id_access
        - tmplName: id_access.ontoHost.tpl
        - opts: {skipAutoGeneratedHeader: true}
    expected:
      output: "-----BEGIN OPENSSH PRIVATE KEY-----\nabc\n-----END OPENSSH PRIVATE KEY-----\n"
  - name: ShouldSkipHeaderWithAtInclude
    input:
      args:
        - body: "@inc.md\n"
        - headerDest: AGENTS.md
        - tmplName: a.ontoRepo.tpl
        - opts: {skipAutoGeneratedHeader: true, renderReferencedFiles: true}
        - existing: ""
        - files:
            inc.md: "INLINED\n"
    expected:
      output: "INLINED\n"
  - name: ShouldErrorOnMissingAtIncludeSource
    input:
      args:
        - body: "@absent.md\n"
        - headerDest: AGENTS.md
        - tmplName: a.ontoRepo.tpl
        - opts: {renderReferencedFiles: true}
        - existing: ""
        - files:
            inc.md: "INLINED\n"
    expected:
      errorOutput: ['@-include "@absent.md"', 'no such file or directory']
  - name: ShouldKeepAtIncludeVerbatimWithoutOptIn
    input:
      args:
        - body: "@absent.md\n"
        - headerDest: CLAUDE.md
        - tmplName: a.ontoRepo.tpl
    expected:
      output: "<!-- autogenerated using a.ontoRepo.tpl -->\n@absent.md\n"
  - name: ShouldInjectSectionsUnderPartial
    input:
      args:
        - body: "# [>] gen\nnew\n# [<] gen\n"
        - headerDest: Makefile
        - tmplName: t.tpl
        - opts: {writeType: partial, commentPrefix: "#"}
        - existing: "hand\n# [>] gen\nold\n# [<] gen\nmore\n"
    expected:
      output: "hand\n# [>] gen\nnew\n# [<] gen\nmore\n"
  - name: ShouldWriteWholeBodyUnderPartialWithoutDest
    input:
      args:
        - body: "# [>] gen\nnew\n# [<] gen\n"
        - headerDest: Makefile
        - tmplName: t.tpl
        - opts: {writeType: partial, commentPrefix: "#"}
    expected:
      output: "# [>] gen\nnew\n# [<] gen\n"
  - name: ShouldRequireCommentPrefixUnderPartial
    input:
      args:
        - body: "x\n"
        - headerDest: Makefile
        - tmplName: t.tpl
        - opts: {writeType: partial}
    expected:
      errorOutput: ['writeType partial requires commentPrefix']
  - name: ShouldRejectCommentPrefixWithoutPartial
    input:
      args:
        - body: "x\n"
        - headerDest: Makefile
        - tmplName: t.tpl
        - opts: {commentPrefix: "#"}
    expected:
      errorOutput: ['commentPrefix needs writeType partial']
  - name: ShouldNameTemplateAndDestOnMissingSection
    input:
      args:
        - body: "# [>] gen\nnew\n# [<] gen\n"
        - headerDest: Makefile
        - tmplName: t.tpl
        - opts: {writeType: partial, commentPrefix: "#"}
        - existing: "hand\n"
    expected:
      errorOutput: ['render t.tpl onto Makefile', 'lacks section(s) gen']
