context:
  function: render.IsSecretRefPresent
cases:
  - name: ShouldDetectOpRef
    input:
      args: [body: "token = {{ secret \"op://vault/item/field\" }}"]
    expected:
      output: true
  - name: ShouldDetectGCPRef
    input:
      args: [body: "token = {{ secret \"gcp://project_main/my-secret/latest\" }}"]
    expected:
      output: true
  - name: ShouldDetectOpFuncRef
    input:
      args: [body: "token = {{ op \"op://vault/item/field\" }}"]
    expected:
      output: true
  - name: ShouldIgnoreSchemeMentionedOutsideAnAction
    input:
      args: [body: "secret refs look like op://vault/item or gcp://project/name, resolved by the secret func"]
    expected:
      output: false
  - name: ShouldRejectPlainBody
    input:
      args: [body: "plain text, no secrets here"]
    expected:
      output: false
# [<] 🤖🤖
