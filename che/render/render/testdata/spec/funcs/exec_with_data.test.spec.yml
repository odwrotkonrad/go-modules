# [>] 🤖🤖
context:
  function: render.ExecWithData
cases:
  - name: ShouldExposeVarsUnderDotVar
    input:
      args:
        - body: "name: RO-{{ .var.repo }} rw: RW-{{ .var.repo }}"
        - data: {var: {repo: Notes}}
    expected:
      output: "name: RO-Notes rw: RW-Notes"
  - name: ShouldExposeEnvUnderDotEnv
    input:
      args:
        - body: "ref={{ .env.PROSE_REF }} pin={{ .var.PROSE_REF }}"
        - data: {env: {PROSE_REF: v2}, var: {PROSE_REF: v1}}
    expected:
      output: "ref=v2 pin=v1"
  - name: ShouldFailOnMissingVar
    input:
      args:
        - body: "{{ .var.absent }}"
        - data: {var: {repo: Notes}}
    expected:
      errorOutput: ['render template t.tpl', 'absent']
  - name: ShouldExposeEmptyMapsWithoutData
    input:
      args:
        - body: "{{ len .var }}{{ len .env }}"
    expected:
      output: "00"
  - name: ShouldKeepPlainExecWithoutCtx
    input:
      args:
        - body: 'hello {{ "world" }}'
    expected:
      output: hello world
  - name: ShouldFailOnMissingLocalFileSource
    input:
      args:
        - body: '{{ localFile "absent.md" }}'
    expected:
      errorOutput: ['render template t.tpl', 'localFile "', 'absent.md', 'no such file or directory']
  - name: ShouldFailOnMissingFrontmatterSource
    input:
      args:
        - body: '{{ frontmatter "absent.md" }}'
    expected:
      errorOutput: ['render template t.tpl', 'absent.md', 'no such file or directory']
  - name: ShouldFailOnMissingReadBodySource
    input:
      args:
        - body: '{{ readBody "absent.md" }}'
    expected:
      errorOutput: ['render template t.tpl', 'absent.md', 'no such file or directory']
  - name: ShouldFailOnMissingRenderMarkdownSource
    input:
      args:
        - body: '{{ renderMarkdown "absent.md" }}'
    expected:
      errorOutput: ['render template t.tpl', 'absent.md', 'no such file or directory']
  - name: ShouldSubstituteShellStdoutTrimmed
    context:
      env: {CHE_TEST_SHELL_VAR: fromenv}
    input:
      args:
        - body: |-
            v={{ shell "echo $CHE_TEST_SHELL_VAR" }}
    expected:
      output: "v=\x1ealwaysUpdate\x1ffromenv"
  - name: ShouldRunShellInRepoRoot
    input:
      args:
        - body: |-
            {{ shell "cat x" }}
    expected:
      output: "\x1ealwaysUpdate\x1fx"
  - name: ShouldRetagShellWithKeepIfExisting
    input:
      args:
        - body: '{{ shell "cat x" | keepIfExisting }}'
    expected:
      output: "\x1ekeepIfExisting\x1fx"
  - name: ShouldTagLiteralWithAlwaysUpdate
    input:
      args:
        - body: '{{ "lit" | alwaysUpdate }}'
    expected:
      output: "\x1ealwaysUpdate\x1flit"
  - name: ShouldTagEveryLineOfBlockWithAlwaysUpdate
    input:
      args:
        - body: "{{ \"A=1\\nB=2\\n\" | alwaysUpdate }}"
    expected:
      output: "A=\x1ealwaysUpdate\x1f1\nB=\x1ealwaysUpdate\x1f2\n"
  - name: ShouldTagEveryLineOfBlockWithKeepIfExisting
    input:
      args:
        - body: "{{ \"A=1\\nB=2\\n\" | keepIfExisting }}"
    expected:
      output: "A=\x1ekeepIfExisting\x1f1\nB=\x1ekeepIfExisting\x1f2\n"
  - name: ShouldSkipBlanksAndCommentsWhenTaggingBlock
    input:
      args:
        - body: "{{ \"# c\\n\\nA=1\\n\" | alwaysUpdate }}"
    expected:
      output: "# c\n\nA=\x1ealwaysUpdate\x1f1\n"
  - name: ShouldLeaveUnpipedLiteralUntagged
    input:
      args:
        - body: 'k={{ "lit" }}'
    expected:
      output: k=lit
  - name: ShouldFailOnShellNonZeroExit
    input:
      args:
        - body: '{{ shell "echo boom >&2; exit 3" }}'
    expected:
      errorOutput: ['render template t.tpl', 'shell "echo boom >&2; exit 3"', 'exit status 3', 'boom']
# [<] 🤖🤖
