version: 2

project_name: che

snapshot:
  version_template: '{{ envOrDefault "MODULE_VERSION" "0.0.0-local" }}'

builds:
  - id: che-linux
    main: .
    binary: che
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X gitlab.com/konradodwrot/go-modules/che/internal/cli.version={{.Version}}
    env:
      - CGO_ENABLED=0

archives:
  - id: che
    ids: [che-linux]
    formats: [tar.gz]
    name_template: 'che_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

nfpms:
  - id: che-deb
    ids: [che-linux]
    package_name: che
    file_name_template: 'che_{{ .Version }}_linux_{{ .Arch }}'
    formats: [deb]
    bindir: /usr/bin
    vendor: konradodwrot
    homepage: https://gitlab.com/konradodwrot/go-modules
    maintainer: Konrad Odwrot <odwrotkonrad@gmail.com>
    description: Spec-driven dotfile configuration loader
    license: MIT
    section: utils
    priority: optional

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: darwin-dist/*.tar.gz
    - glob: assets/data/che.schema.json

release:
  disable: true
##[<] 🤖🤖
