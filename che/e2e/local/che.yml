# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

ops-plain:
  include:
    makeLinks:
      - source: plain/link.txt
        dest: 's:^plain:$HOME/plain:'
      - source: plain/link-explicit.txt
        dest:
          - $HOME/plain/link-explicit-a.txt
          - $HOME/plain/link-explicit-b.txt
    makeCopies:
      - source: plain/copy.ontoHost.cp
        dest: 's:^plain:$HOME/plain:'
    renderTemplates:
      - source: plain/tpl.ontoHost.tpl
        dest: 's:^plain:$HOME/plain:'
    makeDirs:
      - directories:
          - $HOME/plain/made-dir
    installPackages:
      - e2e-plain
    installToolPackages:
      vscode:
        - e2e.fake-ext
    runScripts:
      - scripts/plain-script

ops-conditional:
  include:
    makeLinks:
      - source: conditional/link.txt
        dest: 's:^conditional:$HOME/conditional:'
    makeCopies:
      - source: conditional/copy.ontoHost.cp
        dest: 's:^conditional:$HOME/conditional:'
    renderTemplates:
      - source: conditional/tpl.ontoHost.tpl
        dest: 's:^conditional:$HOME/conditional:'
    makeDirs:
      - directories:
          - $HOME/conditional/made-dir
    installPackages:
      - e2e-conditional
    runScripts:
      - scripts/conditional-script

ops-dropped:
  include:
    makeLinks:
      - source: dropped/link.txt
        dest: 's:^dropped:$HOME/dropped:'
    makeCopies:
      - source: dropped/copy.ontoHost.cp
        dest: 's:^dropped:$HOME/dropped:'
    renderTemplates:
      - source: dropped/tpl.ontoHost.tpl
        dest: 's:^dropped:$HOME/dropped:'
    makeDirs:
      - directories:
          - $HOME/dropped/made-dir
    installPackages:
      - e2e-dropped
    runScripts:
      - scripts/dropped-script

dropped:
  options:
    autoDiscover: true
    runIf:
      - env:CHE_E2E_DROPPED
  include:
    profiles:
      - ops-dropped

plain:
  options:
    autoDiscover: true
  include:
    profiles:
      - ops-plain

conditional:
  options:
    autoDiscover: true
    runIf:
      - env:CHE_E2E == 1
  include:
    profiles:
      - ops-conditional

remote-empty:
  options:
    autoDiscover: true
  include:
    profiles:
      - source: "git::file://__REMOTE_DIR__/che.yml::ops-remote"
##[<] 🤖🤖
