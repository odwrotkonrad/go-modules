# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

ops-remote:
  include:
    makeLinks:
      - source: remote/link.txt
        dest: 's:^remote:$HOME/remote:'
    makeCopies:
      - files:
          - source: remote/copy.ontoHost.cp
            dest: 's:^remote:$HOME/remote:'
    renderTemplates:
      - source: remote/tpl.ontoHost.tpl
        dest: 's:^remote:$HOME/remote:'
    makeDirs:
      - directories:
          - $HOME/remote/made-dir
    installPackages:
      - e2e-remote
    runScripts:
      - scripts/remote-script
##[<] 🤖🤖
