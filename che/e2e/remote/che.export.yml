# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
options:
  profileWorkingDirectory: root

profilesDefinitions:
  ops-remote:
    type: host
    include:
      makeLinks:
        - source: remote/link.txt
          dest: 's:^remote:$HOME/remote:'
      makeCopies:
        - source: remote/copy.ontoHost.cp
          dest: 's:^remote:$HOME/remote:'
      renderTemplates:
        - source: remote/tpl.ontoHost.tpl
          dest: 's:^remote:$HOME/remote:'
      makeDirs:
        - directories:
            - $HOME/remote/made-dir
      installPackages:
        - e2e-remote
      runScripts:
        - scripts/remote-script

##[<] 🤖🤖