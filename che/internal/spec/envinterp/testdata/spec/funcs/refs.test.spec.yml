# [>] 🤖🤖
context:
  function: envinterp.Refs
cases:
  - name: ShouldListBareAndDefaultedRefs
    input:
      args:
        - s: '${{ env.A }}/${{ env.B || two }}'
    expected:
      output:
        - {namespace: env, name: A, default: "", hasdefault: false}
        - {namespace: env, name: B, default: two, hasdefault: true}
  - name: ShouldReportEmptyDefaultAsDefault
    input:
      args:
        - s: '${{ env.A || }}'
    expected:
      output:
        - {namespace: env, name: A, default: "", hasdefault: true}
  - name: ShouldListVarRefs
    input:
      args:
        - s: '${{ var.PIN }}@${{ var.OTHER || main }}'
    expected:
      output:
        - {namespace: var, name: PIN, default: "", hasdefault: false}
        - {namespace: var, name: OTHER, default: main, hasdefault: true}
  - name: ShouldListBareRefsWithEmptyNamespace
    input:
      args:
        - s: '${{ repoRoot }}/x/${{ other || y }}'
    expected:
      output:
        - {namespace: "", name: repoRoot, default: "", hasdefault: false}
        - {namespace: "", name: other, default: y, hasdefault: true}
  - name: ShouldReturnNothingForPlainText
    input:
      args:
        - s: 'no refs $HERE'
    expected:
      output: ~
# [<] 🤖🤖
