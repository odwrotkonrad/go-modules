# [>] 🤖🤖
context:
  function: spec.Load
cases:
  - name: ShouldSubstituteProcessEnvInAnyValue
    input:
      args:
        - spec: |
            env: {TREE: '${{ env.BASE }}/tree'}
            specsInclude: ['${{ env.BASE }}/other']
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ env.TREE }}/${{ env.APP || app }}'}
        - layers:
            below: [{name: process env, env: {BASE: /b}}]
        - policy: error
    expected:
      output:
        env: {TREE: /b/tree}
        include: [/b/other]
        workdir: {web: /b/tree/app}
        unset: {}
        sources: {BASE: process env, TREE: spec env}
  - name: ShouldLetSpecEnvWinOverProcessAndRefWinOverSpec
    input:
      args:
        - spec: |
            env: {A: spec, B: spec}
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ env.A }}-${{ env.B }}'}
        - layers:
            below: [{name: process env, env: {A: process, B: process}}]
            above: [{name: ref env, env: {B: ref}}]
        - policy: error
    expected:
      output:
        env: {A: spec, B: spec}
        workdir: {web: spec-ref}
        unset: {}
        sources: {A: spec env, B: ref env}
  - name: ShouldExpandEnvBlockFromLaunchEnvNeverSiblings
    input:
      args:
        - spec: |
            env: {A: one, B: '${{ env.A || none }}'}
        - layers:
            below: [{name: process env, env: {A: process}}]
        - policy: error
    expected:
      output:
        env: {A: one, B: process}
        unset: {}
        sources: {A: process env}
  - name: ShouldReadCheEnvBeneathProcess
    input:
      args:
        - spec: |
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ env.A }}-${{ env.B }}'}
        - layers:
            below:
              - {name: che.env, env: {A: file, B: file}}
              - {name: process env, env: {B: process}}
        - policy: error
    expected:
      output:
        workdir: {web: file-process}
        unset: {}
        sources: {A: che.env, B: process env}
  - name: ShouldPlaceIncludedSpecEnvBeneathInheritedEnv
    input:
      args:
        - spec: |
            env: {A: included, B: included}
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ env.A }}-${{ env.B }}-${{ env.C }}'}
        - layers:
            below: [{name: included che.env, env: {C: included-file}}]
            above: [{name: inherited env, env: {B: parent}}]
        - policy: error
    expected:
      output:
        env: {A: included, B: included}
        workdir: {web: included-parent-included-file}
        lookup: {A: included, B: parent, C: included-file}
        unset: {}
        sources: {A: spec env, B: inherited env, C: included che.env}
  - name: ShouldFailOnUnsetTopLevelRefsListingEveryGap
    input:
      args:
        - spec: |
            env: {X: '${{ env.A }}'}
            specsInclude: ['${{ env.B }}/other']
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['che.yml: unset env vars:', 'A at /env/X', 'B at /specsInclude/0', 'options.envUnset: empty']
  - name: ShouldRecordProfileRefsWithoutFailing
    input:
      args:
        - spec: |
            profilesDefinitions:
              a:
                type: host
                options: {profileWorkingDirectory: '${{ env.A }}'}
              b:
                type: host
                options: {profileWorkingDirectory: '${{ env.B }}/x'}
        - layers:
            below: [{name: process env, env: {A: set}}]
        - policy: error
    expected:
      output:
        workdir: {a: set, b: /x}
        unset: {b: ['B@/profilesDefinitions/b/options/profileWorkingDirectory']}
        sources: {A: process env}
  - name: ShouldReadUnsetAsEmptyUnderEmptyPolicy
    input:
      args:
        - spec: |
            env: {X: '${{ env.A }}'}
        - layers: {}
        - policy: empty
    expected:
      output:
        env: {X: ""}
        unset: {"": ['A@/env/X']}
        sources: {}
  - name: ShouldKeepMappingKeysLiteral
    input:
      args:
        - spec: |
            profilesDefinitions:
              ${{ env.NAME }}:
                type: host
                options: {profileWorkingDirectory: x}
        - layers:
            below: [{name: process env, env: {NAME: web}}]
        - policy: error
    expected:
      output:
        workdir: {'${{ env.NAME }}': x}
        unset: {}
        sources: {}
  - name: ShouldFailOnUnsetVarListingEveryGap
    input:
      args:
        - spec: |
            variablesDefinitions:
              profilesVariablesDefinitions:
                web:
                  A: {required: true}
                  B: {required: true}
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ var.A }}/${{ var.B }}'}
        - layers: {}
        - policy: empty
    expected:
      errorOutput: ['che.yml: unset vars:', 'A at /profilesDefinitions/web/options/profileWorkingDirectory', 'B at /profilesDefinitions/web/options/profileWorkingDirectory', 'cheVariables.yml']
  - name: ShouldInterpolateResolvedVarsAtSpecLevelWhateverTheirScope
    input:
      args:
        - spec: |
            env: {PIN: '${{ var.A }}-${{ var.B }}-${{ var.C }}-${{ var.D }}'}
            specsInclude: ['./${{ var.C }}']
        - layers:
            vars:
              A: {value: a, scope: invokingSpec}
              B: {value: b, scope: invokingSpecDefinedProfiles}
              C: {value: c, scope: recursiveSpecs}
              D: {value: d, scope: recursiveSpecsAndProfiles}
        - policy: error
    expected:
      output:
        env: {PIN: a-b-c-d}
        include: [./c]
        unset: {}
        sources: {}
  - name: ShouldHideSpecOnlyAndRecursiveSpecsVarsFromProfiles
    input:
      args:
        - spec: |
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ var.B }}-${{ var.D }}-${{ var.A || none }}-${{ var.C || none }}'}
        - layers:
            vars:
              A: {value: a, scope: invokingSpec}
              B: {value: b, scope: invokingSpecDefinedProfiles}
              C: {value: c, scope: recursiveSpecs}
              D: {value: d, scope: recursiveSpecsAndProfiles}
        - policy: error
    expected:
      output:
        workdir: {web: b-d-none-none}
        unset: {}
        sources: {}
  - name: ShouldFailOnRecursiveSpecsVarInsideProfile
    input:
      args:
        - spec: |
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ var.C }}'}
        - layers:
            vars:
              C: {value: c, scope: recursiveSpecs}
        - policy: error
    expected:
      errorOutput: ['unset vars:', 'C at /profilesDefinitions/web/options/profileWorkingDirectory']
  - name: ShouldNeverReadEnvAsVar
    input:
      args:
        - spec: |
            env: {PIN: '${{ var.A || none }}'}
        - layers:
            below: [{name: process env, env: {A: env}}]
        - policy: error
    expected:
      output:
        env: {PIN: none}
        unset: {}
        sources: {}
  - name: ShouldLeaveDefinitionsUninterpolated
    input:
      args:
        - spec: |
            variablesDefinitions:
              specVariablesDefinitions:
                A: {description: 'reads ${{ env.NOPE }}'}
            profilesDefinitions:
              web:
                type: host
                variablesDefinitions:
                  B: {description: 'reads ${{ env.NOPE }}'}
                options: {profileWorkingDirectory: x}
        - layers: {}
        - policy: error
    expected:
      output:
        workdir: {web: x}
        unset: {}
        sources: {}
  - name: ShouldRejectUnknownTopLevelKey
    input:
      args:
        - spec: |
            web:
              options: {profileWorkingDirectory: x}
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['unknown top-level key "web": want options | env | variablesDefinitions | specsInclude | profilesDefinitions']
  - name: ShouldRejectOldIncludeKey
    input:
      args:
        - spec: |
            include: {sources: [./other]}
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['unknown top-level key "include"']
  - name: ShouldRejectOldVariablesKey
    input:
      args:
        - spec: |
            variables: {A: x}
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['unknown top-level key "variables"']
  - name: ShouldRejectDefaultInDefinition
    input:
      args:
        - spec: |
            variablesDefinitions:
              specVariablesDefinitions:
                A: {default: x}
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['default is not allowed, put it in cheVariables.defaults.yml']
  - name: ShouldSubstituteBuiltinRepoRootEverywhere
    input:
      args:
        - spec: |
            env: {TPL: '${{ repoRoot }}/templates'}
            specsInclude: ['${{ repoRoot }}/.che/sub']
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ repoRoot }}/root'}
                include:
                  renderTemplates:
                    - source: '${{ repoRoot }}/templates/a.tpl'
                      dest: docs/a.md
        - layers:
            below: [{name: process env, env: {repoRoot: /from-env}}]
            builtins: {repoRoot: /repo}
        - policy: error
    expected:
      output:
        env: {TPL: /repo/templates}
        include: [/repo/.che/sub]
        workdir: {web: /repo/root}
        templates: {web: [/repo/templates/a.tpl]}
        unset: {}
        sources: {}
  - name: ShouldRejectUnknownBuiltin
    input:
      args:
        - spec: |
            profilesDefinitions:
              web:
                type: host
                options: {profileWorkingDirectory: '${{ gitRoot }}/root'}
        - layers:
            builtins: {repoRoot: /repo}
        - policy: error
    expected:
      errorOutput: ['unknown built-in ${{ gitRoot }} at /profilesDefinitions/web/options/profileWorkingDirectory', 'defined: repoRoot']
  - name: ShouldRejectProfileDefinedInBothDefinitionPlaces
    input:
      args:
        - spec: |
            variablesDefinitions:
              profilesVariablesDefinitions:
                web: {A: {}}
            profilesDefinitions:
              web:
                type: host
                variablesDefinitions: {A: {}}
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['profile "web": variablesDefinitions given both in variablesDefinitions.profilesVariablesDefinitions and in the profile']
  - name: ShouldRejectBadScopeInDefinition
    input:
      args:
        - spec: |
            variablesDefinitions:
              specVariablesDefinitions:
                A: {scope: everywhere}
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['scope "everywhere": want invokingSpec | invokingSpecDefinedProfiles | recursiveSpecs | recursiveSpecsAndProfiles']
  - name: ShouldAcceptNullAsAnEmptyDefinition
    input:
      args:
        - spec: |
            env: {PIN: '${{ var.A }}-${{ var.B }}'}
            variablesDefinitions:
              specVariablesDefinitions:
                A:
                B: ~
        - layers:
            vars:
              A: {value: a}
              B: {value: b}
        - policy: error
    expected:
      output:
        env: {PIN: a-b}
        unset: {}
        sources: {}
  - name: ShouldRejectAScalarDefinition
    input:
      args:
        - spec: |
            variablesDefinitions:
              specVariablesDefinitions:
                A: ""
        - layers: {}
        - policy: error
    expected:
      errorOutput: ['want a mapping of required | scope | description | type | enum, or nothing']
