# [>] 🤖🤖
context:
  function: spec.ValidateSchema
cases:
  - name: ShouldAcceptEveryTestutilFixture
    input:
      args: [fixturesGlob: ../testutil/specs/*.yml]
    expected:
      output: ""
  - name: ShouldReturnNoFindingsForUnparseableYAML
    input:
      args: [doc: "p: ["]
    expected:
      output: ""
  - name: ShouldAnchorRootViolationAtSlash
    input:
      args: [doc: "- a\n- b\n"]
    expected:
      output: '{{/^/: /}}'
  - name: ShouldFlagExtraKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                includes:
                  makeLinks: [_home/**]
    expected:
      output: includes
  - name: ShouldFlagLinkEntryWithoutDest
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeLinks: [{source: _home/.config/foo/a}]
    expected:
      output: dest
  - name: ShouldAcceptLinkEntryWithExplicitDests
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeLinks: [{source: _home/.config/foo/a, dest: [$HOME/.config/bar/a, /etc/bar/a]}]
    expected:
      output: ""
  - name: ShouldFlagBogusWriteTypeEnum
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - source: templates/a.tpl
                      dest:
                        - {path: a.md, options: {writeType: bogus}}
    expected:
      output: writeType
  - name: ShouldFlagNonOctalChmod
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeDirs:
                    - chmod: rwxr-xr-x
                      directories: [_home/.cache]
    expected:
      output: chmod
  - name: ShouldFlagCopyNodeWithoutSourceOrChildren
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeCopies:
                    - chmod: "0644"
    expected:
      output: makeCopies
  - name: ShouldFlagDroppedCopyFilesKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeCopies:
                    - files: [_home/**]
    expected:
      output: files
  - name: ShouldFlagDroppedPluginsKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                plugins:
                  - ./sub::p
    expected:
      output: plugins
  - name: ShouldFlagDroppedMixinProfilesKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                mixinProfiles: [base]
    expected:
      output: mixinProfiles
  - name: ShouldAcceptTopLevelOptionsEnvInclude
    input:
      args:
        - doc: |
            options:
              runIf: ['env:X']
              autoDiscover: true
              logLevel: info
              validateSpec: warn
            env:
              GITLAB_GROUP: konradodwrot
            specsInclude: ["git::https://gitlab.com/g/r.git", ./sibling]
            profilesDefinitions:
              p:
                include:
                  makeLinks: [_home/**]
    expected:
      output: ""
  - name: ShouldAcceptIncludeProfilesUnionForms
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  profiles:
                    - base
                    - source: "git::https://gitlab.com/g/r.git"
                      profile: gitlabGroup
                      env: {GITLAB_GROUP: konradodwrot}
    expected:
      output: ""
  - name: ShouldAcceptSourceListForms
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeLinks:
                    - source: [_home/**, etc/**]
                  makeCopies:
                    - source: etc
                      dest: /etc
                      <<<:
                        - source: [a, b]
                  renderTemplates:
                    - source: [a.tpl, b.tpl]
    expected:
      output: ""
  - name: ShouldFlagSourceListWithDest
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - source: [a.tpl, b.tpl]
                      dest: docs
    expected:
      output: source
  - name: ShouldFlagBogusValidateSpecEnum
    input:
      args:
        - doc: |
            options:
              validateSpec: bogus
    expected:
      output: validateSpec
# [<] 🤖🤖
