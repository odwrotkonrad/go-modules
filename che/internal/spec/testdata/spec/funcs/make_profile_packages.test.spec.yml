context:
  function: spec.ProfileRecipe.MakeProfile
cases:
  - name: ShouldMergeIncludedProfilesAndDropExcludedPackages
    input:
      args:
        - doc: |
            profilesDefinitions:
              base:
                type: host
                include:
                  installPackages: [git, jq]
              main:
                type: host
                include:
                  profiles: [base]
                  installPackages: [{name: jq, versions: "1.7.*"}, tmux, kind]
                exclude:
                  installPackages: [kind]
        - profile: main
    expected:
      output:
        - {name: git}
        - {name: jq, versions: ["1.7.*"]}
        - {name: tmux}
