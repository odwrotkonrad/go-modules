# [>] 🤖🤖
context:
  function: spec.ProfileSourceRecipe.UnmarshalYAML
cases:
  - name: ShouldDecodeScalarAsLocalProfileName
    input:
      args: [entry: base]
    expected:
      output: {source: "", profile: base, sourceType: filesystem, string: base}
  - name: ShouldDecodeRemoteSourceRef
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/konradodwrot/workspace.git/che.yml::gitlabGroup"
            env: {GITLAB_GROUP: konradodwrot}
    expected:
      output:
        source: "git::https://gitlab.com/konradodwrot/workspace.git"
        profile: gitlabGroup
        sourceType: remote
        env: {GITLAB_GROUP: konradodwrot}
        string: "git::https://gitlab.com/konradodwrot/workspace.git/che.yml::gitlabGroup"
  - name: ShouldDecodeRemoteSourceRefWithNestedSpecFile
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git/sub/che.yml::p"
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git/sub"
        profile: p
        sourceType: remote
        string: "git::https://gitlab.com/g/r.git/sub/che.yml::p"
  - name: ShouldDecodeDirSourceRefAsFilesystem
    input:
      args:
        - entry: |
            source: ./sub/che.yml::p
    expected:
      output: {source: ./sub, profile: p, sourceType: filesystem, string: ./sub/che.yml::p}
  - name: ShouldDecodeNestedDirSourceRef
    input:
      args:
        - entry: |
            source: ./a/b/che.yml::cli
    expected:
      output: {source: ./a/b, profile: cli, sourceType: filesystem, string: ./a/b/che.yml::cli}
  - name: ShouldDecodeRemoteSourceRefWithRefSuffix
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git@v1.2.3//che.yml::p"
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        ref: v1.2.3
        string: "git::https://gitlab.com/g/r.git@v1.2.3/che.yml::p"
  - name: ShouldErrorOnRefQuerySyntax
    input:
      args:
        - entry: |
            source: "./sub/che.yml::p?ref=v1.2.3"
    expected:
      errorOutput: ['?ref= is gone', 'git::<repo>@<ref>']
  - name: ShouldDecodeAtInLocalDirNameLiterally
    input:
      args:
        - entry: |
            source: "./sub@v1.2.3/che.yml::p"
    expected:
      output: {source: "./sub@v1.2.3", profile: p, sourceType: filesystem, string: "./sub@v1.2.3/che.yml::p"}
  - name: ShouldErrorOnBareTrailingAt
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git@//che.yml::p"
    expected:
      errorOutput: ['bare "@"']
  - name: ShouldErrorOnEnvWithoutSource
    input:
      args:
        - entry: |
            source: p
            env: {A: b}
    expected:
      errorOutput: ['env requires a source']
  - name: ShouldDecodeLegacyCtxAsVariables
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git/che.yml::p"
            ctx: {repo: X}
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        variables: {repo: X}
        string: "git::https://gitlab.com/g/r.git/che.yml::p"
  - name: ShouldDecodeVariables
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git/che.yml::p"
            variables: {repo: X}
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        variables: {repo: X}
        string: "git::https://gitlab.com/g/r.git/che.yml::p"
  - name: ShouldErrorOnVariablesWithoutSource
    input:
      args:
        - entry: |
            source: p
            variables: {A: b}
    expected:
      errorOutput: ['variables requires a source']
  - name: ShouldErrorOnInvalidVariableKey
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git/che.yml::p"
            variables: {bad-key: b}
    expected:
      errorOutput: ['key "bad-key" must match']
  - name: ShouldErrorOnMissingSource
    input:
      args:
        - entry: |
            env: {A: b}
    expected:
      errorOutput: ['include.profiles entry missing source']
  - name: ShouldErrorOnMissingProfileName
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git/che.yml::"
    expected:
      errorOutput: ['missing profile name']
  - name: ShouldErrorOnSourceWithoutSpecFileSegment
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git::p"
    expected:
      errorOutput: ['needs a <source>/<spec-file>.yml::<profile> path']
  - name: ShouldErrorOnBareDirSourceWithoutSpecFile
    input:
      args:
        - entry: |
            source: "sibling::cli"
    expected:
      errorOutput: ['needs a <source>/<spec-file>.yml::<profile> path']
# [<] 🤖🤖
