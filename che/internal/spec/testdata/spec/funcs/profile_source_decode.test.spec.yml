# [>] 🤖🤖
context:
  function: spec.ProfileSourceRecipe.UnmarshalYAML
cases:
  - name: ShouldDecodeScalarAsLocalProfileName
    input:
      args: [entry: base]
    expected:
      output: {source: "", profile: base, sourceType: filesystem, string: base}
  - name: ShouldDecodeRemoteSourceWithProfile
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/konradodwrot/workspace.git"
            profile: gitlabGroup
            env: {GITLAB_GROUP: konradodwrot}
    expected:
      output:
        source: "git::https://gitlab.com/konradodwrot/workspace.git"
        profile: gitlabGroup
        sourceType: remote
        env: {GITLAB_GROUP: konradodwrot}
        string: "git::https://gitlab.com/konradodwrot/workspace.git profile gitlabGroup"
  - name: ShouldDecodeSpecDirUnderSource
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
            spec: profiles/claude
            profile: claude/virt
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        spec: profiles/claude
        profile: claude/virt
        sourceType: remote
        string: "git::https://gitlab.com/g/r.git spec profiles/claude profile claude/virt"
  - name: ShouldDecodeSpecFileUnderSource
    input:
      args:
        - entry: |
            source: ./sub
            spec: other/che.export.yml
            profile: p
    expected:
      output: {source: ./sub, spec: other/che.export.yml, profile: p, sourceType: filesystem, string: "./sub spec other/che.export.yml profile p"}
  - name: ShouldDecodeProfilePath
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
            profile: ai/base/macos::ai/claude
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: ai/base/macos::ai/claude
        sourceType: remote
        string: "git::https://gitlab.com/g/r.git profile ai/base/macos::ai/claude"
  - name: ShouldDecodeRemoteSourceRefWithRefSuffix
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git@v1.2.3"
            profile: p
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        ref: v1.2.3
        string: "git::https://gitlab.com/g/r.git@v1.2.3 profile p"
  - name: ShouldErrorOnRefQuerySyntax
    input:
      args:
        - entry: |
            source: "./sub?ref=v1.2.3"
            profile: p
    expected:
      errorOutput: ['?ref= is gone', 'git::<repo>@<ref>']
  - name: ShouldDecodeAtInLocalDirNameLiterally
    input:
      args:
        - entry: |
            source: "./sub@v1.2.3"
            profile: p
    expected:
      output: {source: "./sub@v1.2.3", profile: p, sourceType: filesystem, string: "./sub@v1.2.3 profile p"}
  - name: ShouldErrorOnBareTrailingAt
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git@"
            profile: p
    expected:
      errorOutput: ['bare "@"']
  - name: ShouldDecodeDeprecatedUrlFormWithSubdir
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git@v1//profiles/claude/che.yml::claude/virt"
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        spec: profiles/claude
        profile: claude/virt
        sourceType: remote
        ref: v1
        string: "git::https://gitlab.com/g/r.git@v1 spec profiles/claude profile claude/virt"
  - name: ShouldDecodeDeprecatedUrlFormAsScalar
    input:
      args:
        - entry: "./sub/che.yml::p"
    expected:
      output: {source: ./sub, profile: p, sourceType: filesystem, string: "./sub profile p"}
  - name: ShouldErrorOnSubdirInRemoteURL
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git//profiles/claude"
            profile: p
    expected:
      errorOutput: ['//<path> is gone', 'spec key']
  - name: ShouldErrorOnSpecFileInLocalSource
    input:
      args:
        - entry: |
            source: ./sub/che.yml
            profile: p
    expected:
      errorOutput: ['names a spec file', 'spec key']
  - name: ShouldErrorOnMissingProfile
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
    expected:
      errorOutput: ['missing profile']
  - name: ShouldErrorOnMissingSource
    input:
      args:
        - entry: |
            env: {A: b}
    expected:
      errorOutput: ['include.profiles entry missing url']
  - name: ShouldDecodeLegacyCtxAsVariables
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
            profile: p
            ctx: {repo: X}
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        variables: {repo: X}
        string: "git::https://gitlab.com/g/r.git profile p"
  - name: ShouldDecodeVariables
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
            profile: p
            variables: {repo: X}
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        variables: {repo: X}
        string: "git::https://gitlab.com/g/r.git profile p"
  - name: ShouldErrorOnInvalidVariableKey
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
            profile: p
            variables: {bad-key: b}
    expected:
      errorOutput: ['key "bad-key" must match']
  - name: ShouldErrorOnProfileAndProfilesTogether
    input:
      args:
        - entry: |
            source: "git::https://gitlab.com/g/r.git"
            profile: a
            profiles: [b]
    expected:
      errorOutput: ['profileName and profileNames are exclusive']
  - name: ShouldDecodeObjectRefRemote
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            ref: v1.2.3
            specDirPath: profiles/claude
            profileName: claude/virt
    expected:
      output:
        source: "git::gitlab.com/g/r"
        spec: profiles/claude
        profile: claude/virt
        sourceType: remote
        ref: v1.2.3
        string: "git::gitlab.com/g/r@v1.2.3 spec profiles/claude profile claude/virt"
  - name: ShouldDecodeObjectRefWithSchemeUrl
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git
            specDirPath: .
            profileName: p
    expected:
      output: {source: "git::https://gitlab.com/g/r.git", profile: p, sourceType: remote, string: "git::https://gitlab.com/g/r.git profile p"}
  - name: ShouldDecodeObjectRefLocal
    input:
      args:
        - entry: |
            url: .
            specDirPath: profiles/git
            profileName: git/host/macos
    expected:
      output: {source: ., spec: profiles/git, profile: git/host/macos, sourceType: filesystem, string: ". spec profiles/git profile git/host/macos"}
  - name: ShouldErrorOnMissingSpecDirPath
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            profileName: p
    expected:
      errorOutput: ['specDirPath is required']
  - name: ShouldErrorOnProfilePathInProfileName
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            specDirPath: .
            profileName: a::b
    expected:
      errorOutput: ['profile paths are gone']
  - name: ShouldErrorOnRefOnLocalUrl
    input:
      args:
        - entry: |
            url: ./sub
            ref: v1
            specDirPath: .
            profileName: p
    expected:
      errorOutput: ['needs a remote']
  - name: ShouldErrorOnRefGivenTwice
    input:
      args:
        - entry: |
            url: gitlab.com/g/r@v1
            ref: v2
            specDirPath: .
            profileName: p
    expected:
      errorOutput: ['ref given twice']
  - name: ShouldDecodeDeprecatedKeysAsNew
    input:
      args:
        - entry: |
            source: "git::gitlab.com/g/r@v1"
            spec: sub
            profile: p
    expected:
      output: {source: "git::gitlab.com/g/r", spec: sub, profile: p, sourceType: remote, ref: v1, string: "git::gitlab.com/g/r@v1 spec sub profile p"}
  - name: ShouldExpandProfileNames
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            specDirPath: .
            profileNames: [a, {specDirPath: sub, profileName: b}]
    expected:
      output: {source: "git::gitlab.com/g/r", sourceType: remote, string: "git::gitlab.com/g/r profile ", expanded: ["git::gitlab.com/g/r profile a", "git::gitlab.com/g/r spec sub profile b"]}
# [<] 🤖🤖
