# [>] 🤖🤖
context:
  function: spec.ProfileSourceRecipe.UnmarshalYAML
cases:
  - name: ShouldDecodeScalarAsLocalProfileName
    input:
      args: [entry: base]
    expected:
      output: {source: "", profile: base, sourceType: filesystem, string: base}
  - name: ShouldDecodeRemoteUrlWithProfileName
    input:
      args:
        - entry: |
            url: https://gitlab.com/konradodwrot/workspace.git
            specDirPath: .
            profileName: gitlabGroup
            env: {GITLAB_GROUP: konradodwrot}
    expected:
      output:
        source: "git::https://gitlab.com/konradodwrot/workspace.git"
        profile: gitlabGroup
        sourceType: remote
        env: {GITLAB_GROUP: konradodwrot}
        string: "git::https://gitlab.com/konradodwrot/workspace.git profile gitlabGroup"
  - name: ShouldDecodeSpecDirUnderUrl
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git
            specDirPath: profiles/claude
            profileName: claude/virt
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        spec: profiles/claude
        profile: claude/virt
        sourceType: remote
        string: "git::https://gitlab.com/g/r.git spec profiles/claude profile claude/virt"
  - name: ShouldDecodeObjectRefRemoteSchemeless
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            ref: v1.2.3
            specDirPath: profiles/claude
            profileName: claude/virt
    expected:
      output:
        source: "git::gitlab.com/g/r"
        spec: profiles/claude
        profile: claude/virt
        sourceType: remote
        ref: v1.2.3
        string: "git::gitlab.com/g/r@v1.2.3 spec profiles/claude profile claude/virt"
  - name: ShouldDecodeObjectRefLocal
    input:
      args:
        - entry: |
            specDirPath: ./profiles/git
            profileName: git/host/macos
    expected:
      output: {source: ./profiles/git, profile: git/host/macos, sourceType: filesystem, string: "./profiles/git profile git/host/macos"}
  - name: ShouldDecodeLocalDirWithSpecFile
    input:
      args:
        - entry: |
            specDirPath: ./sub/other/che.export.yml
            profileName: p
    expected:
      output: {source: sub/other, spec: che.export.yml, profile: p, sourceType: filesystem, string: "sub/other spec che.export.yml profile p"}
  - name: ShouldDecodeAtInLocalDirNameLiterally
    input:
      args:
        - entry: |
            specDirPath: ./sub@v1.2.3
            profileName: p
    expected:
      output: {source: ./sub@v1.2.3, profile: p, sourceType: filesystem, string: "./sub@v1.2.3 profile p"}
  - name: ShouldErrorOnLocalUrl
    input:
      args:
        - entry: |
            url: ./profiles/git
            specDirPath: .
            profileName: p
    expected:
      errorOutput: ['url names a git repo only']
  - name: ShouldErrorOnMissingSpecDirPath
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            profileName: p
    expected:
      errorOutput: ['specDirPath is required']
  - name: ShouldErrorOnProfilePathInProfileName
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            specDirPath: .
            profileName: a::b
    expected:
      errorOutput: ['profile paths are gone']
  - name: ShouldErrorOnScalarPathForm
    input:
      args:
        - entry: "./sub/che.yml::p"
    expected:
      errorOutput: ['<source>/<spec-file>::<profile> form is gone']
  - name: ShouldErrorOnRefOnLocalSpec
    input:
      args:
        - entry: |
            specDirPath: ./sub
            ref: v1
            profileName: p
    expected:
      errorOutput: ['ref needs a url']
  - name: ShouldErrorOnRefGivenTwice
    input:
      args:
        - entry: |
            url: gitlab.com/g/r@v1
            ref: v2
            specDirPath: .
            profileName: p
    expected:
      errorOutput: ['ref given twice']
  - name: ShouldErrorOnBareTrailingAt
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git@
            specDirPath: .
            profileName: p
    expected:
      errorOutput: ['bare "@"']
  - name: ShouldErrorOnSubdirInUrl
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git//profiles/claude
            specDirPath: .
            profileName: p
    expected:
      errorOutput: ['//<path> is gone']
  - name: ShouldErrorOnMissingProfileName
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git
            specDirPath: .
    expected:
      errorOutput: ['missing profileName']
  - name: ShouldErrorOnMissingUrlAndSpecDirPath
    input:
      args:
        - entry: |
            env: {A: b}
    expected:
      errorOutput: ['missing url or specDirPath']
  - name: ShouldErrorOnOldSourceKey
    input:
      args:
        - entry: |
            source: "git::gitlab.com/g/r@v1"
            profileName: p
    expected:
      errorOutput: ['source/spec are gone']
  - name: ShouldErrorOnOldProfileKey
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            specDirPath: .
            profile: p
    expected:
      errorOutput: ['profile/profiles are gone']
  - name: ShouldErrorOnOldListItemKeys
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            specDirPath: .
            profileNames: [{spec: sub, profile: b}]
    expected:
      errorOutput: ['spec/profile are gone']
  - name: ShouldDecodeVariables
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git
            specDirPath: .
            profileName: p
            variables: {repo: X}
    expected:
      output:
        source: "git::https://gitlab.com/g/r.git"
        profile: p
        sourceType: remote
        variables: {repo: X}
        string: "git::https://gitlab.com/g/r.git profile p"
  - name: ShouldErrorOnInvalidVariableKey
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git
            specDirPath: .
            profileName: p
            variables: {bad-key: b}
    expected:
      errorOutput: ['key "bad-key" must match']
  - name: ShouldErrorOnProfileNameAndProfileNamesTogether
    input:
      args:
        - entry: |
            url: https://gitlab.com/g/r.git
            specDirPath: .
            profileName: a
            profileNames: [b]
    expected:
      errorOutput: ['profileName and profileNames are exclusive']
  - name: ShouldExpandProfileNames
    input:
      args:
        - entry: |
            url: gitlab.com/g/r
            specDirPath: .
            profileNames: [a, {specDirPath: sub, profileName: b}]
    expected:
      output: {source: "git::gitlab.com/g/r", sourceType: remote, string: "git::gitlab.com/g/r profile ", expanded: ["git::gitlab.com/g/r profile a", "git::gitlab.com/g/r spec sub profile b"]}
# [<] 🤖🤖
