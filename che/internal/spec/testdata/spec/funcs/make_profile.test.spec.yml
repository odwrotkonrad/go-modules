# [>] 🤖🤖
context:
  function: spec.ProfileRecipe.MakeProfile
cases:
  - name: ShouldMergeIncludedProfilesForDesktopProfile
    context: {pwd: testdata/fixture/resolve/tree-merge}
    input:
      args: [spec: merge, profile: desktop/macos]
    expected:
      scripts: [ci/zsh/scripts/installs/10-brew.zsh, ci/zsh/scripts/installs/20-kitty.zsh]
      perms:
        /var/log/grafana: {chmod: "2775"}
        Library/LaunchDaemons/otelcol.plist.ontoHost.cp: {chmod: "0600"}
    contains:
      extraDirs: [/var/log/grafana, _home/.cache/zsh]
      links: [etc/grafana/grafana.ini]
  - name: ShouldExcludeDesktopEntriesForCliProfile
    context: {pwd: testdata/fixture/resolve/tree-merge}
    input:
      args: [spec: merge, profile: cli/macos]
    expected:
      scripts: [ci/zsh/scripts/installs/10-brew.zsh]
    notExpected:
      extraDirs: [/var/log/grafana]
      links: [etc/grafana/grafana.ini]
  - name: ShouldClassifyTreeIntoLinksCopiesTemplates
    context: {pwd: testdata/fixture/resolve/tree-classify}
    input:
      args: [spec: classify, profile: cli/macos]
    expected:
      links:
        - _home/.config/git/config
        - _home/.config/zsh/.zshrc
        - etc/zsh/zshenv
        - etc/zshrc
      copies:
        - Library/LaunchDaemons/otelcol.plist.ontoHost.cp
        - _home/.config/zsh/x.ontoHost.cp
      templates: [_home/.config/zsh/y.ontoHost.tpl]
    contains:
      dirs: [_home, _home/.config/zsh]
  - name: ShouldErrorOnUndefinedProfile
    context: {pwd: testdata/fixture/resolve/tree-merge}
    input:
      args: [spec: merge, profile: cli/linux]
    expected:
      errorOutput: ['profile "cli/linux" is not defined in che.yml']
  - name: ShouldErrorOnIncludeProfilesCycle
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: cycle, profile: cli/macos]
    expected:
      errorOutput: ['include.profiles cycle:']
  - name: ShouldApplyIncludeAndExcludeSections
    context: {pwd: testdata/fixture/resolve/tree-include-exclude}
    input:
      args: [spec: include-exclude, profile: cli/macos]
    contains:
      links: [_home/.config/extra/x, etc/zshrc]
      scripts: [ci/zsh/scripts/installs/10-brew.zsh]
    notExpected:
      links: [etc/zsh/zshenv]
      copies: [_home/.config/zsh/c.ontoHost.cp]
      scripts: [ci/zsh/scripts/installs/20-foo.zsh]
  - name: ShouldExcludeScriptsMatchingGlob
    context: {pwd: testdata/fixture/resolve/tree-exclude-script-glob}
    input:
      args: [spec: exclude-script-glob, profile: cli/macos]
    expected:
      scripts: [ci/zsh/scripts/installs/10-brew.zsh, ci/zsh/scripts/installs/30-tmux.zsh]
  - name: ShouldErrorOnUndefinedIncludedProfile
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: undefined-include, profile: cli/macos]
    expected:
      errorOutput: ['include.profiles names undefined profile "nonexistent"']
  - name: ShouldParseRichRepoTemplateEntries
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: repo-template, profile: cli/macos]
    expected:
      templates: [templates/1-env/local.env.ontoRepo.tpl, templates/3-agents/AGENTS.md.ontoRepo.tpl]
      dests:
        templates/1-env/local.env.ontoRepo.tpl: [.env]
        templates/3-agents/AGENTS.md.ontoRepo.tpl: [CLAUDE.md, AGENTS.md]
      templateOpts:
        - [{writeType: mergeUpsert}]
        - [{}, {renderReferencedFiles: true}]
  - name: ShouldAcceptRemoteTemplateSourceWithVariables
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-template, profile: cli/macos]
    expected:
      templates: ["git::gitlab.com/acme/tools//snippets/agent.md"]
      templateDests: [[.claude/agents/ro.md]]
      templateOpts: [[{skipAutoGeneratedHeader: true}]]
      variables:
        "git::gitlab.com/acme/tools//snippets/agent.md": {repo: Notes}
  - name: ShouldMergeGroupVariablesUnderItemVariables
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-template-group-ctx, profile: cli/macos]
    expected:
      templates: ["git::gitlab.com/acme/tools//snippets/ro.md", "git::gitlab.com/acme/tools//snippets/rw.md"]
      variables:
        "git::gitlab.com/acme/tools//snippets/ro.md": {repo: Workspace, model: fable}
        "git::gitlab.com/acme/tools//snippets/rw.md": {repo: Workspace, model: sonnet}
  - name: ShouldMergeGroupOptionsUnderDestOptions
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-template-group-options, profile: cli/macos]
    expected:
      templates: ["git::gitlab.com/acme/tools//snippets/gitignore", "git::gitlab.com/acme/tools//snippets/ro.md", "git::gitlab.com/acme/tools//snippets/settings.json"]
      templateOpts:
        - [{}]
        - [{skipAutoGeneratedHeader: true}]
        - [{skipAutoGeneratedHeader: true, renderReferencedFiles: true}]
  - name: ShouldJoinNestedGroupSourcePrefixesRecombiningRemoteRef
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-nested, profile: cli/macos]
    expected:
      templates:
        - "git::gitlab.com/acme/tools@v1.0.0//snippets/nested/deep/settings.json"
        - "git::gitlab.com/acme/tools@v1.0.0//snippets/nested/rw.md"
        - "git::gitlab.com/acme/tools@v1.0.0//snippets/plain.md"
        - "git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md"
        - "git::gitlab.com/acme/tools@v2.0.0//snippets/pinned.md"
        - templates/1-env/local.env.ontoRepo.tpl
        - templates/2-data/a.ontoRepo.tpl
        - templates/2-data/nested/b.ontoRepo.tpl
        - templates/2-data/nested/c.ontoRepo.tpl
      templateDests:
        - [.claude/settings.json]
        - [.claude/agents/rw.md]
        - [.claude/plain.md]
        - [.claude/agents/ro.md]
        - [.claude/pinned.md]
        - [.env]
        - [assets/data/a.md]
        - [assets/data/deep/b.md]
        - [$HOME/.config/c.md]
  - name: ShouldInheritGroupDestWhenChildOmitsIt
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-group-inherited-dest, profile: cli/macos]
    expected:
      templates:
        - templates/ruby/artifact.rb
        - templates/ruby/declaration.rb
        - templates/ruby/nested/event.rb
        - templates/ruby/nested/gitlab.rb
      templateDests:
        - [shared/ci/ruby/artifact.rb]
        - [shared/ci/ruby/declaration.rb]
        - [shared/ci/ruby/deep/event.rb]
        - [$HOME/.config/gitlab.rb]
  - name: ShouldAccumulateInheritedDestAcrossNestedGroups
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-group-inherited-dest, profile: cli/macos]
    expected:
      templateDests:
        - [shared/ci/ruby/artifact.rb]
        - [shared/ci/ruby/declaration.rb]
        - [shared/ci/ruby/deep/event.rb]
        - [$HOME/.config/gitlab.rb]
  - name: ShouldKeepHostAnchoredChildDestUnderGroupPrefix
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-group-inherited-dest, profile: cli/macos]
    expected:
      dests:
        templates/ruby/nested/gitlab.rb: [$HOME/.config/gitlab.rb]
  - name: ShouldStillErrorOnRemoteChildWithoutDest
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-group-remote-child-no-dest, profile: cli/macos]
    expected:
      errorOutput: [renderTemplates remote source requires explicit dest]
  - name: ShouldCascadeVariablesPermsAndOptionsThroughNestedGroups
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-nested, profile: cli/macos]
    expected:
      variables:
        "git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md": {repo: Workspace, model: fable}
        "git::gitlab.com/acme/tools@v1.0.0//snippets/nested/rw.md": {repo: Workspace, model: sonnet}
        "git::gitlab.com/acme/tools@v1.0.0//snippets/nested/deep/settings.json": {repo: Workspace, model: sonnet}
      perms:
        "git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md": {chmod: "0644"}
        "git::gitlab.com/acme/tools@v1.0.0//snippets/nested/rw.md": {chmod: "0600"}
        "git::gitlab.com/acme/tools@v1.0.0//snippets/nested/deep/settings.json": {chmod: "0600"}
      templateOpts:
        - [{skipAutoGeneratedHeader: false, renderReferencedFiles: true}]
        - [{skipAutoGeneratedHeader: true}]
        - [{skipAutoGeneratedHeader: false}]
        - [{skipAutoGeneratedHeader: true}]
        - [{skipAutoGeneratedHeader: true}]
        - [{}]
  - name: ShouldJoinNestedDestPrefixesLeavingHostDestsAnchored
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-nested, profile: cli/macos]
    expected:
      templateDests:
        - [.claude/settings.json]
        - [.claude/agents/rw.md]
        - [.claude/plain.md]
        - [.claude/agents/ro.md]
        - [.claude/pinned.md]
        - [.env]
        - [assets/data/a.md]
        - [assets/data/deep/b.md]
        - [$HOME/.config/c.md]
  - name: ShouldReadScalarDestAsPathAndRuleShapesAsRewrites
    context: {pwd: testdata/fixture/resolve/tree-copy-template-rewrite}
    input:
      args: [spec: template-scalar-dest, profile: cli/macos]
    expected:
      templates: [_home/.config/foo/b.conf.tpl, templates/1-env/local.env.ontoRepo.tpl]
      templateDests: [[$HOME/.config/foo/b.conf], [assets/docs/local.env]]
  - name: ShouldErrorOnGroupCarryingMultipleDests
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: schema-invalid/template-group-with-dest, profile: cli/macos]
    expected:
      errorOutput: ['dest is a prefix: want one path, got 2']
  - name: ShouldErrorOnTemplateGroupWithoutPrefix
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: schema-invalid/template-bare-group, profile: cli/macos]
    expected:
      errorOutput: ['renderTemplates group carries nested <<< without a source or dest prefix']
  - name: ShouldErrorOnCopyGroupWithoutPrefix
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: schema-invalid/copy-bare-group, profile: cli/macos]
    expected:
      errorOutput: ['makeCopies group carries nested <<< without a source or dest prefix']
  - name: ShouldErrorOnNodeWithoutSourceGlobOrChildren
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: schema-invalid/template-empty-node, profile: cli/macos]
    expected:
      errorOutput: ['renderTemplates node needs a source, a glob or nested <<<']
  - name: ShouldExpandSourceListIntoLeavesUnderGroupDest
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: source-list, profile: cli/macos]
    expected:
      links: [_home/.config/foo/a, _home/.config/foo/b, etc/zshrc]
      copies: [etc/daemons/a.plist, etc/daemons/b.plist]
      templates: [templates/other.tpl, templates/ruby/artifact.rb, templates/ruby/declaration.rb, templates/top.tpl]
      dests:
        etc/daemons/a.plist: [/Library/LaunchDaemons/a.plist]
        etc/daemons/b.plist: [/Library/LaunchDaemons/b.plist]
        templates/ruby/artifact.rb: [shared/ci/ruby/artifact.rb]
        templates/ruby/declaration.rb: [shared/ci/ruby/declaration.rb]
        templates/top.tpl: []
        templates/other.tpl: []
      variables:
        templates/ruby/artifact.rb: {repo: Notes}
        templates/ruby/declaration.rb: {repo: Notes}
  - name: ShouldGiveSourceListItemsUnderRemotePrefixTheirPathAsDest
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: source-list-remote-group, profile: cli/macos]
    expected:
      templates:
        - "git::gitlab.com/acme/tools@v1.0.0//docs/nested/observability.md.tpl"
        - "git::gitlab.com/acme/tools@v1.0.0//docs/spec.md"
        - "git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md"
      templateDests:
        - [che/docs/nested/observability.md]
        - [che/docs/spec.md]
        - [snippets/ro.md]
  - name: ShouldErrorOnSourceListWithDest
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: schema-invalid/source-list-dest, profile: cli/macos]
    expected:
      errorOutput: ['source list takes no dest']
  - name: ShouldErrorOnSourceListWithChildren
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: schema-invalid/source-list-group, profile: cli/macos]
    expected:
      errorOutput: ['source list takes no nested <<<']
  - name: ShouldErrorOnRemoteSourceListItem
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: source-list-remote, profile: cli/macos]
    expected:
      errorOutput: ['source list item cannot be remote: "git::gitlab.com/acme/tools//b.tpl"']
  - name: ShouldJoinLeafPathOntoRefOnlyGroupPrefix
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: template-group-prefix-ref-only, profile: cli/macos]
    expected:
      templates: ["git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md"]
  - name: ShouldErrorOnRemoteTemplateWithoutDest
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-template-no-dest, profile: cli/macos]
    expected:
      errorOutput: [renderTemplates remote source requires explicit dest]
  - name: ShouldErrorOnRemoteTemplateGlob
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-template-glob, profile: cli/macos]
    expected:
      errorOutput: [renderTemplates glob cannot be remote]
  - name: ShouldErrorOnMalformedRemoteTemplateSource
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-template-malformed, profile: cli/macos]
    expected:
      errorOutput: ['renderTemplates remote source malformed, want git::<repo>[@<ref>]//<path>']
  - name: ShouldComposeIncludedProfilesInGivenOrder
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: ambiguous, profile: both]
    expected:
      templates: [templates/1-env/local.env.ontoRepo.tpl, templates/1-env/local.env.ontoRepo.tpl]
      templateDests: [[.env], [.env2]]
  - name: ShouldCollectAndDedupeSourcedRefs
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: sourced-profiles, profile: main]
    expected:
      refs:
        - {source: "git::git@gitlab.com:g/r.git", profile: p}
        - {source: "git::https://gitlab.com/g/r2.git", profile: q, env: {GITLAB_GROUP: konradodwrot}}
    contains:
  - name: ShouldMapLinkMatchesThroughSedRewriteRule
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-rewrite, profile: cli/macos]
    expected:
      links: [_home/.config/foo/a, _home/.config/foo/b, etc/zshrc]
      dests:
        _home/.config/foo/a: [_home/.config/bar/a]
        _home/.config/foo/b: [_home/.config/bar/b]
        etc/zshrc: []
  - name: ShouldContributeRewrittenLinkAncestorDirs
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-rewrite, profile: cli/macos]
    contains:
      dirs: [_home/.config/bar]
    notExpected:
      dirs: [_home/.config/foo]
  - name: ShouldExcludeLinkByRewrittenDest
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-rewrite, profile: exclude-rewritten]
    contains:
      links: [_home/.config/foo/a]
    notExpected:
      links: [_home/.config/foo/b]
  - name: ShouldMapExplicitDestLinksOverGlobTwins
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-explicit, profile: cli/macos]
    expected:
      links: [_home/.config/foo/a, _home/.config/foo/b, etc/zshrc]
      dests:
        _home/.config/foo/a: [$HOME/.config/bar/a, /etc/bar/a]
        _home/.config/foo/b: []
        etc/zshrc: []
  - name: ShouldContributeExplicitLinkAncestorDirs
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-explicit, profile: cli/macos]
    contains:
      dirs: [$HOME/.config/bar]
  - name: ShouldExcludeLinkByExplicitDest
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-explicit, profile: exclude-explicit]
    contains:
      links: [_home/.config/foo/b]
    notExpected:
      links: [_home/.config/foo/a]
  - name: ShouldErrorOnMalformedLinkDestRule
    context: {pwd: testdata/fixture/resolve/tree-link-rewrite}
    input:
      args: [spec: link-rewrite-bad, profile: cli/macos]
    expected:
      errorOutput: [dest rule]
  - name: ShouldMapCopyAndTemplateMatchesThroughDestRewriteRule
    context: {pwd: testdata/fixture/resolve/tree-copy-template-rewrite}
    input:
      args: [spec: copy-template-rewrite, profile: cli/macos]
    expected:
      copies: [_home/.config/foo/a.ontoHost.cp]
      templates: [_home/.config/foo/b.conf.tpl]
      dests:
        _home/.config/foo/a.ontoHost.cp: [$HOME/.config/foo/a]
        _home/.config/foo/b.conf.tpl: [$HOME/.config/foo/b.conf]
  - name: ShouldContributeRewrittenCopyAndTemplateAncestorDirs
    context: {pwd: testdata/fixture/resolve/tree-copy-template-rewrite}
    input:
      args: [spec: copy-template-rewrite, profile: cli/macos]
    contains:
      dirs: [$HOME/.config/foo]
    notExpected:
      dirs: [_home/.config/foo]
  - name: ShouldJoinCopyGroupPrefixesRecombiningRemoteRef
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: copy-nested, profile: cli/macos]
    expected:
      copies:
        - _home/.config/foo/x.ontoHost.cp
        - "git::gitlab.com/acme/tools@v1.0.0//prompts/a.md.tpl"
        - "git::gitlab.com/acme/tools@v1.0.0//prompts/nested/b.md.tpl"
        - "git::gitlab.com/acme/tools@v1.0.0//prompts/nested/c.md.tpl"
        - "git::gitlab.com/acme/tools@v2.0.0//prompts/pinned.md.tpl"
      dests:
        "git::gitlab.com/acme/tools@v1.0.0//prompts/a.md.tpl": [/usr/local/share/acme/a.md.tpl]
        "git::gitlab.com/acme/tools@v1.0.0//prompts/nested/b.md.tpl": [/usr/local/share/acme/b.md.tpl]
        "git::gitlab.com/acme/tools@v1.0.0//prompts/nested/c.md.tpl": [$HOME/.config/acme/c.md.tpl]
        "git::gitlab.com/acme/tools@v2.0.0//prompts/pinned.md.tpl": [/usr/local/share/acme/pinned.md.tpl]
        _home/.config/foo/x.ontoHost.cp: [$HOME/.config/foo/x]
  - name: ShouldAssembleRemoteCopySourceAndDestOneLevel
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: copy-assembly, profile: remote-one-level]
    expected:
      copies:
        - "git::gitlab.com/acme/tools@v1.0.0//prompts/commit.md.tpl"
        - "git::gitlab.com/acme/tools@v1.0.0//prompts/mr.md.tpl"
      dests:
        "git::gitlab.com/acme/tools@v1.0.0//prompts/commit.md.tpl": [/usr/local/share/prompts/commit.md.tpl]
        "git::gitlab.com/acme/tools@v1.0.0//prompts/mr.md.tpl": [/usr/local/share/prompts/mr.md.tpl]
  - name: ShouldAssembleLocalCopySourceAndDestOneLevel
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: copy-assembly, profile: local-one-level]
    expected:
      copies: [etc/daemons/a.plist.ontoHost.cp, etc/daemons/b.plist.ontoHost.cp]
      dests:
        etc/daemons/a.plist.ontoHost.cp: [/Library/LaunchDaemons/a.plist]
        etc/daemons/b.plist.ontoHost.cp: [/Library/LaunchDaemons/b.plist]
  - name: ShouldAssembleRemoteCopySourceAndDestTwoLevels
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: copy-assembly, profile: remote-two-levels]
    expected:
      copies:
        - "git::gitlab.com/acme/tools@v1.0.0//prompts/commit.md.tpl"
        - "git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md"
      dests:
        "git::gitlab.com/acme/tools@v1.0.0//prompts/commit.md.tpl": [/usr/local/share/prompts/commit.md.tpl]
        "git::gitlab.com/acme/tools@v1.0.0//snippets/ro.md": [/usr/local/share/snippets/ro.md]
  - name: ShouldAssembleLocalCopySourceAndDestTwoLevels
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: copy-assembly, profile: local-two-levels]
    expected:
      copies: [etc/cron/nightly.ontoHost.cp, etc/daemons/a.plist.ontoHost.cp]
      dests:
        etc/cron/nightly.ontoHost.cp: [/etc/cron.d/nightly]
        etc/daemons/a.plist.ontoHost.cp: [/etc/daemons/a.plist]
  - name: ShouldCascadeCopyPermsThroughNestedGroups
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: copy-nested, profile: cli/macos]
    expected:
      perms:
        "git::gitlab.com/acme/tools@v1.0.0//prompts/a.md.tpl": {owner: root, chmod: "0644"}
        "git::gitlab.com/acme/tools@v1.0.0//prompts/nested/b.md.tpl": {owner: root, chmod: "0600"}
        "git::gitlab.com/acme/tools@v2.0.0//prompts/pinned.md.tpl": {owner: root, chmod: "0644"}
    contains:
      dirs: [/usr/local/share/acme, $HOME/.config/acme]
  - name: ShouldErrorOnRemoteCopyGlob
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-copy-glob, profile: cli/macos]
    expected:
      errorOutput: [makeCopies glob cannot be remote]
  - name: ShouldErrorOnRemoteCopyDestRewrite
    context: {pwd: testdata/fixture/resolve/tree-empty}
    input:
      args: [spec: remote-copy-rewrite, profile: cli/macos]
    expected:
