profilesDefinitions:
  base:
    type: host
    include:
      renderTemplates:
        - source: "git::gitlab.com/acme/tools@v1.0.0"
          dest: [.claude/agents, .claude/other]
          <<<:
            - {source: //snippets/ro.md, dest: ro.md}

