##[>] 🤖🤖
profilesDefinitions:
  base:
    type: host
    include:
      makeLinks:
        - etc/zshrc
        - _home/.config/foo/**
        - {source: _home/.config/foo/a, dest: [$HOME/.config/bar/a, /etc/bar/a]}

  'cli/macos':
    type: host
    options: {autoDiscover: true}
    include:
      profiles: [base]

  exclude-explicit:
    type: host
    include:
      profiles: [base]
    exclude:
      makeLinks:
        - $HOME/.config/bar/a

