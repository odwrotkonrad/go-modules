profilesDefinitions:
  base:
    type: host
    include:
      renderTemplates:
        - source: templates/ruby
          dest: shared/ci/ruby
          <<<:
            - source: /artifact.rb
            - source: /declaration.rb
            - source: nested
              dest: deep
              <<<:
                - source: /event.rb
                - {source: /gitlab.rb, dest: $HOME/.config/gitlab.rb}

  'cli/macos':
    type: host
    options: {autoDiscover: true}
    include:
      profiles: [base]

