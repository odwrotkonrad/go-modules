profilesDefinitions:
  base:
    type: host
    include:
      profiles: []
  main:
    type: host
    include:
      profiles:
        - base
        - url: "git@gitlab.com:g/r.git"
          specDirPath: .
          profileName: p
        - url: "https://gitlab.com/g/r2.git"
          specDirPath: .
          profileName: q
          env:
            GITLAB_GROUP: konradodwrot
        - url: "git@gitlab.com:g/r.git"
          specDirPath: .
          profileName: p
          env:
            IGNORED: dup

