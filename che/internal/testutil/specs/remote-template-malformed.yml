profilesDefinitions:
  base:
    type: host
    include:
      renderTemplates:
        - source: "git::gitlab.com/acme/tools/snippets/agent.md"
          dest:
            - {path: .claude/agents/ro.md}

  'cli/macos':
    type: host
    options: {autoDiscover: true}
    include:
      profiles: [base]
