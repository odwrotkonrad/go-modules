base:
  include:
    renderTemplates:
      - source: "@gitlab.com/acme/tools?ref=v1.0.0"
        chmod: "0644"
        ctx: {repo: Workspace, model: fable}
        options: {skipAutoGeneratedHeader: true}
        renderTemplates:
          - {source: //snippets/ro.md, dest: .claude/agents/ro.md}
          - source: //snippets/nested
            ctx: {model: sonnet}
            chmod: "0600"
            renderTemplates:
              - {source: /rw.md, dest: .claude/agents/rw.md}
              - source: /deep
                options: {renderReferencedFiles: true}
                renderTemplates:
                  - {source: /settings.json, dest: [{path: .claude/settings.json, options: {skipAutoGeneratedHeader: false}}]}
          - {source: "//snippets/pinned.md?ref=v2.0.0", dest: .claude/pinned.md}
          - source: //snippets/plain.md
            options: {skipAutoGeneratedHeader: false}
            dest: .claude/plain.md
      - source: templates/1-env
        renderTemplates:
          - {source: local.env.ontoRepo.tpl, dest: .env}
      - source: templates/2-data
        dest: assets/data
        renderTemplates:
          - {source: a.ontoRepo.tpl, dest: a.md}
          - source: nested
            dest: deep
            renderTemplates:
              - {source: b.ontoRepo.tpl, dest: b.md}
              - {source: c.ontoRepo.tpl, dest: $HOME/.config/c.md}

cli/macos:
  options: {autoDiscover: true}
  include:
    profiles: [base]
