profilesDefinitions:
  base:
    include:
      renderTemplates:
        - source: "git::gitlab.com/acme/tools//snippets/agent.md"
          variables: {repo: Notes}
          dest:
            - {path: .claude/agents/ro.md, options: {skipAutoGeneratedHeader: true}}

  'cli/macos':
    options: {autoDiscover: true}
    include:
      profiles: [base]
