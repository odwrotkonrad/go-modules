profilesDefinitions:
  base:
    type: host
    include:
      makeLinks:
        - _home/.config/zsh/**
        - _home/.config/git/**
        - etc/zshrc
        - etc/zsh/**
      makeCopies:
        - source: _home/.config/zsh/**
          dest: $HOME/.config/zsh/**
        - source: Library/LaunchDaemons/otelcol.plist*
          dest: 's:^Library:/Library:'
      renderTemplates:
        - _home/.config/zsh/**

  'cli/macos':
    type: host
    options: {autoDiscover: true}
    include:
      profiles: [base]

  'desktop/macos':
    type: host
    options: {autoDiscover: true}
    include:
      profiles: [base]
