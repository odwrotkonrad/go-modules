profilesDefinitions:
  base:
    type: host
    include:
      renderTemplates:
        - source: "git::gitlab.com/acme/tools"
          variables: {repo: Workspace, model: fable}
          <<<:
            - source: //snippets/ro.md
              dest:
                - {path: .claude/agents/ro.md}
            - source: //snippets/rw.md
              variables: {model: sonnet}
              dest:
                - {path: .claude/agents/rw.md}

  'cli/macos':
    type: host
    options: {autoDiscover: true}
    include:
      profiles: [base]
