profilesDefinitions:
  repo:
    type: host
    options: {autoDiscover: true}
    include:
      renderTemplates:
        - source: templates/1-env/local.env.ontoRepo.tpl
          dest:
            - {path: .env, options: {writeType: mergeUpsert}}
  other:
    type: host
    options: {autoDiscover: true}
    include:
      renderTemplates:
        - source: templates/1-env/local.env.ontoRepo.tpl
          dest:
            - {path: .env2, options: {writeType: mergeUpsert}}
  both:
    type: host
    options: {autoDiscover: false}
    include:
      profiles: [repo, other]
