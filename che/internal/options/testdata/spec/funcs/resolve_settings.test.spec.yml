# [>] 🤖🤖
context:
  function: options.Options.Resolve
cases:
  - name: ShouldReportOnlyDefaultsAsEmptyDelta
    expected:
      output:
        delta: ""
  - name: ShouldReportFlagEnvConfigSpecSources
    context:
      env: {CHE_LOG_LEVEL: debug}
    input:
      args:
        - flags: {dryRun: delta}
        - user: {skipRemoteRefs: true}
        - spec: {profileWorkingDirectory: root}
    expected:
      output:
        delta: "dryRun=delta (cliFlag), profileWorkingDirectory=root (specFile), skipRemoteRefs=true (config-file), logLevel=debug (env)"
  - name: ShouldReportEveryOptionWithSourceInAll
    input:
      args:
        - flags: {}
        - user: {}
        - spec: {}
    expected:
      output:
        allContains:
          - "dryRun=false (default)"
          - "skipOps=[] (default)"
          - "autoDiscover=true (default)"
          - "validateSpec=warn (default)"
          - "logLevel=info (default)"
          - "otel.protocol=grpc (default)"
          - "otel.endpoint=localhost:4317 (default)"
          - "otel.metrics=true (default)"
          - "packages.updateCheck.enabled=false (default)"
          - "packages.updateCheck.cooldown=15m (default)"
  - name: ShouldLayerUpdateCheckFromEnvConfigSpec
    context:
      env: {CHE_PACKAGES_UPDATE_CHECK: "true"}
    input:
      args:
        - flags: {}
        - user: {packages: {updateCheck: {cooldown: 1h}}}
        - spec: {}
    expected:
      output:
        delta: "packages.updateCheck.enabled=true (env), packages.updateCheck.cooldown=1h (config-file)"
  - name: ShouldRejectMalformedUpdateCheckCooldown
    input:
      args:
        - flags: {}
        - user: {packages: {updateCheck: {cooldown: soon}}}
        - spec: {}
    expected:
      errorOutput: 'invalid packages.updateCheck.cooldown "soon"'
# [<] 🤖🤖
