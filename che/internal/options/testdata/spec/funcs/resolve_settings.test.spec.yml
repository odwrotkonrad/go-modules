# [>] 🤖🤖
context:
  function: options.Options.Resolve
cases:
  - name: ShouldReportOnlyDefaultsAsEmptyDelta
    expected:
      output:
        delta: ""
  - name: ShouldReportFlagEnvConfigSpecSources
    context:
      env: {CHE_LOG_LEVEL: debug}
    input:
      args:
        - flags: {dryRun: delta}
        - user: {skipRemoteRefs: true}
        - spec: {profileWorkingDirectory: root}
    expected:
      output:
        delta: "dryRun=delta (cliFlag), profileWorkingDirectory=root (specFile), skipRemoteRefs=true (config-file), logLevel=debug (env)"
  - name: ShouldReportEveryOptionWithSourceInAll
    input:
      args:
        - flags: {}
        - user: {}
        - spec: {}
    expected:
      output:
        allContains:
          - "dryRun=false (default)"
          - "skipOps=[] (default)"
          - "autoDiscover=true (default)"
          - "validateSpec=warn (default)"
          - "logLevel=info (default)"
          - "otel.protocol=grpc (default)"
          - "otel.endpoint=localhost:4317 (default)"
          - "otel.metrics=true (default)"
          - "packages.autoUpdate.enabled=true (default)"
          - "packages.autoUpdate.if.refIsLatest.cooldown=15m (default)"
          - "packages.autoUpdate.if.dryRunIsTrue.enabled=true (default)"
          - "packages.source.url=https://gitlab.com/api/v4/projects/konradodwrot%2Fche-packages/packages/generic/che-packages (default)"
          - "packages.source.ref= (default)"
  - name: ShouldLayerAutoUpdateFromEnvConfigSpec
    context:
      env: {CHE_PACKAGES_AUTO_UPDATE: "false"}
    input:
      args:
        - flags: {}
        - user: {packages: {autoUpdate: {if: {refIsLatest: {cooldown: 1h}}}}}
        - spec: {}
    expected:
      output:
        delta: "packages.autoUpdate.enabled=false (env), packages.autoUpdate.if.refIsLatest.cooldown=1h (config-file)"
  - name: ShouldLayerPackagesSourceFromEnvConfigSpec
    context:
      env: {CHE_PACKAGES_REF: "0.0.11"}
    input:
      args:
        - flags: {}
        - user: {packages: {source: {url: "https://example.test/catalog.git"}}}
        - spec: {}
    expected:
      output:
        delta: "packages.source.url=https://example.test/catalog.git (config-file), packages.source.ref=0.0.11 (env)"
  #[why] `url:` written with no value is a set-but-empty layer: without an assigned default it
  #   resolved to "" and fetched a schemeless "/latest/version.txt"
  - name: ShouldDefaultPackagesSourceUrlWhenConfigLeavesItBlank
    input:
      args:
        - flags: {}
        - user: {packages: {source: {url: "", ref: ""}}}
        - spec: {}
    expected:
      output:
        allContains:
          - "packages.source.url=https://gitlab.com/api/v4/projects/konradodwrot%2Fche-packages/packages/generic/che-packages"
  - name: ShouldRejectMalformedAutoUpdateCooldown
    input:
      args:
        - flags: {}
        - user: {packages: {autoUpdate: {if: {refIsLatest: {cooldown: soon}}}}}
        - spec: {}
    expected:
      errorOutput: 'invalid packages.autoUpdate.if.refIsLatest.cooldown "soon"'
# [<] 🤖🤖
