context:
  function: options.Resolve
cases:
  - name: ShouldBeEmptyWhenUnset
    expected:
      output: {}
  - name: ShouldResolveSpecLayer
    input:
      args: [runFlag: [], user: {}, spec: {run: {skipOps: [prune-broken-links]}}]
    expected:
      output: {runSkipOps: [prune-broken-links]}
  - name: ShouldLetUserBeatSpec
    input:
      args:
        - runFlag: []
        - user: {run: {skipOps: [make-dirs]}}
        - spec: {run: {skipOps: [prune-broken-links]}}
    expected:
      output: {runSkipOps: [make-dirs]}
  - name: ShouldLetEnvBeatUserCommaSplit
    context: {env: {CHE_RUN_SKIP_OPS: "make-copies,render-templates"}}
    input:
      args: [runFlag: [], user: {run: {skipOps: [make-dirs]}}]
    expected:
      output: {runSkipOps: [make-copies, render-templates]}
  - name: ShouldLetFlagBeatEnv
    context: {env: {CHE_RUN_SKIP_OPS: "make-copies"}}
    input:
      args: [runFlag: [render-templates]]
    expected:
      output: {runSkipOps: [render-templates]}
  - name: ShouldIgnoreRetiredGlobalSkipOps
    context: {env: {CHE_SKIP_OPS: "run-scripts"}}
    input:
      args: [runFlag: [], user: {}, spec: {skipOps: [make-links]}]
    expected:
      output: {}
  - name: ShouldErrorOnUnknownOp
    input:
      args: [runFlag: [foo]]
    expected:
      errorOutput:
        - 'invalid skip-ops op "foo": want one of prune-broken-links, make-dirs, make-links, make-copies, render-templates, install-packages, run-scripts'
  - name: ShouldErrorOnUnknownEnvOp
    context: {env: {CHE_RUN_SKIP_OPS: "bar"}}
    expected:
      errorOutput:
        - 'invalid skip-ops op "bar"'
