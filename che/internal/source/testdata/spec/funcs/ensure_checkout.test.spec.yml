context:
  function: source.EnsureCheckout
cases:
  - name: ShouldCloneIntoCacheDirAndLogClonedOnFirstEnsure
    input:
      args: [priorEnsures: 0, commitExtra: false]
    expected:
      output: {files: [che.yml]}
      stdOut: ["cloned remote ${URL} into ${ABBRDIR}"]
    notExpected:
      stdOut: ["clone ${URL}"]
  - name: ShouldLogUpToDateOnNoChangePull
    input:
      args: [priorEnsures: 1, commitExtra: false]
    expected:
      stdOut: ["up to date remote ${URL} into ${ABBRDIR}"]
  - name: ShouldSilentlyUseCacheWhenUnpinnedFetchFails
    input:
      args: [priorEnsures: 1, commitExtra: false, debug: false, upstreamGone: true]
    expected:
      output: {silent: true}
  - name: ShouldCloneAtTagWhenRefGiven
    input:
      args: [priorEnsures: 0, commitExtra: false, debug: false, upstreamGone: false, ref: v1.2.3]
    expected:
      output: {files: [che.yml]}
      stdOut: ["cloned remote ${URL}@v1.2.3 into ${ABBRDIR}"]
  - name: ShouldErrorWhenPinnedFetchFails
    input:
      args: [priorEnsures: 1, commitExtra: false, debug: false, upstreamGone: true, ref: v1.2.3]
    expected:
      errorOutput: ["@v1.2.3"]
  - name: ShouldHardResetAndLogUpdatedOnUpstreamChange
    input:
      args: [priorEnsures: 1, commitExtra: true]
    expected:
      output: {files: [extra.txt]}
      stdOut: ["updated remote ${URL} into ${ABBRDIR}"]
    notExpected:
      stdOut: ["pull ${DIR}"]
# [<] 🤖🤖
