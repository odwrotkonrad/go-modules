# [>] 🤖🤖
context:
  function: spec.CompiledSchema.Validate
cases:
  - name: ShouldValidateRepoCheYml
    input:
      args: [path: ../../../.che/che.yml]
    expected:
      output: true
  - name: ShouldValidateTestutilFixtures
    input:
      args: [globs: ["../testutil/specs/*.yml"]]
    expected:
      output: true
  - name: ShouldRejectSchemaInvalidTestutilFixtures
    input:
      args: [globs: ["../testutil/specs/schema-invalid/*.yml"]]
    expected:
      output: false
  - name: ShouldValidateMigratedSiblingCheYmls
    input:
      args: [globs: ["../../../../configs/che.yml"]]
    expected:
      output: true
  - name: ShouldValidateSpecDocFullExample
    input:
      args: [docExample: ../../docs/spec.md]
    expected:
      output: true
  - name: ShouldRejectBogusWriteType
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - source: templates/a.tpl
                      dest:
                        - {path: a.md, options: {writeType: bogus}}
    expected:
      output: false
  - name: ShouldAcceptThreeLevelNestedGroups
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - source: "git::gitlab.com/acme/tools@v1.0.0"
                      chmod: "0644"
                      variables: {repo: Acme}
                      options: {skipAutoGeneratedHeader: true}
                      <<<:
                        - source: //snippets
                          <<<:
                            - source: /deep
                              <<<:
                                - {source: /a.md, dest: a.md}
    expected:
      output: true
  - name: ShouldAcceptGroupDestPrefix
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - source: templates/2-data
                      dest: assets/data
                      <<<:
                        - {source: a.ontoRepo.tpl, dest: a.md}
                        - {source: b.ontoRepo.tpl, dest: $HOME/.config/b.md}
    expected:
      output: true
  - name: ShouldAcceptScalarDestPath
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - {source: templates/a.tpl, dest: assets/a.md}
    expected:
      output: true
  - name: ShouldAcceptScalarDestRule
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - {source: _home/**, dest: $HOME/**}
                    - {source: etc/**, dest: 's:^etc:/etc:'}
    expected:
      output: true
  - name: ShouldRejectDroppedTemplatesKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - templates:
                        - {source: templates/a.tpl, dest: [a.md]}
    expected:
      output: false
  - name: ShouldRejectDroppedPluginsKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                plugins:
                  - ./sub
    expected:
      output: false
  - name: ShouldRejectUnknownProfileKey
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                includes:
                  makeLinks: [_home/**]
    expected:
      output: false
  - name: ShouldRejectCopyLeafWithoutSource
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeCopies:
                    - {dest: [~/.config/a]}
    expected:
      output: false
  - name: ShouldRejectCopyGroupWithoutPrefix
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeCopies:
                    - chmod: "0644"
                      <<<:
                        - {source: a.ontoHost.cp, dest: [/etc/a]}
    expected:
      output: false
  - name: ShouldRejectTemplateGroupWithoutPrefix
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  renderTemplates:
                    - options: {skipAutoGeneratedHeader: true}
                      <<<:
                        - {source: a.ontoRepo.tpl, dest: a.md}
    expected:
      output: false
  - name: ShouldRejectNonOctalChmod
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                include:
                  makeDirs:
                    - chmod: rwxr-xr-x
                      directories: [_home/.cache]
    expected:
      output: false
  - name: ShouldRejectMixinProfilesNotAList
    input:
      args:
        - doc: |
            profilesDefinitions:
              p:
                mixinProfiles: base
    expected:
      output: false
# [<] 🤖🤖
