packages:
  jq: [brew, apt]
  fd: [brew, {apt: {packageName: fd-find}}]
  npmtool:
    version: 1.2.3
    installers: [npm]
  kubectx:
    - binariesRemoteArchive:
        archScheme: odd
        extractBinaries: [kubectx]
        platformEligibility:
          - linux-amd64: sha256:mocksha
        version: 0.11.0
        url: https://example.com/v{version}/kubectx_v{version}_{os}_{arch}.tar.gz
