# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
options:
  profileWorkingDirectory: root
base:
  include:
    makeLinks:
      - source: _home/.config/zsh/**
        dest: 's:^_home:$HOME:'
      - etc/zshrc
      - source: _home/.config/foo/**
        dest: 's:^_home/.config/foo:$HOME/.config/bar:'
    makeCopies:
      - files:
          - source: _home/.config/zsh/**
            dest: 's:^_home:$HOME:'
      - owner: root
        ownerGroup: wheel
        chmod: "0644"
        files:
          - source: Library/LaunchDaemons/otelcol.plist.ontoHost.cp
            dest:
              - /Library/LaunchDaemons/otelcol.plist
    renderTemplates:
      - source: _home/.config/zsh/**
        dest: 's:^_home:$HOME:'
    makeDirs:
      - directories:
          - $HOME/.cache/zsh
      - chmod: "2775"
        directories:
          - dest:
              - /var/log/che-test-setgid
    runScripts:
      - install/setup

cli/macos:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt
  include:
    profiles:
      - base

desktop/macos:
  options:
    autoDiscover: true
    runIf:
      - builtin:isOs == macos
      - builtin:isVirt == false
  include:
    profiles:
      - base

ontoRepo:
  options:
    profileWorkingDirectory: .
  include:
    renderTemplates:
      - source: templates/r.ontoRepo.tpl
        dest:
          - docs/r.md
