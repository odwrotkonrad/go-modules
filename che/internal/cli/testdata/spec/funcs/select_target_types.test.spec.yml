context:
  function: cli.app.selectTargetTypes
  pwd: testdata/fixture/commands/common/sample-tree
  env: {CHE_SKIP_RUN_IF: "1"}
cases:
  - name: ShouldPromptWithCountsAndKeepChosenTypes
    input:
      args:
        - spec: |
            options: {profileWorkingDirectory: root}
            tracked:
              type: repo-git-tracked
              include:
                renderTemplates:
                  - {source: _home/.config/zsh/y.ontoHost.tpl, dest: out/y}
            untracked:
              type: repo-git-untracked
              include:
                makeCopies:
                  - source: _home/.config/zsh/**
                    dest: 's:^_home:$HOME:'
            machine:
              type: host
              include:
                makeLinks: [etc/zshrc]
                makeDirs:
                  - directories: [$HOME/.cache/zsh]
        - answer: "1,3\n"
        - types: []
        - profile: ""
        - tty: true
    expected:
      output:
        profiles: tracked,machine
        prompt:
          - "1) repo-git-tracked: 1 profile, 1 render"
          - "2) repo-git-untracked: 1 profile, 1 copy, 3 dirs"
          - "3) host: 1 profile, 1 link, 2 dirs"
          - "Run which types?"
  - name: ShouldAcceptAll
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
        - answer: "all\n"
        - types: []
        - profile: ""
        - tty: true
    expected:
      output: {profiles: "tracked,machine", prompt: ["1) repo-git-tracked: 1 profile", "2) host: 1 profile"]}
  - name: ShouldAbortOnEmptyAnswer
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
        - answer: "\n"
        - types: []
        - profile: ""
        - tty: true
    expected:
      errorOutput: ['no profile type chosen']
  - name: ShouldErrorOnOutOfRangeChoice
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
        - answer: "7\n"
        - types: []
        - profile: ""
        - tty: true
    expected:
      errorOutput: ['invalid profile type choice "7": want 1-2 or all']
  - name: ShouldNotPromptOffTerminal
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
        - answer: ""
        - types: []
        - profile: ""
        - tty: false
    expected:
      output: {profiles: "tracked,machine"}
  - name: ShouldNotPromptWhenTypesGiven
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
        - answer: ""
        - types: [host]
        - profile: ""
        - tty: true
    expected:
      output: {profiles: machine}
  - name: ShouldNotPromptWithProfilesFlag
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
        - answer: ""
        - types: []
        - profile: tracked
        - tty: true
    expected:
      output: {profiles: tracked}
  - name: ShouldNotPromptOnOneType
    input:
      args:
        - spec: |
            a: {type: host}
            b: {type: host}
        - answer: ""
        - types: []
        - profile: ""
        - tty: true
    expected:
      output: {profiles: "a,b"}
  - name: ShouldListUntypedProfilesAsUnselectable
    input:
      args:
        - spec: |
            tracked: {type: repo-git-tracked}
            machine: {type: host}
            legacy: {}
        - answer: "2\n"
        - types: []
        - profile: ""
        - tty: true
    expected:
      output:
        profiles: machine
        prompt: ["-  : 1 profile  (no type"]
# [<] 🤖🤖
