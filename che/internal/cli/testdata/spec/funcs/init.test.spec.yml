# [>] 🤖🤖
context:
  function: cli.app.init
  pwd: testdata/fixture/commands/common/sample-tree
cases:
  - name: ShouldForceOneDefinedProfileWithProfileFlag
    input:
      args:
        - profile: ontoRepo
    expected:
      output:
        profiles: ontoRepo
        dryRunAll: false
  - name: ShouldErrorOnUndefinedProfileFlag
    input:
      args:
        - profile: nonexistent
    expected:
      errorOutput: '--profiles [nonexistent] not defined in'
  - name: ShouldWarnNotFailOnSpecViolationByDefault
    input:
      args:
        - profile: ""
        - validateSpecMode: ""
        - appendSpec: |
            bogusProfile:
              options: {autoDiscover: false}
              includes:
                makeLinks: [_home/**]
    expected:
      output:
        profiles: cli/macos,desktop/macos
        dryRunAll: false
  - name: ShouldFailOnSpecViolationWithValidateSpecErrorFlag
    input:
      args:
        - profile: ""
        - validateSpecMode: error
        - appendSpec: |
            bogusProfile:
              includes:
                makeLinks: [_home/**]
    expected:
      errorOutput:
        - schema violations in
        - includes
  - name: ShouldFailOnSpecViolationWithValidateSpecErrorEnv
    context:
      env: {CHE_VALIDATE_SPEC: error}
    input:
      args:
        - profile: ""
        - validateSpecMode: ""
        - appendSpec: |
            bogusProfile:
              includes:
                makeLinks: [_home/**]
    expected:
      errorOutput:
        - schema violations in
        - includes
  - name: ShouldErrorOnUnknownValidateSpecMode
    input:
      args:
        - profile: ""
        - validateSpecMode: bogus
    expected:
      errorOutput: invalid --validate-spec mode
  - name: ShouldReadDryRunModeFromEnvWhenFlagUnset
    context:
      env: {CHE_DRY_RUN: all}
    expected:
      output:
        profiles: cli/macos,desktop/macos
        dryRunAll: true
  - name: ShouldIgnoreUnsetEnvRefsOfUnselectedProfiles
    context:
      env: {CHE_TEST_A: set}
    input:
      args:
        - profile: envA
        - validateSpecMode: ""
        - appendSpec: |
            envA:
              include:
                makeLinks: ['_home/${{ env.CHE_TEST_A }}/**']
            envB:
              include:
                makeLinks: ['_home/${{ env.CHE_TEST_B_UNSET }}/**']
    expected:
      output:
        profiles: envA
        dryRunAll: false
  - name: ShouldFailOnUnsetEnvRefOfSelectedProfile
    input:
      args:
        - profile: envB
        - validateSpecMode: ""
        - appendSpec: |
            envB:
              include:
                makeLinks: ['_home/${{ env.CHE_TEST_B_UNSET }}/**']
    expected:
      errorOutput: ['unset env vars:', 'CHE_TEST_B_UNSET at /envB/include/makeLinks/0']
  - name: ShouldReadUnsetEnvRefAsEmptyWithPolicyEnv
    context:
      env: {CHE_ENV_UNSET: empty}
    input:
      args:
        - profile: envB
        - validateSpecMode: ""
        - appendSpec: |
            envB:
              include:
                makeLinks: ['_home/${{ env.CHE_TEST_B_UNSET }}/**']
    expected:
      output:
        profiles: envB
        dryRunAll: false
# [<] 🤖🤖
