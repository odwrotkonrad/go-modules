# [>] 🤖🤖
context:
  command: che packages install
  pwd: testdata/fixture/commands/packages/sample-tree
  mockedInterfaces:
    execx.CmdExecutor: testutil.CmdMockExecutor
    fsutil.FileSystemWriter: testutil.FileSystemMockWriter
    fsutil.FileSystemReader: testutil.FileSystemMockReader
    packages.Host: cli.PackagesMockHost
cases:
  - name: ShouldInstallProfilePackagesViaFirstApplicableManager
    expected:
      stdOut:
        - "# Run profile cli/macos"
        - "installed jq via apt"
        - "installed kubectx 0.11.0 via binariesRemoteArchive"
  - name: ShouldWarnMissingCommandAfterInstall
    expected:
      stdOut:
        - "[warn]{{/ +/}}missing kubectx"
    notExpected:
      stdOut:
        - "missing jq"
  - name: ShouldInstallNamedPackageWithPerManagerName
    context:
      command: che packages install fd
    expected:
      stdOut:
        - "installed fd via apt"
    notExpected:
      stdOut:
        - "installed jq"
  - name: ShouldErrorOnUnknownPackageNamingFile
    context:
      command: che packages install nope
    expected:
      exitCode: 1
      stdErr:
        - "unknown package: nope (required entry in {{/.*/}}packages.yml)"
  - name: ShouldAnnounceInsteadOfInstallingOnDryRun
    context:
      env: {CHE_DRY_RUN: delta}
    expected:
      stdOut:
        - "install jq via apt (dry run)"
        - "install kubectx 0.11.0 via binariesRemoteArchive (dry run)"
    notExpected:
      stdOut:
        - "installed jq via apt"
  - name: ShouldInstallWhenRunSequenceSkipsIt
    context:
      env: {CHE_RUN_SKIP_OPS: install-packages, CHE_LOG_LEVEL: debug}
    expected:
      stdOut:
        - "installed jq via apt"
    notExpected:
      stdOut:
        - "will not run profile cli/macos: options.run.skipOps"
  - name: ShouldFallBackToBuiltinPackagesFile
    context:
      pwd: testdata/fixture/commands/packages/sample-tree-builtin
    expected:
      stdOut:
        - "installed jq via apt"
# [<] 🤖🤖
