# [>] 🤖
context:
  command: che render-templates
  pwd: testdata/fixture/commands/common/sample-tree
  mockedInterfaces:
    execx.CmdExecutor: testutil.CmdMockExecutor
    fsutil.FileSystemWriter: testutil.FileSystemMockWriter
    fsutil.FileSystemReader: testutil.FileSystemMockReader
cases:
  - name: ShouldRenderOnlyHostDestsForHostProfile
    expected:
      stdOut: |
        # Run profile cli/macos
        ## render-templates
          created ${HOME}/.local/state/che/backups/cli-macos/render/{{/\S*/}}.tar.bz2
          created ${HOME}/.config/zsh/t
  - name: ShouldRenderOnlyRepoDestsForOntoRepoProfile
    context:
      command: che render-templates --profile ontoRepo
    expected:
      stdOut: |
        created ${REPO}/docs/r.md
    notExpected:
      stdOut:
        - ${HOME}/.config/zsh/t
  - name: ShouldReadRepoRootAnchoredSourceAsAbsolutePath
    context:
      command: che render-templates --profile ontoRepo
    expected:
      stdOut: |
        created ${REPO}/docs/r-from-root.md
  - name: ShouldRenderGroupChildIntoInheritedRepoDest
    context:
      command: che render-templates --profile ontoRepo
    expected:
      stdOut: |
        created ${REPO}/shared/ci/ruby/artifact.rb
    notExpected:
      stdOut:
        - " /shared/ci/ruby"
# [<] 🤖
