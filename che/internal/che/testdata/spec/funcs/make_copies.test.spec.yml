# [>] 🤖🤖
context:
  function: che.ProfileReady.makeCopies
  mockedInterfaces:
    che.RemoteFetcher: testutil.RemoteMockFetcher
cases:
  - name: ShouldInstallRemoteSourceVerbatim
    input:
      args:
        - fetch:
            git::gitlab.com/acme/tools@v1.0.0//prompts/a.md.tpl: |
              Diff: {{ getenv "DIFF_FULL" }}
        - items:
            - rel: "git::gitlab.com/acme/tools@v1.0.0//prompts/a.md.tpl"
              dests: [$HOME/prompts/a.md.tpl]
              perms: {chmod: "0640"}
    expected:
      stdOut: "created ${HOME}/prompts/a.md.tpl"
      output:
        files:
          home/prompts/a.md.tpl: |
            Diff: {{ getenv "DIFF_FULL" }}
        modes:
          home/prompts/a.md.tpl: "0640"
        rerun: true
        notRerunStdOut: ["created ${HOME}/prompts"]
  - name: ShouldPredictRemoteCopyWithoutFetchingOnDryRun
    input:
      args:
        - fetch: {}
        - items:
            - {rel: "git::gitlab.com/acme/tools@v1.0.0//prompts/a.md.tpl", dests: [$HOME/prompts/a.md.tpl]}
        - dryRun: all
    expected:
      stdOut: "create ${HOME}/prompts/a.md.tpl (dry run)"
      output:
        absent: [home/prompts/a.md.tpl]
  - name: ShouldFailOnRemoteFetchError
    input:
      args:
        - fetch: {}
        - items:
            - {rel: "git::gitlab.com/acme/tools//prompts/absent.md.tpl", dests: [$HOME/prompts/absent.md.tpl]}
    expected:
      errorOutput: 'RemoteMockFetcher: no fixture for "git::gitlab.com/acme/tools//prompts/absent.md.tpl"'
      output:
        absent: [home/prompts/absent.md.tpl]
# [<] 🤖🤖
