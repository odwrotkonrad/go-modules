# [>] 🤖🤖
context:
  function: che.ProfileReady.renderTemplates
cases:
  - name: ShouldWriteHeaderAndRenderedBodyToRepoDest
    input:
      args:
        - tree:
            root/templates/x.ontoRepo.tpl: |
              hello {{ "world" }}
        - items:
            - {rel: templates/x.ontoRepo.tpl, dests: [out.md]}
    expected:
      output:
        files:
          root/out.md: |
            <!-- autogenerated using templates/x.ontoRepo.tpl -->
            hello world
  - name: ShouldMergeUpsertRepoDestStably
    input:
      args:
        - tree:
            root/templates/env.ontoRepo.tpl: |
              B=default
              A=default
            root/.env: |
              B=kept
              C=extra
        - items:
            - rel: templates/env.ontoRepo.tpl
              dests:
                - {path: .env, options: {writeType: mergeUpsert}}
    expected:
      output:
        rerun: true
        rerunStdOut:
          - 'will not overwrite ${ROOT}/{{/\S+/}}: same content'
        files:
          root/.env: |
            A=default
            B=kept
            C=extra
  - name: ShouldMergeUpsertHostDest
    input:
      args:
        - tree:
            root/_home/env.ontoHost.tpl: |
              B=default
              A=default
            home/.env: |
              B=kept
              C=extra
        - items:
            - rel: _home/env.ontoHost.tpl
              dests:
                - {path: "~/.env", options: {writeType: mergeUpsert}}
    expected:
      output:
        files:
          home/.env: |
            A=default
            B=kept
            C=extra
  - name: ShouldRenderRawBodyToDerivedHostDest
    input:
      args:
        - tree:
            root/_home/.config/zsh/t.ontoHost.tpl: |
              hello {{ "world" }}
        - dirs: [home/.config/zsh]
        - items:
            - {rel: _home/.config/zsh/t.ontoHost.tpl, dests: [$HOME/.config/zsh/t], derived: true}
    expected:
      output:
        files:
          home/.config/zsh/t: |
            hello world
  - name: ShouldInlineAtIncludesOnlyForOptingDest
    input:
      args:
        - tree:
            root/templates/agents.ontoRepo.tpl: |
              @inc.md
            root/inc.md: |
              INLINED
        - items:
            - rel: templates/agents.ontoRepo.tpl
              dests:
                - CLAUDE.md
                - {path: AGENTS.md, options: {renderReferencedFiles: true}}
    expected:
      output:
        contains:
          root/CLAUDE.md: ["@inc.md"]
          root/AGENTS.md: [INLINED]
        notContains:
          root/AGENTS.md: ["@inc.md"]
  - name: ShouldWarnOnUnresolvedIncludeForNonOptingDest
    input:
      args:
        - tree:
            root/templates/agents.ontoRepo.tpl: |
              @absent.md
        - items:
            - {rel: templates/agents.ontoRepo.tpl, dests: [CLAUDE.md]}
    expected:
      stdOut:
        - "[warn] ${ROOT}/root/CLAUDE.md: unresolved include @absent.md"
      output:
        contains:
          root/CLAUDE.md: ["@absent.md"]
  - name: ShouldNotWarnWhenEveryIncludeResolvesForNonOptingDest
    input:
      args:
        - tree:
            root/templates/agents.ontoRepo.tpl: |
              @inc.md
            root/inc.md: |
              INLINED
        - items:
            - {rel: templates/agents.ontoRepo.tpl, dests: [CLAUDE.md]}
    expected:
      output:
        notStdOut:
          - "unresolved include"
        contains:
          root/CLAUDE.md: ["@inc.md"]
  - name: ShouldFailOnMissingAtIncludeSourceForOptingDest
    input:
      args:
        - tree:
            root/templates/agents.ontoRepo.tpl: |
              @absent.md
        - items:
            - rel: templates/agents.ontoRepo.tpl
              dests:
                - {path: AGENTS.md, options: {renderReferencedFiles: true}}
    expected:
      errorOutput: ['@-include "@absent.md"', 'no such file or directory']
      output:
        absent: [root/AGENTS.md]
  - name: ShouldContinueAfterFailingTemplateAndReturnError
    input:
      args:
        - tree:
            root/templates/ok.ontoRepo.tpl: |
              fine
        - items:
            - {rel: templates/missing.ontoRepo.tpl, dests: [bad.md]}
            - {rel: templates/ok.ontoRepo.tpl, dests: [ok.md]}
    expected:
      errorOutput: "templates/missing.ontoRepo.tpl: no such file or directory"
      stdOut:
        - "fail templates/missing.ontoRepo.tpl: "
        - "created ${ROOT}/root/ok.md"
      output:
        contains:
          root/ok.md: [fine]
        absent: [root/bad.md]
  - name: ShouldResolveGitRootDest
    input:
      args:
        - tree:
            root/templates/g.ontoRepo.tpl: |
              hi {{ "there" }}
        - items:
            - {rel: templates/g.ontoRepo.tpl, dests: ["${invokingSpecGitRoot}/out/g.md"]}
    expected:
      output:
        contains:
          out/g.md: [hi there]
  - name: ShouldRenderRemoteSourceWithVariables
    context:
      mockedInterfaces:
        che.RemoteFetcher: testutil.RemoteMockFetcher
    input:
      args:
        - fetch:
            git::gitlab.com/acme/tools//snippets/agent.md: |
              name: RO-{{ .var.repo }}
        - items:
            - rel: "git::gitlab.com/acme/tools//snippets/agent.md"
              vars: {repo: Notes}
              dests:
                - {path: .claude/agents/ro.md, options: {skipAutoGeneratedHeader: true}}
    expected:
      output:
        files:
          root/.claude/agents/ro.md: |
            name: RO-Notes
  - name: ShouldFailOnRemoteFetchError
    context:
      mockedInterfaces:
        che.RemoteFetcher: testutil.RemoteMockFetcher
    input:
      args:
        - fetch: {}
        - items:
            - {rel: "git::gitlab.com/acme/tools//snippets/absent.md", dests: [out]}
    expected:
      errorOutput: 'RemoteMockFetcher: no fixture for "git::gitlab.com/acme/tools//snippets/absent.md"'
      stdOut: "fail git::gitlab.com/acme/tools//snippets/absent.md: "
      output:
        absent: [out]
  - name: ShouldRenderIncludedDestBeforeTheDestIncludingIt
    input:
      args:
        - tree:
            root/templates/agents.ontoRepo.tpl: |
              @data.md
            root/templates/data.ontoRepo.tpl: |
              GENERATED DATA
        - items:
            - rel: templates/agents.ontoRepo.tpl
              dests:
                - {path: AGENTS.md, options: {renderReferencedFiles: true, skipAutoGeneratedHeader: true}}
            - rel: templates/data.ontoRepo.tpl
              dests:
                - {path: data.md, options: {skipAutoGeneratedHeader: true}}
    expected:
      output:
        contains:
          root/AGENTS.md: ["GENERATED DATA"]
        notContains:
          root/AGENTS.md: ["@data.md"]
  - name: ShouldOrderByIncludeEvenWhenTheIncludedDestIsListedLast
    input:
      args:
        - tree:
            root/templates/a.ontoRepo.tpl: |
              @mid.md
            root/templates/mid.ontoRepo.tpl: |
              @leaf.md
            root/templates/leaf.ontoRepo.tpl: |
              LEAF
        - items:
            - rel: templates/a.ontoRepo.tpl
              dests:
                - {path: a.md, options: {renderReferencedFiles: true, skipAutoGeneratedHeader: true}}
            - rel: templates/mid.ontoRepo.tpl
              dests:
                - {path: mid.md, options: {renderReferencedFiles: true, skipAutoGeneratedHeader: true}}
            - rel: templates/leaf.ontoRepo.tpl
              dests:
                - {path: leaf.md, options: {skipAutoGeneratedHeader: true}}
    expected:
      output:
        contains:
          root/a.md: ["LEAF"]
          root/mid.md: ["LEAF"]
  - name: ShouldFailNamingBothFilesOfAnIncludeCycle
    input:
      args:
        - tree:
            root/templates/a.ontoRepo.tpl: |
              @b.md
            root/templates/b.ontoRepo.tpl: |
              @a.md
        - items:
            - rel: templates/a.ontoRepo.tpl
              dests:
                - {path: a.md, options: {renderReferencedFiles: true}}
            - rel: templates/b.ontoRepo.tpl
              dests:
                - {path: b.md, options: {renderReferencedFiles: true}}
    expected:
      errorOutput: "include cycle"
      output:
        absent: [root/a.md, root/b.md]
  - name: ShouldNotOrderOnAnIncludeNoItemRenders
    input:
      args:
        - tree:
            root/templates/agents.ontoRepo.tpl: |
              @ondisk.md
            root/ondisk.md: |
              ON DISK
        - items:
            - rel: templates/agents.ontoRepo.tpl
              dests:
                - {path: AGENTS.md, options: {renderReferencedFiles: true, skipAutoGeneratedHeader: true}}
    expected:
      output:
        contains:
          root/AGENTS.md: ["ON DISK"]
  - name: ShouldDefaultRepoDestToGroupWritableMode
    input:
      args:
        - tree:
            root/templates/x.ontoRepo.tpl: |
              body
        - items:
            - {rel: templates/x.ontoRepo.tpl, dests: [out.md]}
    expected:
      output:
        modes:
          root/out.md: "0660"
  - name: ShouldApplyChmodToRepoDest
    input:
      args:
        - tree:
            root/templates/s.zsh.ontoRepo.tpl: |
              #!/usr/bin/env zsh
        - items:
            - {rel: templates/s.zsh.ontoRepo.tpl, dests: [ci/s.zsh], perms: {chmod: "0755"}}
    expected:
      output:
        modes:
          root/ci/s.zsh: "0755"
  - name: ShouldKeepChmodOnRerender
    input:
      args:
        - tree:
            root/templates/s.zsh.ontoRepo.tpl: |
              #!/usr/bin/env zsh
        - items:
            - {rel: templates/s.zsh.ontoRepo.tpl, dests: [ci/s.zsh], perms: {chmod: "0755"}}
    expected:
      output:
        rerun: true
        modes:
          root/ci/s.zsh: "0755"
  - name: ShouldRejectMalformedChmodOnRepoDest
    input:
      args:
        - tree:
            root/templates/x.ontoRepo.tpl: |
              body
        - items:
            - {rel: templates/x.ontoRepo.tpl, dests: [out.md], perms: {chmod: "notoctal"}}
    expected:
      errorOutput: ['malformed chmod "notoctal": want an octal string']
  - name: ShouldSkipShellTemplatesWithSkipVariables
    input:
      args:
        - tree:
            root/templates/v.ontoRepo.tpl: |
              REF={{ shell "printf v1" }}
            root/templates/plain.ontoRepo.tpl: |
              plain
        - items:
            - {rel: templates/v.ontoRepo.tpl, dests: [out]}
            - {rel: templates/plain.ontoRepo.tpl, dests: [plain]}
        - skipVariables: true
    expected:
      stdOut: "will not create ${ROOT}/root/out: options.renderTemplates.skipVariables"
      output:
        absent: [root/out]
        files:
          root/plain: |
            # autogenerated using templates/plain.ontoRepo.tpl
            plain
  - name: ShouldInjectSectionsUnderPartialAndSettleOnRerun
    input:
      args:
        - tree:
            root/out: "hand\n# [>] gen\nold\n# [<] gen\nmore\n"
            root/templates/m.ontoRepo.tpl: "# [>] gen\nfrom-tpl\n# [<] gen\n"
        - items:
            - rel: templates/m.ontoRepo.tpl
              dests:
                - {path: out, options: {writeType: partial, commentPrefix: "#"}}
    expected:
      output:
        files:
          root/out: "hand\n# [>] gen\nfrom-tpl\n# [<] gen\nmore\n"
        rerun: true
        rerunStdOut: ["${ROOT}/root/out: same content"]
  - name: ShouldFailPartialNamingSectionTemplateAndDest
    input:
      args:
        - tree:
            root/out: "hand\n"
            root/templates/m.ontoRepo.tpl: "# [>] gen\nfrom-tpl\n# [<] gen\n"
        - items:
            - rel: templates/m.ontoRepo.tpl
              dests:
                - {path: out, options: {writeType: partial, commentPrefix: "#"}}
    expected:
      errorOutput: ['render templates/m.ontoRepo.tpl onto out', 'lacks section(s) gen']
      output:
        files:
          root/out: "hand\n"
  - name: ShouldExposeProfileEnvUnderDotEnv
    input:
      args:
        - tree:
            root/templates/e.ontoRepo.tpl: "root={{ .env.invokingSpecGitRoot }}\n"
        - items:
            - {rel: templates/e.ontoRepo.tpl, dests: [out]}
    expected:
      output:
        contains:
          root/out: ["root=/"]
  - name: ShouldNameSubSpecSourceRelativeToGitRootInHeader
    input:
      args:
        - tree:
            docs/x.ontoRepo.tpl: "body\n"
            .che/repo-git-tracked/.gitkeep: ""
        - items:
            - {rel: ../../docs/x.ontoRepo.tpl, dests: [out.md]}
        - subSpec: .che/repo-git-tracked
    expected:
      output:
        files:
          out.md: "<!-- autogenerated using docs/x.ontoRepo.tpl -->\nbody\n"
