# [>] 🤖🤖
context:
  function: che.PrepareSpecs
  mockedInterfaces:
    execx.CmdExecutor: testutil.CmdMockExecutor
cases:
  - name: ShouldWarnOnRefSpecViolationByDefault
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                p:
                  type: host
                  includes:
                    makeLinks: [_home/**]
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: p
        - flags: {}
    expected:
      stdOut:
        - "warning /profilesDefinitions/p:"
        - includes
      output:
        profiles: [main, "${REF_DIR}::p"]
  - name: ShouldFailOnRefSpecViolationInErrorMode
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                p:
                  type: host
                  includes:
                    makeLinks: [_home/**]
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: p
        - flags: {validateSpec: error}
    expected:
      errorOutput: includes
  - name: ShouldBuildRemoteRefFromGitURLAtCacheCheckout
    context:
      env: {REF_GATE: "1"}
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  options:
                    runIf: ['env:REF_GATE']
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - url: "file://${REF_DIR}"
                        specDirPath: .
                        profileName: gitlabGroup
                    runScripts: [scripts/local.zsh]
            scripts/local.zsh: "#!/bin/zsh\n"
        - flags: {logLevel: trace}
    expected:
      stdOut:
        - 'cloned remote file://${REF_DIR}'
        - 'listed candidates [main[remote:${REF_NAME}:gitlabGroup]]'
        - 'listed candidates auto-discoverable [main]'
        - 'evaluated run if gitlabGroup: "env:REF_GATE" passed'
      output:
        profiles: [main, "remote:${REF_NAME}:gitlabGroup"]
        repoRootUnder: ${CACHE}
        script: scripts/bootstrap.zsh
  - name: ShouldSkipRefWhenExecIfFails
    context:
      env: {REF_GATE: ""}
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  options:
                    runIf: ['env:REF_GATE']
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: gitlabGroup
        - flags:
            unsetEnv: [REF_GATE]
            logLevel: debug
    expected:
      output:
        profiles: [main]
        rejected: {"${REF_DIR}::gitlabGroup": "env:REF_GATE"}
  - name: ShouldGateRefExecIfWithEntryEnvWithoutLeaking
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  options:
                    runIf: ['env:REF_GATE']
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: gitlabGroup
                        env:
                          REF_GATE: "1"
        - flags:
            unsetEnv: [REF_GATE]
    expected:
      output:
        profiles: [main, "${REF_DIR}::gitlabGroup"]
        env: {REF_GATE: "1"}
        sampleEnv: REF_GATE
        envInOverlay: "1"
        script: scripts/bootstrap.zsh
  - name: ShouldMergeSpecEnvUnderEntryEnv
    input:
      args:
        - refFiles:
            che.yml: |
              env:
                FROM_SPEC: spec
                SHADOWED: spec
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: gitlabGroup
                        env:
                          SHADOWED: entry
        - flags: {}
    expected:
      output:
        profiles: [main, "${REF_DIR}::gitlabGroup"]
        env: {FROM_SPEC: spec, SHADOWED: entry}
  - name: ShouldSkipRemoteRefsWithKnob
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: /nonexistent
                        profileName: p
                    runScripts: [scripts/local.zsh]
            scripts/local.zsh: "#!/bin/zsh\n"
        - flags:
            skipRemoteRefs: true
    expected:
      output:
        profiles: [main]
    notExpected:
      stdOut: source(
  - name: ShouldAnchorDirRefAtRepoRelativeDir
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: ./ref
                        profileName: gitlabGroup
            ref/che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            ref/scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - flags: {}
    expected:
      output:
        profiles: [main, ./ref::gitlabGroup]
        repoRoot: ${HOST_REPO}/ref
        script: scripts/bootstrap.zsh
  - name: ShouldAnchorDirRefAtEnvVarDir
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "$REF_DIR_VAR"
                        profileName: gitlabGroup
        - flags: {}
    expected:
      output:
        profiles: [main, $REF_DIR_VAR::gitlabGroup]
        repoRoot: ${REF_DIR}
    notExpected:
      stdOut: [clone, pull]
  - name: ShouldDedupeSameRefAcrossProfiles
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                p:
                  type: host
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                a:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: p
                b:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: p
        - flags: {}
    expected:
      output:
        profiles: [a, b, "${REF_DIR}::p"]
  - name: ShouldResolveRefsRecursivelyWithCycleGuard
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: ./a
                        profileName: p1
            a/che.yml: |
              profilesDefinitions:
                p1:
                  type: host
                  include:
                    profiles:
                      - specDirPath: ../b
                        profileName: p2
            b/che.yml: |
              profilesDefinitions:
                p2:
                  type: host
                  include:
                    profiles:
                      - specDirPath: ../a
                        profileName: p1
        - flags: {}
    expected:
      output:
        profiles: [main, ./a::p1, ../b::p2]
  - name: ShouldComposeIncludeSourcesSpecs
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              specsInclude: [./sibling]
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles: [sharedBase]
            sibling/che.yml: |
              profilesDefinitions:
                sib:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeDirs:
                      - directories: [_home/.cache/sib]
                sharedBase:
                  type: host
                  options: {autoDiscover: false}
                  include:
                    makeDirs:
                      - directories: [_home/.cache/shared]
        - flags: {}
    expected:
      output:
        profiles: [main, ./sibling::sib]
  - name: ShouldErrorOnCrossSpecProfileNameCollision
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              specsInclude: [./sibling]
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
            sibling/che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  include:
                    makeDirs:
                      - directories: [_home/.cache/sib]
        - flags: {}
    expected:
      errorOutput: ['profile "main" collides']
  - name: ShouldGateWholeSpecOnSpecLevelExecIf
    input:
      args:
        - refFiles:
            che.yml: |
              options:
                runIf: ['env:SPEC_GATE']
              profilesDefinitions:
                p:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              specsInclude: ["${REF_DIR}"]
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
        - flags:
            unsetEnv: [SPEC_GATE]
            logLevel: debug
    expected:
      stdOut: will not load spec
      output:
        profiles: [main]
  - name: ShouldInheritSpecAutoDiscoverDefault
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                autoDiscover: true
              profilesDefinitions:
                a: {type: host}
                b:
                  type: host
                  options: {autoDiscover: false}
        - flags: {}
    expected:
      output:
        profiles: [a]
  - name: ShouldAutoDiscoverAndGateAtLocalSpecLevelWhenExecIfPasses
    context:
      env: {SPEC_GATE: "1"}
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                autoDiscover: true
                runIf: ['env:SPEC_GATE']
              profilesDefinitions:
                a: {type: host}
                b: {type: host}
        - flags: {}
    expected:
      output:
        profiles: [a, b]
  - name: ShouldSkipAllLocalProfilesWhenSpecLevelExecIfFails
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                autoDiscover: true
                runIf: ['env:SPEC_GATE']
              profilesDefinitions:
                a: {type: host}
                b: {type: host}
        - flags:
            unsetEnv: [SPEC_GATE]
    expected:
      output:
        profiles: []
  - name: ShouldComposeTwoIncludedSpecsEachWithIncludeExcludeProfiles
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              specsInclude: [./one, ./two]
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
            one/che.yml: |
              profilesDefinitions:
                alpha:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
                  exclude:
                    makeLinks: [_home/.config/skip-a]
            one/_home/.config/keep-a: keep-a
            one/_home/.config/skip-a: skip-a
            two/che.yml: |
              profilesDefinitions:
                beta:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
                  exclude:
                    makeLinks: [_home/.config/skip-b]
            two/_home/.config/keep-b: keep-b
            two/_home/.config/skip-b: skip-b
        - flags: {}
    expected:
      output:
        profiles: [main, ./one::alpha, ./two::beta]
        linkDests:
          alpha: ['${HOME}/.config/keep-a']
          beta: ['${HOME}/.config/keep-b']
  - name: ShouldHonorIncludedSpecValidateSpecError
    input:
      args:
        - refFiles:
            che.yml: |
              options:
                validateSpec: error
              profilesDefinitions:
                p:
                  type: host
                  includes:
                    makeLinks: [_home/**]
        - hostFiles:
            che.yml: |
              specsInclude: ["${REF_DIR}"]
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
        - flags: {}
    expected:
      errorOutput: includes
  - name: ShouldResolveIncludedSpecWorkingDirectoryOption
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              specsInclude: [./sub]
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
            sub/che.yml: |
              options:
                profileWorkingDirectory: tree
              profilesDefinitions:
                s:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
            sub/tree/_home/.config/x: x
        - flags: {}
    expected:
      output:
        profiles: [main, ./sub::s]
        linkDests:
          s: ['${HOME}/.config/x']
  - name: ShouldOverrideRemoteRefEntryWorkingDirectory
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  type: host
                  options: {profileWorkingDirectory: default-tree}
                  include:
                    makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
            default-tree/_home/.config/def: def
            override-tree/_home/.config/ovr: ovr
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - url: "file://${REF_DIR}"
                        specDirPath: .
                        profileName: gitlabGroup
                        options: {profileWorkingDirectory: override-tree}
        - flags: {}
    expected:
      output:
        profiles: [main, "remote:${REF_NAME}:gitlabGroup"]
        linkDests:
          gitlabGroup: ['${HOME}/.config/ovr']
  - name: ShouldMapNonHomeDestsToSystemRoot
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks:
                      - etc/**
                      - Library/**
            etc/zshenv: zshenv
            Library/LaunchDaemons/x.plist: plist
        - flags: {}
    expected:
      output:
        profiles: [main]
        linkDests:
          main: ['/Library/LaunchDaemons/x.plist', '/etc/zshenv']
  - name: ShouldRejectAutoDiscoveryWhenDisabled
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                marked:
                  type: host
                  options: {autoDiscover: true}
        - flags: {autoDiscover: false}
    expected:
      errorOutput: auto-discovery is disabled
  - name: ShouldDiscoverMarkedProfilesWhenEnabled
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                marked:
                  type: host
                  options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [marked]
  - name: ShouldForceProfilesPastDisabledDiscovery
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                marked:
                  type: host
                  options: {autoDiscover: true}
        - flags: {autoDiscover: false, profiles: [marked]}
    expected:
      output:
        profiles: [marked]
  - name: ShouldCascadeSpecAndProfileWorkingDirectories
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                profileWorkingDirectory: spectree
              profilesDefinitions:
                p:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
                q:
                  type: host
                  options: {autoDiscover: true, profileWorkingDirectory: proftree}
                  include:
                    makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
            spectree/_home/.config/a: "a\n"
            proftree/_home/.config/b: "b\n"
        - flags: {}
    expected:
      output:
        workingDirs:
          p: "${HOST_REPO}/spectree"
          q: "${HOST_REPO}/proftree"
        linkDests:
          p: ["${HOME}/.config/a"]
          q: ["${HOME}/.config/b"]
  - name: ShouldDefaultToCheLevelWorkingDirectoryFlag
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                r:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks: [_home/**]
            chetree/_home/.config/c: "c\n"
        - flags: {profileWorkingDirectory: chetree}
    expected:
      output:
        workingDirs:
          r: "${HOST_REPO}/chetree"
  - name: ShouldKeepSourcedSpecAnchoredAtItsOwnCheckout
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                s:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    makeLinks: [_home/**]
            _home/.config/x: "x\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: s
            roottree/_home/.config/c: "c\n"
        - flags: {profileWorkingDirectory: roottree}
    expected:
      output:
        workingDirs:
          s: "${REF_DIR}"
  - name: ShouldDiscoverSpecUnderDotChe
    input:
      args:
        - refFiles: {}
        - hostFiles:
            .che/che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main]
        specPath: ${HOST_REPO}/.che/che.yml
  - name: ShouldLoadRootAndDotCheSpecsAsOne
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                atRoot:
                  type: host
                  options: {autoDiscover: true}
            .che/che.yml: |
              profilesDefinitions:
                nested:
                  type: host
                  options: {autoDiscover: true}
        - flags: {logLevel: debug}
    expected:
      output:
        profiles: [atRoot, nested]
        specPath: ${HOST_REPO}/che.yml
  - name: ShouldReadRepoVariablesAndCheEnvIntoTheSpec
    context:
      env: {FILE: process}
    input:
      args:
        - refFiles: {}
        - hostFiles:
            .che/cheVariables.yml: "PIN: v1\nDECLARED: file\n"
            .che/cheVariables.local.yml: "LOCAL: '${{ env.FILE }}'\n"
            .che/che.env: "REPO=fromfile\nFILE=fromfile\nDECLARED=env\n"
            .che/che.yml: |
              env: {SPEC: '${{ env.REPO }}-${{ var.PIN }}-${{ var.DECLARED }}-${{ var.FILE }}'}
              variablesDefinitions:
                specVariablesDefinitions:
                  DECLARED: {required: true}
                  FILE: {required: true}
                  LOCAL: {required: true}
                  PIN: {required: true}
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main]
        envOf:
          main: {REPO: fromfile, FILE: process, SPEC: fromfile-v1-file-process}
        varsOf:
          main: {PIN: v1, LOCAL: process}
  - name: ShouldSetIncludedVariablesImplicitlyFromInvokingEnvUnderRefVariables
    input:
      args:
        - refFiles:
            .che/che.env: "A=remote\nB=remote\nIMPLICIT=remote\n"
            .che/cheVariables.yml: "RPIN: r1\nKEEP: kept\n"
            che.yml: |
              env: {C: '${{ env.A }}', E: '${{ env.HOSTONLY }}'}
              variablesDefinitions:
                profilesVariablesDefinitions:
                  p:
                    IMPLICIT: {required: true}
                    KEEP: {required: true}
                    RPIN: {required: true}
              profilesDefinitions:
                p:
                  type: host
                  options: {profileWorkingDirectory: '${{ var.RPIN }}'}
                  include:
                    makeDirs:
                      - directories: ['$HOME/${{ var.KEEP }}/${{ var.IMPLICIT }}']
            r1/.gitkeep: ""
            over/.gitkeep: ""
        - hostFiles:
            .che/che.env: "IMPLICIT=host-che-env\n"
            che.yml: |
              env: {B: host, HOSTONLY: host}
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - specDirPath: "${REF_DIR}"
                        profileName: p
                        env: {D: entry}
                        variables: {RPIN: over}
        - flags: {}
    expected:
      output:
        profiles: [main, "${REF_DIR}::p"]
        envOf:
          p: {A: remote, B: host, C: remote, D: entry, E: host, IMPLICIT: host-che-env}
        varsOf:
          p: {RPIN: over, KEEP: kept, IMPLICIT: host-che-env}
        workingDirs: {p: "${REF_DIR}/over"}
  - name: ShouldOverlayIncludeSourcesEntryEnvAndVariables
    input:
      args:
        - refFiles:
            che.yml: |
              env: {X: included}
              variablesDefinitions:
                profilesVariablesDefinitions:
                  inc: {V: {}}
              profilesDefinitions:
                inc:
                  type: host
                  options: {autoDiscover: true, runIf: ['env:X == entry']}
        - hostFiles:
            che.yml: |
              specsInclude:
                - specDirPath: "${REF_DIR}"
                  env: {X: entry}
                  variables: {V: entry}
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main, "${REF_DIR}::inc"]
        envOf:
          inc: {X: entry}
        varsOf:
          inc: {V: entry}
  - name: ShouldFailOnUnsetVarNamingSpecAndPath
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              variablesDefinitions:
                profilesVariablesDefinitions:
                  main:
                    NOPE: {}
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true, profileWorkingDirectory: '${{ var.NOPE }}'}
        - flags: {}
    expected:
      errorOutput: ['che.yml: unset vars:', 'NOPE at /profilesDefinitions/main/options/profileWorkingDirectory']
  - name: ShouldIgnoreDotEnv
    input:
      args:
        - refFiles: {}
        - hostFiles:
            .env: "FROM_DOTENV=yes\n"
            che.yml: |
              profilesDefinitions:
                main:
                  type: host
                  options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main]
        envOf:
          main: {FROM_DOTENV: ""}
  - name: ShouldPreferExportSpecForIncludedSourcesWithoutSpecFile
    input:
      args:
        - refFiles:
            che.export.yml: |
              profilesDefinitions:
                exported:
                  type: host
                  options: {autoDiscover: true}
            .che/che.yml: |
              profilesDefinitions:
                local:
                  type: host
                  options: {autoDiscover: true}
