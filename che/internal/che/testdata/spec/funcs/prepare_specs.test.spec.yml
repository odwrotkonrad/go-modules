# [>] 🤖🤖
context:
  function: che.PrepareSpecs
  mockedInterfaces:
    execx.CmdExecutor: testutil.CmdMockExecutor
cases:
  - name: ShouldWarnOnRefSpecViolationByDefault
    input:
      args:
        - refFiles:
            che.yml: |
              p:
                includes:
                  makeLinks: [_home/**]
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: p
        - flags: {}
    expected:
      stdOut:
        - "warning /p:"
        - includes
      output:
        profiles: [main, "${REF_DIR}::p"]
  - name: ShouldFailOnRefSpecViolationInErrorMode
    input:
      args:
        - refFiles:
            che.yml: |
              p:
                includes:
                  makeLinks: [_home/**]
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: p
        - flags: {validateSpec: error}
    expected:
      errorOutput: includes
  - name: ShouldBuildRemoteRefFromGitURLAtCacheCheckout
    context:
      env: {REF_GATE: "1"}
    input:
      args:
        - refFiles:
            che.yml: |
              gitlabGroup:
                options:
                  runIf: ['env:REF_GATE']
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "git::file://${REF_DIR}"
                      profile: gitlabGroup
                  runScripts: [scripts/local.zsh]
            scripts/local.zsh: "#!/bin/zsh\n"
        - flags: {logLevel: trace}
    expected:
      stdOut:
        - 'cloned remote file://${REF_DIR}'
        - 'listed candidates [main[remote:${REF_NAME}:gitlabGroup]]'
        - 'listed candidates auto-discoverable [main]'
        - 'evaluated run if gitlabGroup: "env:REF_GATE" passed'
      output:
        profiles: [main, "remote:${REF_NAME}:gitlabGroup"]
        repoRootUnder: ${CACHE}
        script: scripts/bootstrap.zsh
  - name: ShouldSkipRefWhenExecIfFails
    context:
      env: {REF_GATE: ""}
    input:
      args:
        - refFiles:
            che.yml: |
              gitlabGroup:
                options:
                  runIf: ['env:REF_GATE']
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: gitlabGroup
        - flags:
            unsetEnv: [REF_GATE]
            logLevel: debug
    expected:
      output:
        profiles: [main]
        rejected: {"${REF_DIR}::gitlabGroup": "env:REF_GATE"}
  - name: ShouldGateRefExecIfWithEntryEnvWithoutLeaking
    input:
      args:
        - refFiles:
            che.yml: |
              gitlabGroup:
                options:
                  runIf: ['env:REF_GATE']
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: gitlabGroup
                      env:
                        REF_GATE: "1"
        - flags:
            unsetEnv: [REF_GATE]
    expected:
      output:
        profiles: [main, "${REF_DIR}::gitlabGroup"]
        env: {REF_GATE: "1"}
        sampleEnv: REF_GATE
        envInOverlay: "1"
        script: scripts/bootstrap.zsh
  - name: ShouldMergeSpecEnvUnderEntryEnv
    input:
      args:
        - refFiles:
            che.yml: |
              env:
                FROM_SPEC: spec
                SHADOWED: spec
              gitlabGroup:
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: gitlabGroup
                      env:
                        SHADOWED: entry
        - flags: {}
    expected:
      output:
        profiles: [main, "${REF_DIR}::gitlabGroup"]
        env: {FROM_SPEC: spec, SHADOWED: entry}
  - name: ShouldSkipRemoteRefsWithKnob
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "/nonexistent"
                      profile: p
                  runScripts: [scripts/local.zsh]
            scripts/local.zsh: "#!/bin/zsh\n"
        - flags:
            skipRemoteRefs: true
    expected:
      output:
        profiles: [main]
    notExpected:
      stdOut: source(
  - name: ShouldAnchorDirRefAtRepoRelativeDir
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "./ref"
                      profile: gitlabGroup
            ref/che.yml: |
              gitlabGroup:
                include:
                  runScripts: [scripts/bootstrap.zsh]
            ref/scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - flags: {}
    expected:
      output:
        profiles: [main, ./ref::gitlabGroup]
        repoRoot: ${HOST_REPO}/ref
        script: scripts/bootstrap.zsh
  - name: ShouldAnchorDirRefAtEnvVarDir
    input:
      args:
        - refFiles:
            che.yml: |
              gitlabGroup:
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "$REF_DIR_VAR"
                      profile: gitlabGroup
        - flags: {}
    expected:
      output:
        profiles: [main, $REF_DIR_VAR::gitlabGroup]
        repoRoot: ${REF_DIR}
    notExpected:
      stdOut: [clone, pull]
  - name: ShouldDedupeSameRefAcrossProfiles
    input:
      args:
        - refFiles:
            che.yml: |
              p:
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              a:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: p
              b:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: p
        - flags: {}
    expected:
      output:
        profiles: [a, b, "${REF_DIR}::p"]
  - name: ShouldResolveRefsRecursivelyWithCycleGuard
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "./a"
                      profile: p1
            a/che.yml: |
              p1:
                include:
                  profiles:
                    - source: "../b"
                      profile: p2
            b/che.yml: |
              p2:
                include:
                  profiles:
                    - source: "../a"
                      profile: p1
        - flags: {}
    expected:
      output:
        profiles: [main, ./a::p1, ../b::p2]
  - name: ShouldComposeIncludeSourcesSpecs
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              include:
                sources: [./sibling]
              main:
                options: {autoDiscover: true}
                include:
                  profiles: [sharedBase]
            sibling/che.yml: |
              sib:
                options: {autoDiscover: true}
                include:
                  makeDirs:
                    - directories: [_home/.cache/sib]
              sharedBase:
                options: {autoDiscover: false}
                include:
                  makeDirs:
                    - directories: [_home/.cache/shared]
        - flags: {}
    expected:
      output:
        profiles: [main, ./sibling::sib]
  - name: ShouldErrorOnCrossSpecProfileNameCollision
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              include:
                sources: [./sibling]
              main:
                options: {autoDiscover: true}
            sibling/che.yml: |
              main:
                include:
                  makeDirs:
                    - directories: [_home/.cache/sib]
        - flags: {}
    expected:
      errorOutput: ['profile "main" collides']
  - name: ShouldGateWholeSpecOnSpecLevelExecIf
    input:
      args:
        - refFiles:
            che.yml: |
              options:
                runIf: ['env:SPEC_GATE']
              p:
                options: {autoDiscover: true}
                include:
                  runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              include:
                sources: ["${REF_DIR}"]
              main:
                options: {autoDiscover: true}
        - flags:
            unsetEnv: [SPEC_GATE]
            logLevel: debug
    expected:
      stdOut: will not load spec
      output:
        profiles: [main]
  - name: ShouldInheritSpecAutoDiscoverDefault
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                autoDiscover: true
              a: {}
              b:
                options: {autoDiscover: false}
        - flags: {}
    expected:
      output:
        profiles: [a]
  - name: ShouldAutoDiscoverAndGateAtLocalSpecLevelWhenExecIfPasses
    context:
      env: {SPEC_GATE: "1"}
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                autoDiscover: true
                runIf: ['env:SPEC_GATE']
              a: {}
              b: {}
        - flags: {}
    expected:
      output:
        profiles: [a, b]
  - name: ShouldSkipAllLocalProfilesWhenSpecLevelExecIfFails
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                autoDiscover: true
                runIf: ['env:SPEC_GATE']
              a: {}
              b: {}
        - flags:
            unsetEnv: [SPEC_GATE]
    expected:
      output:
        profiles: []
  - name: ShouldComposeTwoIncludedSpecsEachWithIncludeExcludeProfiles
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              include:
                sources: [./one, ./two]
              main:
                options: {autoDiscover: true}
            one/che.yml: |
              alpha:
                options: {autoDiscover: true}
                include:
                  makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
                exclude:
                  makeLinks: [_home/.config/skip-a]
            one/_home/.config/keep-a: keep-a
            one/_home/.config/skip-a: skip-a
            two/che.yml: |
              beta:
                options: {autoDiscover: true}
                include:
                  makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
                exclude:
                  makeLinks: [_home/.config/skip-b]
            two/_home/.config/keep-b: keep-b
            two/_home/.config/skip-b: skip-b
        - flags: {}
    expected:
      output:
        profiles: [main, ./one::alpha, ./two::beta]
        linkDests:
          alpha: ['${HOME}/.config/keep-a']
          beta: ['${HOME}/.config/keep-b']
  - name: ShouldHonorIncludedSpecValidateSpecError
    input:
      args:
        - refFiles:
            che.yml: |
              options:
                validateSpec: error
              p:
                includes:
                  makeLinks: [_home/**]
        - hostFiles:
            che.yml: |
              include:
                sources: ["${REF_DIR}"]
              main:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      errorOutput: includes
  - name: ShouldResolveIncludedSpecWorkingDirectoryOption
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              include:
                sources: [./sub]
              main:
                options: {autoDiscover: true}
            sub/che.yml: |
              options:
                profileWorkingDirectory: tree
              s:
                options: {autoDiscover: true}
                include:
                  makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
            sub/tree/_home/.config/x: x
        - flags: {}
    expected:
      output:
        profiles: [main, ./sub::s]
        linkDests:
          s: ['${HOME}/.config/x']
  - name: ShouldOverrideRemoteRefEntryWorkingDirectory
    input:
      args:
        - refFiles:
            che.yml: |
              gitlabGroup:
                options: {profileWorkingDirectory: default-tree}
                include:
                  makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
            default-tree/_home/.config/def: def
            override-tree/_home/.config/ovr: ovr
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "git::file://${REF_DIR}"
                      profile: gitlabGroup
                      options: {profileWorkingDirectory: override-tree}
        - flags: {}
    expected:
      output:
        profiles: [main, "remote:${REF_NAME}:gitlabGroup"]
        linkDests:
          gitlabGroup: ['${HOME}/.config/ovr']
  - name: ShouldMapNonHomeDestsToSystemRoot
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  makeLinks:
                    - etc/**
                    - Library/**
            etc/zshenv: zshenv
            Library/LaunchDaemons/x.plist: plist
        - flags: {}
    expected:
      output:
        profiles: [main]
        linkDests:
          main: ['/Library/LaunchDaemons/x.plist', '/etc/zshenv']
  - name: ShouldRejectAutoDiscoveryWhenDisabled
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              marked:
                options: {autoDiscover: true}
        - flags: {autoDiscover: false}
    expected:
      errorOutput: auto-discovery is disabled
  - name: ShouldDiscoverMarkedProfilesWhenEnabled
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              marked:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [marked]
  - name: ShouldForceProfilesPastDisabledDiscovery
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              marked:
                options: {autoDiscover: true}
        - flags: {autoDiscover: false, profiles: [marked]}
    expected:
      output:
        profiles: [marked]
  - name: ShouldCascadeSpecAndProfileWorkingDirectories
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              options:
                profileWorkingDirectory: spectree
              p:
                options: {autoDiscover: true}
                include:
                  makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
              q:
                options: {autoDiscover: true, profileWorkingDirectory: proftree}
                include:
                  makeLinks: [{source: _home/**, dest: 's:^_home:$HOME:'}]
            spectree/_home/.config/a: "a\n"
            proftree/_home/.config/b: "b\n"
        - flags: {}
    expected:
      output:
        workingDirs:
          p: "${HOST_REPO}/spectree"
          q: "${HOST_REPO}/proftree"
        linkDests:
          p: ["${HOME}/.config/a"]
          q: ["${HOME}/.config/b"]
  - name: ShouldDefaultToCheLevelWorkingDirectoryFlag
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              r:
                options: {autoDiscover: true}
                include:
                  makeLinks: [_home/**]
            chetree/_home/.config/c: "c\n"
        - flags: {profileWorkingDirectory: chetree}
    expected:
      output:
        workingDirs:
          r: "${HOST_REPO}/chetree"
  - name: ShouldKeepSourcedSpecAnchoredAtItsOwnCheckout
    input:
      args:
        - refFiles:
            che.yml: |
              s:
                options: {autoDiscover: true}
                include:
                  makeLinks: [_home/**]
            _home/.config/x: "x\n"
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: s
            roottree/_home/.config/c: "c\n"
        - flags: {profileWorkingDirectory: roottree}
    expected:
      output:
        workingDirs:
          s: "${REF_DIR}"
  - name: ShouldDiscoverSpecUnderDotChe
    input:
      args:
        - refFiles: {}
        - hostFiles:
            .che/che.yml: |
              main:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main]
        specPath: ${HOST_REPO}/.che/che.yml
  - name: ShouldPreferRootSpecOverDotChe
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              atRoot:
                options: {autoDiscover: true}
            .che/che.yml: |
              nested:
                options: {autoDiscover: true}
        - flags: {logLevel: debug}
    expected:
      stdOut: ['che.yml wins over']
      output:
        profiles: [atRoot]
        specPath: ${HOST_REPO}/che.yml
  - name: ShouldReadRepoVariablesAndCheEnvIntoTheSpec
    context:
      env: {FILE: process}
    input:
      args:
        - refFiles: {}
        - hostFiles:
            .che/che.variables.yml: "PIN: v1\nDECLARED: file\n"
            .che/che.env: "REPO=fromfile\nFILE=fromfile\nDECLARED=env\n"
            .che/che.yml: |
              env: {SPEC: '${{ env.REPO }}-${{ var.PIN }}-${{ var.DECLARED }}-${{ var.FILE }}'}
              variables: {LOCAL: '${{ env.FILE }}'}
              main:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main]
        envOf:
          main: {REPO: fromfile, FILE: process, SPEC: fromfile-v1-file-process}
        varsOf:
          main: {PIN: v1, LOCAL: process}
  - name: ShouldSetIncludedVariablesImplicitlyFromInvokingEnvUnderRefVariables
    input:
      args:
        - refFiles:
            .che/che.env: "A=remote\nB=remote\nIMPLICIT=remote\n"
            .che/che.variables.yml: "RPIN: r1\nKEEP: kept\n"
            che.yml: |
              env: {C: '${{ env.A }}', E: '${{ env.HOSTONLY }}'}
              p:
                options: {profileWorkingDirectory: '${{ var.RPIN }}'}
                include:
                  makeDirs:
                    - directories: ['$HOME/${{ var.KEEP }}/${{ var.IMPLICIT }}']
            r1/.gitkeep: ""
            over/.gitkeep: ""
        - hostFiles:
            .che/che.env: "IMPLICIT=host-che-env\n"
            che.yml: |
              env: {B: host, HOSTONLY: host}
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "${REF_DIR}"
                      profile: p
                      env: {D: entry}
                      variables: {RPIN: over}
        - flags: {}
    expected:
      output:
        profiles: [main, "${REF_DIR}::p"]
        envOf:
          p: {A: remote, B: host, C: remote, D: entry, E: host, IMPLICIT: host-che-env}
        varsOf:
          p: {RPIN: over, KEEP: kept, IMPLICIT: host-che-env}
        workingDirs: {p: "${REF_DIR}/over"}
  - name: ShouldOverlayIncludeSourcesEntryEnvAndVariables
    input:
      args:
        - refFiles:
            che.yml: |
              env: {X: included}
              inc:
                options: {autoDiscover: true, runIf: ['env:X == entry']}
        - hostFiles:
            che.yml: |
              include:
                sources:
                  - source: "${REF_DIR}"
                    env: {X: entry}
                    variables: {V: entry}
              main:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main, "${REF_DIR}::inc"]
        envOf:
          inc: {X: entry}
        varsOf:
          inc: {V: entry}
  - name: ShouldFailOnUnsetVarNamingSpecAndPath
    input:
      args:
        - refFiles: {}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true, profileWorkingDirectory: '${{ var.NOPE }}'}
        - flags: {}
    expected:
      errorOutput: ['che.yml: unset vars:', 'NOPE at /main/options/profileWorkingDirectory']
  - name: ShouldIgnoreDotEnv
    input:
      args:
        - refFiles: {}
        - hostFiles:
            .env: "FROM_DOTENV=yes\n"
            che.yml: |
              main:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main]
        envOf:
          main: {FROM_DOTENV: ""}
  - name: ShouldPreferExportSpecForIncludedSourcesWithoutSpecFile
    input:
      args:
        - refFiles:
            che.export.yml: |
              exported:
                options: {autoDiscover: true}
            .che/che.yml: |
              local:
                options: {autoDiscover: true}
        - hostFiles:
            che.yml: |
              include:
                sources: ["git::file://${REF_DIR}"]
              main:
                options: {autoDiscover: true}
        - flags: {}
    expected:
      output:
        profiles: [main, "remote:${REF_NAME}:exported"]
    notExpected:
      stdOut: ['not designed for reuse']
  - name: ShouldWarnWhenRemoteRefTargetsPlainCheYml
    input:
      args:
        - refFiles:
            che.yml: |
              p:
                options: {autoDiscover: true}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "git::file://${REF_DIR}"
                      profile: p
        - flags: {}
    expected:
      stdOut: ['che.yml: a spec not designed for reuse, consume a che.export.yml']
      output:
        profiles: [main, "remote:${REF_NAME}:p"]
  - name: ShouldResolveExplicitExportSpecOnRemoteRef
    input:
      args:
        - refFiles:
            che.export.yml: |
              p:
                options: {autoDiscover: true}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - source: "git::file://${REF_DIR}"
                      profile: p
        - flags: {}
    expected:
      output:
        profiles: [main, "remote:${REF_NAME}:p"]
    notExpected:
      stdOut: ['not designed for reuse']
  - name: ShouldWalkProfilePathThroughIncludedProfiles
    input:
      args:
        - refFiles:
            che.export.yml: |
              top:
                include:
                  profiles:
                    - mid
                    - {source: ./sub, profile: leaf}
              mid:
                include:
                  makeDirs:
                    - directories: ['$HOME/mid']
            sub/che.export.yml: |
              leaf:
                include:
                  makeDirs:
                    - directories: ['$HOME/leaf']
              hidden:
                include:
                  makeDirs:
                    - directories: ['$HOME/hidden']
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - {source: "${REF_DIR}", profile: "top::mid"}
                    - {source: "${REF_DIR}", profile: "top::leaf"}
                    - {source: "${REF_DIR}", profile: "leaf"}
                    - {source: "${REF_DIR}", profile: "top::hidden"}
        - flags: {}
    expected:
      stdOut:
        - 'profile leaf not found at top level'
        - 'profile hidden is not included by top'
        - 'Unresolved profile refs'
      output:
        profiles: [main, "${REF_DIR}::mid", "./sub::leaf"]
  - name: ShouldTakeSpecFilePathAsIs
    input:
      args:
        - refFiles:
            other/custom.yml: |
              p:
                options: {autoDiscover: true}
        - hostFiles:
            che.yml: |
              main:
                options: {autoDiscover: true}
                include:
                  profiles:
                    - {source: "${REF_DIR}", spec: other/custom.yml, profile: p}
        - flags: {}
    expected:
      output:
