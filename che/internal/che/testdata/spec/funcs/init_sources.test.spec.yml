# [>] 🤖🤖
context:
  function: che.InitSources
cases:
  - name: ShouldCloneRemoteRefSpecSources
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  include:
                    runScripts: [scripts/bootstrap.zsh]
            scripts/bootstrap.zsh: "#!/bin/zsh\n"
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - source: "git::file://${REF_DIR}"
                        profile: gitlabGroup
        - flags: {prepareAfter: true}
    expected:
      stdOut:
        - 'detected remote ref profile gitlabGroup: git::file://${REF_DIR} profile gitlabGroup'
        - 'cloned remote file://${REF_DIR}'
  - name: ShouldFetchRefEvenWhenItsConditionFails
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup:
                  options:
                    runIf: ['env:REF_GATE']
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - source: "git::file://${REF_DIR}"
                        profile: gitlabGroup
    expected:
      stdOut:
        - 'cloned remote file://${REF_DIR}'
    notExpected:
      stdOut:
        - 'evaluated run if'
  - name: ShouldSkipRemoteRefsWithOptionSet
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - source: "git::file://${REF_DIR}"
                        profile: gitlabGroup
        - flags: {skipRemoteRefs: true}
    notExpected:
      stdOut:
        - 'cloned remote'
  - name: ShouldAbortOnUnreachableRemoteWithoutCache
    input:
      args:
        - refFiles:
            che.yml: |
              profilesDefinitions:
                gitlabGroup: {}
        - hostFiles:
            che.yml: |
              profilesDefinitions:
                main:
                  options: {autoDiscover: true}
                  include:
                    profiles:
                      - source: "git::file:///nonexistent-che-src"
                        profile: gitlabGroup
    expected:
      errorOutput: 'init-remote-sources gitlabGroup: '
# [<] 🤖🤖
