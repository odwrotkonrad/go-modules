    gitlab-runner:
        installers:
            - brew
    gitlab-tart-executor:
        installers:
            - brew:
                fromRegistry: cirruslabs/cli
    glab:
        installers:
            - brew
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: [bin/glab]
                platformEligibility:
                    - linux-amd64: sha256:f1c52907558b665f2032b615787d353cd06e54240b501a81f9489bfc8f6a8ebf
                    - linux-arm64: sha256:54a5fe7de0db23e34151c55e561c28e59e6ef6a7731f7d0ce8a00fa58cd8d8f8
                version: 1.112.0
