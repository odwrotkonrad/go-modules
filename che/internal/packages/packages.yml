                checksum: sha256:084c226035af951e582020b2bc055a6521929ee54d8942b4d19577e5d45fd8f7
        installers:
            - binariesRemoteArchive:
                archScheme: odd
                extractBinaries: [kubens]
                platformEligibility: [darwin-arm64, linux-amd64, linux-arm64]
                url: https://github.com/ahmetb/kubectx/releases/download/v{version}/kubens_v{version}_{os}_{arch}.tar.gz
    lefthook:
        installers:
            - brew
            - binariesRemoteArchive:
