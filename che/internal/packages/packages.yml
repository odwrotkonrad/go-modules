        installMethods:
            - brew: konradodwrot/tap/che
            - prebuiltBinariesArchive:
                url: https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/{version}/che_{version}_{os}_{arch}.tar.gz
                archConvention: go
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
                extractBinaries: [che, render-tpl, render-dirs-tree, render-makefile-doc, render-repo-group-index]
