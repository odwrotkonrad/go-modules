    node:
        version: 24.19.0
        requires:
            - nvm
        installers:
            - nvm:
                versions:
                    - 24.19.0
                    - 22.23.2
                global: 24.19.0
    nvm:
        versionCommand: . "$NVM_DIR/nvm.sh" && nvm --version
        installers:
            - script:
                url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.6/install.sh
                env:
                    NVM_DIR: $XDG_CONFIG_HOME/nvm
                    #[why] the installer otherwise appends its bootstrap lines to ~/.zshrc, a che-managed
                    #   symlink into the configs repo; the zsh config sources nvm itself
                    PROFILE: /dev/null
                #[why] nvm is a sourced function, never a binary on PATH: this file marks it installed
                validateArtifact: $XDG_CONFIG_HOME/nvm/nvm.sh
