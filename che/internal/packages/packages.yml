##[>] 🤖🤖
archNameConventions:
    go: {amd64: amd64, arm64: arm64}
    uname: {amd64: x86_64, arm64: aarch64}
    odd: {amd64: x86_64, arm64: arm64}
platforms:
    darwin-arm64: [brew, brew/cask, brew/vscode, prebuiltArchive, script, npm, go, gem, versionManager]
    linux-amd64: [apt, prebuiltArchive, script, npm, go, gem, versionManager]
    linux-arm64: [apt, prebuiltArchive, script, npm, go, gem, versionManager]
basePackages:
    common:
        - curl
        - git
    apt:
        - apt-transport-https
        - ca-certificates
        - gnupg
    prebuiltArchive:
        - unzip
    script:
        - unzip
packages:
    anthropic.claude-code:
        version: 2.1.224
        installMethods:
            - brew:
                vscode: anthropic.claude-code
    apt-transport-https:
        version: __unversioned_latest__
        installMethods:
            - apt
    aws:
        version: 2.36.19
        installMethods:
            - script:
                os: darwin
                remoteUrl: https://awscli.amazonaws.com/v2/install.sh
            - prebuiltArchive:
                url: https://awscli.amazonaws.com/awscli-exe-linux-{arch}-{version}.zip
                archConvention: uname
                platforms: [linux-amd64, linux-arm64]
                bin: aws/dist/aws aws/dist/aws_completer
    az:
        version: __unversioned_latest__
        installMethods:
            - brew:
                cask: azure/azure-cli/azure-cli-preview
    bat:
        version: __unversioned_latest__
        installMethods:
            - brew
            - apt
        #[why] debian renames the binary: the bat name is taken by bacula-console-qt
        command:
            linux: batcat
    bats:
        version: __unversioned_latest__
        installMethods:
            - brew: bats-core
            - apt
    beekeeper-studio:
