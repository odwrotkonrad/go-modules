# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/packages.schema.json
##[>] 🤖🤖
archSchemes:
    go: {amd64: amd64, arm64: arm64}
    uname: {amd64: x86_64, arm64: aarch64}
    odd: {amd64: x86_64, arm64: arm64}
    rust: {amd64: "x86_64-unknown-{os}-musl", arm64: "aarch64-unknown-{os}-gnu"}
osInstallers:
    linux: &base [binariesRemoteArchive, script, npm, go, gem, pyenv, nvm]
    linux-debian: [apt, *base]
    darwin: [brew, brew/cask, vscode, *base]
installerRegistries:
    brew:
        - azure/azure-cli
        - cirruslabs/cli
        - hashicorp/tap
        - konradodwrot/tap
    apt:
        - url: https://deb.debian.org/debian
          verificationKey: /usr/share/keyrings/debian-archive-keyring.gpg
          suites: bookworm-backports
          components: main
        - url: https://download.docker.com/linux/debian
          verificationKey: https://download.docker.com/linux/debian/gpg
        - url: https://packages.cloud.google.com/apt
          verificationKey: https://packages.cloud.google.com/apt/doc/apt-key.gpg
          suites: cloud-sdk
          components: main
        - url: https://konradodwrot.gitlab.io/go-modules/apt
          verificationKey: https://konradodwrot.gitlab.io/go-modules/apt/gpg.key
          suites: stable
          components: main
basePackages:
    common:
        - curl
        - git
        - unzip
    brew:
        - brew
    brew/cask:
        - brew
    apt:
        - apt-transport-https
        - ca-certificates
        - gpg
    vscode:
        - code
packages:
    anthropic.claude-code:
        version: 2.1.224
        installers:
            - vscode
    apt-transport-https:
        installers:
            - apt:
                verify: pkgVersionCmd
    aws:
        installers:
            - brew:
                packageName: awscli
            - binariesRemoteArchive:
                archScheme: uname
                platformEligibility: [linux-amd64, linux-arm64]
                extractBinaries: [aws/dist/aws, aws/dist/aws_completer]
                version: 2.36.18
                url: https://awscli.amazonaws.com/awscli-exe-linux-{arch}-{version}.zip
    az:
        installers:
            - brew/cask:
                packageName: azure-cli-preview
                fromRegistry: azure/azure-cli
    bat:
        installers:
            - brew
            - apt:
                #[why] debian renames the binary (bat is taken by bacula-console-qt): alias it back
                aliasBinary:
                    batcat: bat
    bats:
        installers:
            - brew:
                packageName: bats-core
            - apt
    beekeeper-studio:
        installers:
            - brew/cask
    brew:
        - script:
            url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
            os: darwin
            env:
                NONINTERACTIVE: "1"
    ca-certificates:
        installers:
            - apt
    ccstatusline:
        version: 2.2.27
        installers:
            - npm
    charliermarsh.ruff:
        version: 2026.68.0
        installers:
            - vscode
    che:
        #[why] our own module
        version: latest
        completions:
            zsh:
                cmd: che completion zsh
        installers:
            - brew:
                fromRegistry: konradodwrot/tap
            - apt:
                fromRegistry: konradodwrot.gitlab.io/go-modules/apt
            - binariesRemoteArchive:
                archScheme: go
                platformEligibility: [darwin-arm64, linux-amd64, linux-arm64]
                extractBinaries: [che, render-tpl, render-dirs-tree, render-makefile-doc, render-repo-group-index]
                url: https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/{version}/che_{version}_{os}_{arch}.tar.gz
            - script:
                url: https://konradodwrot.gitlab.io/go-modules/install.sh
    cilium:
        installers:
            - brew:
                packageName: cilium-cli
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: [cilium]
                platformEligibility:
                    - linux-amd64: sha256:cd15e0983bf0acc7946cd05d453d1e58376ea92dec2642e745212df2b07d8852
                    - linux-arm64: sha256:9482937f14061fb239f2dbb2f97f4103de1b101f5d5defbff319f294f9bd540f
                version: 0.19.7
                url: https://github.com/cilium/cilium-cli/releases/download/v{version}/cilium-{os}-{arch}.tar.gz
    claude:
        completions:
            zsh:
                url: https://raw.githubusercontent.com/wbingli/zsh-claudecode-completion/01f50d4a8a98b91cf6d9359deb37d60668c49806/_claude
                checksum: sha256:9bf8cd7077082b03f17d6b595544879ee401d2c8a3afafcdedcf141a298f1d79
        installers:
            - brew/cask:
                packageName: claude-code
            - npm:
                packageName: '@anthropic-ai/claude-code'
                version: 2.1.224
    code:
        installers:
            - brew/cask:
                packageName: visual-studio-code
    codex:
        requires:
            - ruby
        completions:
            zsh:
                cmd: codex completion zsh
        installers:
            - brew/cask
            - npm:
                packageName: '@openai/codex'
                version: 0.147.0
    copilot:
        version: 1.0.78
        installers:
            - npm:
                packageName: '@github/copilot'
    corepack:
        version: 0.35.0
        installers:
            - npm
    containerd:
        version: 2.3.3
        installers:
            - apt:
                packageName: containerd.io
                versionMap: {"2.3.3": "2.3.3-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
    curl:
        installers:
            - brew
            - apt:
                versionMap: {"8.14.1": "8.14.1-2+deb13u2~bpo13+1"}
                fromRegistry: deb.debian.org/debian
            - binariesRemoteArchive:
                archScheme: uname
                extractBinaries: [curl]
                platformEligibility:
                    - linux-amd64: sha256:e955f211202ded2536164588331acfc987dc4b7857efa3577717b1ffeab22029
                    - linux-arm64: sha256:d3f10502a9c6ead9bc3763fde3d12467db03661a263e11fec2ef2edc70e98e9f
                version: 8.21.0
                url: https://github.com/stunnel/static-curl/releases/download/{version}/curl-linux-{arch}-musl-{version}.tar.xz
    docker:
        version: 29.7.2
        requires:
            - dockerd
            - containerd
            - docker-buildx-plugin
            - docker-compose-plugin
        completions:
            zsh:
                cmd: docker completion zsh
        installers:
            - apt:
                packageName: docker-ce-cli
                versionMap: {"29.7.2": "5:29.7.2-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
    docker-buildx-plugin:
        version: 0.36.1
        installers:
            - apt:
                versionMap: {"0.36.1": "0.36.1-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
    docker-compose-plugin:
        version: 5.4.0
        installers:
            - apt:
                versionMap: {"5.4.0": "5.4.0-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
    dockerd:
        version: 29.7.2
        installers:
            - apt:
                packageName: docker-ce
                versionMap: {"29.7.2": "5:29.7.2-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
    duti:
        installers:
            - brew
    editorconfig.editorconfig:
