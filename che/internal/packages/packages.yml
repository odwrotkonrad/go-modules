                platformEligibility:
                    - linux-amd64: sha256:f1de34ea0572363a525a2000d40f5a646733893ad28c924b34ac98304518073f
                    - linux-arm64: sha256:9e4e2eac3f72eb6757eb01ff147622dd16a4805d3a5c2c7a701982df79eb1bd5
                version: 2.1.10
                url: https://github.com/evilmartians/lefthook/releases/download/v{version}/lefthook_{version}_Linux_{arch}
            - binariesRemoteArchive:
                archScheme: odd
                platformEligibility:
                    - darwin-arm64: sha256:d00711fcd2613d232a9bdc24a5e6704367ce505db27a88e670dd73bc40bb1fd9
                version: 2.1.10
                url: https://github.com/evilmartians/lefthook/releases/download/v{version}/lefthook_{version}_MacOS_{arch}
            - npm:
                version: 2.1.10
