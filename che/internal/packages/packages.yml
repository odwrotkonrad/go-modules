        completions:
            zsh:
                url: https://raw.githubusercontent.com/ahmetb/kubectx/v0.11.0/completion/_kubectx.zsh
                checksum: sha256:410b5315f7a91b1c210cbc86c9cc4dda065f2ac180b490f3ebbf7e764ab6b470
        installers:
            - binariesRemoteArchive:
                archScheme: odd
                extractBinaries: [kubectx]
                platformEligibility: [darwin-arm64, linux-amd64, linux-arm64]
                url: https://github.com/ahmetb/kubectx/releases/download/v{version}/kubectx_v{version}_{os}_{arch}.tar.gz
    kubens:
        version: 0.11.0
