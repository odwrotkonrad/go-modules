        - script:
            url: https://pyenv.run
    pyright:
        installers:
            - brew
            - npm:
                version: 1.1.411
    python3:
        version: 3.14.6
        requires:
            - pyenv
            - gcc
            - patch
            - make
            - openssl
            - readline
            - zlib
            - libbz2
            - libffi
            - liblzma
            - libsqlite3
