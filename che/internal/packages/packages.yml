##[>] 🤖🤖
archNameConventions:
    go: {amd64: amd64, arm64: arm64}
    uname: {amd64: x86_64, arm64: aarch64}
    odd: {amd64: x86_64, arm64: arm64}
    rust: {amd64: "x86_64-unknown-{os}-musl", arm64: "aarch64-unknown-{os}-gnu"}
platforms:
    darwin-arm64: [brew, brew/cask, brew/vscode, prebuiltBinariesArchive, script, npm, go, gem, versionManager]
    linux-amd64: [apt, prebuiltBinariesArchive, script, npm, go, gem, versionManager]
    linux-arm64: [apt, prebuiltBinariesArchive, script, npm, go, gem, versionManager]
basePackages:
    common:
        - curl
        - git
        - unzip
    apt:
        - apt-transport-https
        - ca-certificates
        - gpg
packages:
    anthropic.claude-code:
        version: 2.1.224
        installMethods:
            - brew:
                vscode: anthropic.claude-code
    apt-transport-https:
        version: __the_one_published__
        installMethods:
            - apt
    aws:
        version: 2.36.18
        installMethods:
            - brew: awscli
            - prebuiltBinariesArchive:
                url: https://awscli.amazonaws.com/awscli-exe-linux-{arch}-{version}.zip
                archConvention: uname
                platforms: [linux-amd64, linux-arm64]
                extractBinaries: [aws/dist/aws, aws/dist/aws_completer]
    az:
        version: __the_one_published__
        installMethods:
            - brew:
                cask: azure/azure-cli/azure-cli-preview
    bat:
        version: __the_one_published__
        installMethods:
            - brew
            - apt:
                installPackages:
                    bat:
                        #[why] debian renames the binary (bat is taken by bacula-console-qt): alias it back
                        aliasBinary:
                            batcat: bat
    bats:
        version: __the_one_published__
        installMethods:
            - brew: bats-core
            - apt
    beekeeper-studio:
        version: __the_one_published__
        installMethods:
            - brew:
                cask: beekeeper-studio
    brew:
        - script:
            remoteUrl: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
            os: darwin
            env:
                NONINTERACTIVE: "1"
    ca-certificates:
        version: __the_one_published__
        installMethods:
            - apt
    ccstatusline:
        version: 2.2.27
        installMethods:
            - npm
    charliermarsh.ruff:
