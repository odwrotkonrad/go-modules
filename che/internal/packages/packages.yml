##[>] 🤖🤖
archNameConventions:
    go: {amd64: amd64, arm64: arm64}
    uname: {amd64: x86_64, arm64: aarch64}
    odd: {amd64: x86_64, arm64: arm64}
platforms:
    darwin-arm64: [brew, brew/cask, brew/vscode, prebuiltArchive, script, npm, go, gem, versionManager]
    linux-amd64: [apt, prebuiltArchive, script, npm, go, gem, versionManager]
    linux-arm64: [apt, prebuiltArchive, script, npm, go, gem, versionManager]
basePackages:
    common:
        - curl
    apt:
        - apt-transport-https
        - ca-certificates
        - gnupg
packages:
    anthropic.claude-code:
        - brew:
            vscode: anthropic.claude-code
    apt-transport-https:
        - apt
    aws:
        - script:
            os: darwin
            remoteUrl: https://awscli.amazonaws.com/v2/install.sh
        - prebuiltArchive:
            url: https://awscli.amazonaws.com/awscli-exe-linux-{arch}.zip
            archConvention: uname
            platforms: [linux-amd64, linux-arm64]
            bin: aws/dist/aws aws/dist/aws_completer
    az:
        - brew:
            cask: azure/azure-cli/azure-cli-preview
    bat:
        - brew
        - apt
    bats:
        - brew: bats-core
        - apt
    beekeeper-studio:
        - brew:
            cask: beekeeper-studio
    brew:
        - script:
            remoteUrl: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
            os: darwin
            env:
                NONINTERACTIVE: "1"
    ca-certificates:
        - apt
    ccstatusline:
        version: "2.2.*"
        installMethods:
            - npm
    charliermarsh.ruff:
        - brew:
            vscode: charliermarsh.ruff
    che:
        completions:
            zsh:
                cmd: che completion zsh
        installMethods:
            - brew: konradodwrot/tap/che
            - prebuiltArchive:
                url: https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/latest/che_latest_{os}_{arch}.tar.gz
                archConvention: go
                platforms: [darwin, linux]
                bin: che render-tpl render-dirs-tree render-makefile-doc render-repo-group-index
            - script:
                remoteUrl: https://konradodwrot.gitlab.io/go-modules/install.sh
    cilium:
        version: "0.19.*"
        installMethods:
            - brew: cilium-cli
            - prebuiltArchive:
                url: https://github.com/cilium/cilium-cli/releases/download/v{version}/cilium-{os}-{arch}.tar.gz
                archConvention: go
                bin: cilium
                platforms: [linux-amd64, linux-arm64]
    claude:
        completions:
            zsh:
                url: https://raw.githubusercontent.com/wbingli/zsh-claudecode-completion/01f50d4a8a98b91cf6d9359deb37d60668c49806/_claude
                sha256: 9bf8cd7077082b03f17d6b595544879ee401d2c8a3afafcdedcf141a298f1d79
        installMethods:
            - brew:
                cask: claude-code
            - npm: '@anthropic-ai/claude-code'
    code:
        - brew:
            cask: visual-studio-code
    codex:
        completions:
            zsh:
                cmd: codex completion zsh
        installMethods:
            - brew:
                cask: codex
            - npm: '@openai/codex'
    copilot:
        - npm: '@github/copilot'
    corepack:
        - npm
    curl:
        - brew
        - apt
    docker:
        completions:
            zsh:
                cmd: docker completion zsh
        installMethods:
            - apt:
                packages:
                    - docker-ce
                    - docker-ce-cli
                    - containerd.io
                    - docker-buildx-plugin
                    - docker-compose-plugin
                repo:
                    url: https://download.docker.com/linux/debian
                    gpgUrl: https://download.docker.com/linux/debian/gpg
    duti:
        - brew
    editorconfig.editorconfig:
        - brew:
            vscode: editorconfig.editorconfig
    esbenp.prettier-vscode:
        - brew:
            vscode: esbenp.prettier-vscode
    fd:
        - brew
        - apt: fd-find
    ffmpeg:
        - brew
        - apt
    font-jetbrains-mono:
        - brew:
            cask: font-jetbrains-mono
    gcc:
        - brew
        - apt
    gcloud:
        installMethods:
            - apt:
                packages:
                    - google-cloud-cli
                repo:
                    url: https://packages.cloud.google.com/apt
                    gpgUrl: https://packages.cloud.google.com/apt/doc/apt-key.gpg
                    suites: cloud-sdk
                    components: main
            - brew:
                cask: gcloud-cli
    get-os-open-files-with:
        - go: gitlab.com/konradodwrot/go-modules/get-os-open-files-with@latest
    gh:
        - brew
        - apt
    git:
        - brew
        - apt
    gitlab-runner:
        - brew
    gitlab-tart-executor:
        - brew: cirruslabs/cli/gitlab-tart-executor
    glab:
        version: "1.*"
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://gitlab.com/gitlab-org/cli/-/releases/v{version}/downloads/glab_{version}_linux_{arch}.tar.gz
                archConvention: go
                bin: bin/glab
                platforms: [linux-amd64, linux-arm64]
    gnupg:
        command: gpg
        installMethods:
            - brew
            - apt
    go:
        version: "1.26.*"
        completions:
            zsh:
                name: _golang
                url: https://raw.githubusercontent.com/zsh-users/zsh-completions/398b4b74775102da7bc6a510a08d0914592f9e62/src/_golang
                sha256: f36054c235ecc827b66b61deb5cf98221254feefd997751cdc85a07dc6c451c3
        installMethods:
            - prebuiltArchive:
                url: https://go.dev/dl/go{version}.{os}-{arch}.tar.gz
                archConvention: go
                bin: go/bin/go go/bin/gofmt
                versionsFrom: https://github.com/golang/go
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
    golang.go:
        - brew:
            vscode: golang.go
    gopls:
        - go: golang.org/x/tools/gopls@latest
    goreleaser:
        version: "2.16.*"
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://github.com/goreleaser/goreleaser/releases/download/v{version}/goreleaser_Linux_{arch}.tar.gz
                archConvention: odd
                bin: goreleaser
                platforms: [linux-amd64, linux-arm64]
    grafana:
        - brew
    hoovercj.vscode-settings-cycler:
        - brew:
            vscode: hoovercj.vscode-settings-cycler
    htop:
        - brew
        - apt
    jaeger:
        version: "2.18.*"
        installMethods:
            - prebuiltArchive:
                url: https://github.com/jaegertracing/jaeger/releases/download/v{version}/jaeger-{version}-darwin-arm64.tar.gz
                bin: jaeger-{version}-darwin-arm64/jaeger
                platforms: [darwin-arm64]
    jq:
        - brew
        - apt
    kind:
        version: "0.32.*"
        completions:
            zsh:
                cmd: kind completion zsh
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://github.com/kubernetes-sigs/kind/releases/download/v{version}/kind-{os}-{arch}
                archConvention: go
                platforms: [linux-amd64, linux-arm64]
    kubectl:
        version: "1.36.*"
        completions:
            zsh:
                cmd: kubectl completion zsh
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://dl.k8s.io/release/v{version}/bin/{os}/{arch}/kubectl
                archConvention: go
                versionsFrom: https://github.com/kubernetes/kubernetes
                platforms: [linux-amd64, linux-arm64]
        versionCommand: kubectl version --client
    kubectx:
        version: "0.11.*"
        completions:
            zsh:
                url: https://raw.githubusercontent.com/ahmetb/kubectx/v0.11.0/completion/_kubectx.zsh
                sha256: 410b5315f7a91b1c210cbc86c9cc4dda065f2ac180b490f3ebbf7e764ab6b470
        installMethods:
            - prebuiltArchive:
                url: https://github.com/ahmetb/kubectx/releases/download/v{version}/kubectx_v{version}_{os}_{arch}.tar.gz
                archConvention: odd
                bin: kubectx
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
    kubens:
        version: "0.11.*"
        completions:
            zsh:
                url: https://raw.githubusercontent.com/ahmetb/kubectx/v0.11.0/completion/_kubens.zsh
                sha256: 084c226035af951e582020b2bc055a6521929ee54d8942b4d19577e5d45fd8f7
        installMethods:
            - prebuiltArchive:
                url: https://github.com/ahmetb/kubectx/releases/download/v{version}/kubens_v{version}_{os}_{arch}.tar.gz
                archConvention: odd
                bin: kubens
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
    lefthook:
        version: "2.1.*"
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://github.com/evilmartians/lefthook/releases/download/v{version}/lefthook_{version}_Linux_{arch}
                archConvention: odd
                platforms: [linux-amd64, linux-arm64]
            - prebuiltArchive:
                url: https://github.com/evilmartians/lefthook/releases/download/v{version}/lefthook_{version}_MacOS_{arch}
                archConvention: odd
                platforms: [darwin-arm64]
            - npm
    libbz2:
        - apt: libbz2-dev
    libffi:
        - apt: libffi-dev
    liblzma:
        - apt: liblzma-dev
    libsqlite3:
        - apt: libsqlite3-dev
    libtool:
        - brew
        - apt
    logcli:
        - brew
    loki:
        - brew
    make:
        - brew
        - apt
    mindaro-dev.file-downloader:
        - brew:
            vscode: mindaro-dev.file-downloader
    ms-azuretools.vscode-containers:
        - brew:
            vscode: ms-azuretools.vscode-containers
    ms-kubernetes-tools.vscode-kubernetes-tools:
        - brew:
            vscode: ms-kubernetes-tools.vscode-kubernetes-tools
    ms-python.debugpy:
        - brew:
            vscode: ms-python.debugpy
    ms-python.python:
        - brew:
            vscode: ms-python.python
    ms-python.vscode-python-envs:
        - brew:
            vscode: ms-python.vscode-python-envs
    ms-vscode-remote.remote-containers:
        - brew:
            vscode: ms-vscode-remote.remote-containers
    nmap:
        - brew
        - apt
    node:
        version: "24.16.*"
        requires:
            - nvm
        installMethods:
            - versionManager:
                tool: nvm
                versions:
                    - 24.16.0
                global: 24.16.0
    nvm:
        - script:
            remoteUrl: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.6/install.sh
            env:
                NVM_DIR: $XDG_CONFIG_HOME/nvm
                PROFILE: /dev/null
            creates: $XDG_CONFIG_HOME/nvm/nvm.sh
    op:
        - brew:
            cask: 1password-cli
    openai.chatgpt:
        - brew:
            vscode: openai.chatgpt
    openssh:
        - brew
        - apt: openssh-client
    openssl:
        - brew: openssl@3
        - apt: libssl-dev
    otelcol:
        version: "0.153.*"
        installMethods:
            - prebuiltArchive:
                url: https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{version}/otelcol_{version}_{os}_{arch}.tar.gz
                archConvention: go
                bin: otelcol
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
    packer:
        - brew: hashicorp/tap/packer
    pandoc:
        - brew
        - apt
    pcre2:
        - brew
        - apt: libpcre2-dev
    pipx:
        - brew
        - apt
    pkgconf:
        - brew
        - apt
    pnpm:
        - brew
        - npm
    procs:
        - brew
    prometheus:
        version: "3.5.*"
        installMethods:
            - prebuiltArchive:
                url: https://github.com/prometheus/prometheus/releases/download/v{version}/prometheus-{version}.{os}-{arch}.tar.gz
                archConvention: go
                bin: prometheus-{version}.{os}-{arch}/prometheus prometheus-{version}.{os}-{arch}/promtool
                platforms: [darwin-arm64]
    pstree:
        - brew
        - apt: psmisc
    pyenv:
        - brew
        - script:
            remoteUrl: https://pyenv.run
    pyright:
        - brew
        - npm
    python3:
        version: "3.14.*"
        requires:
            - pyenv
            - libbz2
            - libffi
            - liblzma
            - libsqlite3
        installMethods:
            - versionManager:
                tool: pyenv
                versions:
                    - 3.14.5
                global: 3.14.5
    readline:
        - brew
        - apt: libreadline-dev
    redhat.vscode-yaml:
        - brew:
            vscode: redhat.vscode-yaml
    rg:
        completions:
            zsh:
                cmd: rg --generate=complete-zsh
        installMethods: []
    ruby:
        - brew
        - apt: ruby-full
    ruby-dev:
        - apt: ruby-dev
    ruby-lsp:
        - gem: ruby-lsp
    shellcheck:
        - brew
        - apt
    showkey:
        - brew
        - apt: kbd
    sqlite3:
        - brew: sqlite
        - apt
    stow:
        - brew
        - apt
    tamasfe.even-better-toml:
        - brew:
            vscode: tamasfe.even-better-toml
    tart:
        - brew: cirruslabs/cli/tart
    tcl:
        - brew: tcl-tk
        - apt
    terraform:
        version: "1.15.*"
        installMethods:
            - prebuiltArchive:
                url: https://releases.hashicorp.com/terraform/{version}/terraform_{version}_{os}_{arch}.zip
                archConvention: go
                versionsFrom: https://github.com/hashicorp/terraform
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
    tmux:
        - brew
        - apt
    tree:
        - brew
        - apt
    tsc:
        - brew: typescript
        - npm: typescript
    typescript-language-server:
        - brew
        - npm
    unzip:
        - apt
    uv:
        - brew
    watch:
        - brew
        - apt: procps
    xz:
        - brew
        - apt: xz-utils
    yq:
        version: "4.53.*"
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://github.com/mikefarah/yq/releases/download/v{version}/yq_{os}_{arch}
                archConvention: go
                platforms: [darwin-arm64, linux-amd64, linux-arm64]
    yzhang.markdown-all-in-one:
        - brew:
            vscode: yzhang.markdown-all-in-one
    zig:
        version: "0.16.*"
        installMethods:
            - brew
            - prebuiltArchive:
                url: https://ziglang.org/download/{version}/zig-{arch}-linux-{version}.tar.xz
                archConvention: uname
                bin: zig-{arch}-linux-{version}/zig
                versionsFrom: https://github.com/ziglang/zig
                platforms: [linux-amd64, linux-arm64]
    zlib:
        - brew
        - apt: zlib1g-dev
    zstd:
        - brew
        - apt
