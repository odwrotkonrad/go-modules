context:
  function: packages.Host.expandTokens
cases:
  - name: ShouldExpandAllHolesOnLinuxAmd64
    input:
      args:
        - os: linux
        - arch: x86_64
        - template: "https://x/{version}/y_{version}_{os}_{arch}.tar.gz"
        - version: "1.2.3"
    expected:
      output: "https://x/1.2.3/y_1.2.3_linux_x86_64.tar.gz"
  - name: ShouldExpandConventionArchOnDarwinArm64
    input:
      args:
        - os: darwin
        - arch: aarch64
        - template: "{os}-{arch}"
        - version: ""
    expected:
      output: "darwin-aarch64"
# [<] 🤖🤖
