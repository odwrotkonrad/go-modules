# [>] 🤖🤖
context:
  function: packages.Host.pick
cases:
  - name: ShouldPickBrewOnMacBeforeApt
    input:
      args:
        - os: darwin
        - cmds: [brew, apt-get]
        - entry: "[brew, apt]"
    expected:
      output: {mgr: brew, picked: true}
  - name: ShouldPickAptOnLinux
    input:
      args:
        - os: linux
        - cmds: [apt-get]
        - entry: "[brew, apt]"
    expected:
      output: {mgr: apt, picked: true}
  - name: ShouldSkipNpmWithoutNpmCommand
    input:
      args:
        - os: linux
        - cmds: []
        - entry: "[{npm: {packageName: x}}]"
    expected:
      output: {picked: false}
  - name: ShouldPickBinaryWhenShaMatchesHost
    input:
      args:
        - os: linux
        - cmds: []
        - entry: |
            - brew
            - binariesRemoteArchive:
                platformEligibility:
                  - linux-amd64: sha256:abc
                url: https://example.com/x
    expected:
      output: {mgr: binariesRemoteArchive, picked: true}
  - name: ShouldSkipBinaryWithoutHostSha
    input:
      args:
        - os: darwin
        - cmds: []
        - entry: |
            - binariesRemoteArchive:
                platformEligibility:
                  - linux-amd64: sha256:abc
                url: https://example.com/x
    expected:
      output: {picked: false}
  - name: ShouldPreferListedManagerOverEntryOrder
    input:
      args:
        - os: darwin
        - cmds: [brew]
        - entry: |
            - brew
            - binariesRemoteArchive:
                platformEligibility:
                  - darwin-amd64: sha256:abc
                url: https://example.com/x
        - preferred: [binariesRemoteArchive]
    expected:
      output: {mgr: binariesRemoteArchive, picked: true}
  - name: ShouldFallBackToEntryOrderWhenPreferredInapplicable
    input:
      args:
        - os: linux
        - cmds: [apt-get]
        - entry: "[brew, apt]"
        - preferred: [brew]
    expected:
      output: {mgr: apt, picked: true}
  - name: ShouldKeepEntryOrderAmongUnlistedManagers
    input:
      args:
        - os: darwin
        - cmds: [brew, npm]
        - entry: "[brew, npm]"
        - preferred: [gem]
    expected:
      output: {mgr: brew, picked: true}
  - name: ShouldErrorOnUnknownManager
    input:
      args:
        - os: linux
        - cmds: []
        - entry: "[pacman]"
    expected:
      errorOutput: "unknown manager for pkg: pacman"
