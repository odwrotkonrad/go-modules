# [>] 🤖🤖
context:
  function: packages.Item.UnmarshalYAML
cases:
  - name: ShouldDecodeBareManagerAsCanonicalName
    input:
      args:
        - yaml: "brew"
    expected:
      output: {mgr: brew, name: ""}
  - name: ShouldDecodePerManagerName
    input:
      args:
        - yaml: "{apt: {packageName: fd-find}}"
    expected:
      output: {mgr: apt, name: fd-find}
  - name: ShouldDecodeBrewCaskForm
    input:
      args:
        - yaml: "{brew/cask: {packageName: beekeeper-studio}}"
    expected:
      output: {mgr: cask, name: beekeeper-studio}
  - name: ShouldDecodeNpmScopedPin
    input:
      args:
        - yaml: '{npm: {packageName: "@anthropic-ai/claude-code"}}'
    expected:
      output: {mgr: npm, name: "@anthropic-ai/claude-code"}
  - name: ShouldDecodeBinaryProps
    input:
      args:
        - yaml: |
            binariesRemoteArchive:
              platformEligibility:
                - linux-amd64: sha256:abc
              version: 0.32.0
              url: https://example.com/kind-{os}-{arch}
    expected:
      output: {mgr: binariesRemoteArchive, name: "", version: 0.32.0, url: "https://example.com/kind-{os}-{arch}", platformNames: [linux-amd64], checksums: {linux-amd64: "sha256:abc"}}
  - name: ShouldDecodeScriptScalarForm
    input:
      args:
        - yaml: '{script: "echo hi"}'
    expected:
      output: {mgr: script, name: "", run: "echo hi"}
  - name: ShouldDecodeScriptMapFormWithOs
    input:
      args:
        - yaml: |
            script:
              os: darwin
              run: echo hi
    expected:
      output: {mgr: script, name: "", run: "echo hi", scriptOs: darwin}
  - name: ShouldDecodeScriptPathForm
    input:
      args:
        - yaml: "{script: {path: scripts/install-brew.sh, os: darwin}}"
    expected:
      output: {mgr: script, name: "", scriptPath: scripts/install-brew.sh, scriptOs: darwin}
  - name: ShouldDecodeScriptUrlForm
    input:
      args:
        - yaml: "{script: {url: https://example.com/install.sh}}"
    expected:
      output: {mgr: script, name: "", scriptUrl: https://example.com/install.sh}
  - name: ShouldDecodeBrewCodeExtensionForm
    input:
      args:
        - yaml: "{brew/vscode: {packageName: golang.go}}"
    expected:
      output: {mgr: vscode, name: golang.go}
  - name: ShouldRejectBareCodeItem
    input:
      args:
        - yaml: "code"
    expected:
      errorOutput: "brew kinds are installer keys: brew/cask or brew/vscode"
  - name: ShouldRejectDirectCodeMap
    input:
      args:
        - yaml: "{code: golang.go}"
    expected:
      errorOutput: "brew kinds are installer keys: brew/cask or brew/vscode"
  - name: ShouldErrorOnMultiKeyMap
    input:
      args:
        - yaml: "{apt: a, brew: b}"
    expected:
      errorOutput: "manager item must be a scalar or a single-key map"
  - name: ShouldErrorOnMalformedBrewObject
    input:
      args:
        - yaml: "{brew: {formula: x, cask: y}}"
    expected:
      errorOutput: "brew item: formula is gone"
  - name: ShouldRejectNpmEmbeddedPin
    input:
      args:
        - yaml: "{npm: {packageName: lefthook@2.1.9}}"
    expected:
      errorOutput: "npm item lefthook@2.1.9: version pins go in the version field"
  - name: ShouldRejectStringItemValue
    input:
      args:
        - yaml: "{npm: lefthook}"
    expected:
      errorOutput: "npm item: package names go in packageName"
  - name: ShouldRejectLegacyArchTokens
    input:
      args:
        - yaml: "{binariesRemoteArchive: {url: 'https://x/y-{arch_x}.zip'}}"
    expected:
      errorOutput: "binariesRemoteArchive tokens {arch_x}/{arch_g} are gone: use {arch} with archScheme"
  - name: ShouldRejectAptEmbeddedPin
    input:
      args:
        - yaml: "{apt: {packageName: jq=1.7-1}}"
    expected:
      errorOutput: "apt item jq=1.7-1: version pins go in versionMap"
# [<] 🤖🤖
