# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options:
    autoDiscover: true
  include:
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //shared/license/LICENSE
            dest: LICENSE
          - source: //repos/go-modules
            <<<:
              - source: /purpose.md
                dest: assets/docs-agents/purpose.md
              - source: /che-purpose.md
                dest: che/assets/docs-agents/purpose.md
              - source: /lib-purpose.md
                dest: lib/assets/docs-agents/purpose.md
              - source: /get-os-open-files-with-purpose.md
                dest: get-os-open-files-with/assets/docs-agents/purpose.md
              - source: /get-term-open-files-with-purpose.md
                dest: get-term-open-files-with/assets/docs-agents/purpose.md
              - source: /docs
                dest: che/docs
                <<<:
                  - source: /spec.md
                    dest: spec.md
                  - source: /observability.md
                    dest: observability.md
              - source: /templates/3-audience
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /README.md.ontoRepo.tpl
                    dest: README.md
                  - source: /AGENTS.md.ontoRepo.tpl
                    dest:
                      - CLAUDE.md
                      - path: AGENTS.md
                        options:
                          renderReferencedFiles: true
          - dest: assets/data
            <<<:
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}//profiles/claude/che.yml::claude/virt"
        ctx:
          repo: GoModules

#[why] the repo declares the toolchain it builds and tests with, so no host or image has to carry go
#   in advance for this repo to prepare
devEnv:
  include:
    installPackages:
      - go
#[what] the shared CI payload the emit-events job runs
bootstrapCrossRepoCI:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/cross-repo/misc@${{ env.MISC_REF }}//che.yml::bootstrapCrossRepoCITagging"

envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert
##[<] 🤖🤖
