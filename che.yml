# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options: {autoDiscover: true}
  include:
    renderTemplates:
      - source: .gitlab/ci/test-install-packages.gitlab-ci.yml.ontoRepo.tpl
        dest:
          - {path: .gitlab/ci/test-install-packages.gitlab-ci.yml}
      - source: "@gitlab.com/konradodwrot/prose?ref=v0.0.1"
        renderTemplates:
          - source: //repos/go-modules/purpose.md
            dest:
              - {path: assets/docs-agents/purpose.md, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/che-purpose.md
            dest:
              - {path: che/assets/docs-agents/purpose.md, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/lib-purpose.md
            dest:
              - {path: lib/assets/docs-agents/purpose.md, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/get-os-open-files-with-purpose.md
            dest:
              - {path: get-os-open-files-with/assets/docs-agents/purpose.md, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/get-term-open-files-with-purpose.md
            dest:
              - {path: get-term-open-files-with/assets/docs-agents/purpose.md, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/docs/spec.md
            dest:
              - {path: che/docs/spec.md, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/docs/observability.md
            dest:
              - {path: che/docs/observability.md, options: {skipAutoGeneratedHeader: true}}
          - source: //conventions/conventions.md
            dest:
              - {path: assets/data/conventions.md, options: {skipAutoGeneratedHeader: true}}
          - source: //templates/2-data/makefile-agents.md.ontoRepo.tpl
            dest:
              - {path: assets/data/makefile.agents.md}
          - source: //templates/2-data/repo-structure.md.ontoRepo.tpl
            dest:
              - {path: assets/data/repo-structure.md}
          - source: //shared/license/LICENSE
            dest:
              - {path: LICENSE, options: {skipAutoGeneratedHeader: true}}
          - source: //repos/go-modules/templates/3-audience/AGENTS.md.ontoRepo.tpl
            dest:
              - {path: CLAUDE.md}
              - {path: AGENTS.md, options: {renderReferencedFiles: true}}
          - source: //repos/go-modules/templates/3-audience/README.md.ontoRepo.tpl
            dest:
              - {path: README.md}

claude-agents:
  options: {autoDiscover: true, runIf: ['builtin:isVirt']}
  include:
    profiles:
      - source: "@https://gitlab.com/konradodwrot/configs//profiles/llm/claude/che.yml::llm/claude/virt"
        ctx: {repo: GoModules}
##[<] 🤖🤖
