# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options: {autoDiscover: true}
  include:
    renderTemplates:
      - source: .gitlab/ci/test-install-packages.gitlab-ci.yml.ontoRepo.tpl
        dest:
          - {path: .gitlab/ci/test-install-packages.gitlab-ci.yml}
      - source: "@gitlab.com/konradodwrot/prose?ref=v0.0.1"
        options: {skipAutoGeneratedHeader: true}
        renderTemplates:
          - {source: //shared/license/LICENSE, dest: LICENSE}
          - source: //repos/go-modules
            renderTemplates:
              - {source: /purpose.md, dest: assets/docs-agents/purpose.md}
              - {source: /che-purpose.md, dest: che/assets/docs-agents/purpose.md}
              - {source: /lib-purpose.md, dest: lib/assets/docs-agents/purpose.md}
              - {source: /get-os-open-files-with-purpose.md, dest: get-os-open-files-with/assets/docs-agents/purpose.md}
              - {source: /get-term-open-files-with-purpose.md, dest: get-term-open-files-with/assets/docs-agents/purpose.md}
              - source: /docs
                dest: che/docs
                renderTemplates:
                  - {source: /spec.md, dest: spec.md}
                  - {source: /observability.md, dest: observability.md}
              - source: /templates/3-audience
                options: {skipAutoGeneratedHeader: false}
                renderTemplates:
                  - {source: /README.md.ontoRepo.tpl, dest: README.md}
                  - source: /AGENTS.md.ontoRepo.tpl
                    dest:
                      - CLAUDE.md
                      - {path: AGENTS.md, options: {renderReferencedFiles: true}}
          - dest: assets/data
            renderTemplates:
              - {source: //conventions/conventions.md, dest: conventions.md}
              - source: //templates/2-data
                options: {skipAutoGeneratedHeader: false}
                renderTemplates:
                  - {source: /makefile-agents.md.ontoRepo.tpl, dest: makefile.agents.md}
                  - {source: /repo-structure.md.ontoRepo.tpl, dest: repo-structure.md}

claude-agents:
  options: {autoDiscover: true, runIf: ['builtin:isVirt']}
  include:
    profiles:
      - source: "@https://gitlab.com/konradodwrot/configs//profiles/llm/claude/che.yml::llm/claude/virt"
        ctx: {repo: GoModules}
##[<] 🤖🤖
