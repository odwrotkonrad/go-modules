# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/packages.schema.json
##[>] 🤖🤖
archSchemes:
    go: {amd64: amd64, arm64: arm64}
    uname: {amd64: x86_64, arm64: aarch64}
    odd: {amd64: x86_64, arm64: arm64}
    rust: {amd64: "x86_64-unknown-{os}-musl", arm64: "aarch64-unknown-{os}-gnu"}
osInstallers:
    linux: &base [binariesRemoteArchive, script, buildFromSource, npm, go, gem, pyenv, nvm, nix]
    linux-debian: [apt, *base]
    darwin: [brew, brew/cask, *base]
installerRegistries:
    nix:
        - name: nixpkgs
          url: github:NixOS/nixpkgs
          ref: nixpkgs-unstable
        - name: nixpkgs-26.05
          url: github:NixOS/nixpkgs
          ref: nixos-26.05
    brew:
        - azure/azure-cli
        - cirruslabs/cli
        - hashicorp/tap
        - odwrotkonrad/tap
    apt:
        - url: https://deb.debian.org/debian
          verificationKey: /usr/share/keyrings/debian-archive-keyring.gpg
          suites: bookworm-backports
          components: main
        - url: https://download.docker.com/linux/debian
          verificationKey: https://download.docker.com/linux/debian/gpg
        - url: https://packages.cloud.google.com/apt
          verificationKey: https://packages.cloud.google.com/apt/doc/apt-key.gpg
          suites: cloud-sdk
          components: main
        - url: https://konradodwrot.gitlab.io/go-modules/apt
          verificationKey: https://konradodwrot.gitlab.io/go-modules/apt/gpg.key
          suites: stable
          components: main
        - url: https://packages.gitlab.com/runner/gitlab-runner/debian
          verificationKey: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
          components: main
        - url: https://packages.microsoft.com/repos/azure-cli
          verificationKey: https://packages.microsoft.com/keys/microsoft.asc
          components: main
        - url: https://packages.microsoft.com/repos/code
          verificationKey: https://packages.microsoft.com/keys/microsoft.asc
          suites: stable
          components: main
        - url: https://apt.grafana.com
          verificationKey: https://apt.grafana.com/gpg.key
          suites: stable
          components: main
basePackages:
    apt:
        - apt-transport-https
        - ca-certificates
        - gpg
    brew:
        - brew
    brew/cask:
        - brew
    buildFromSource:
        - gcc
        - make
    gem:
        - ruby
    go:
        - go
    nix:
        - nix
    npm:
        - node
    nvm:
        - nvm
    pyenv:
        - pyenv
    script:
        - curl
        - git
        - tar
        - unzip
    vscode:
        - code
toolPackages:
    vscode:
        anthropic.claude-code: 2.1.224
        charliermarsh.ruff: 2026.72.0
        editorconfig.editorconfig: 0.18.2
        esbenp.prettier-vscode: 12.4.0
        golang.go: 0.56.0
        hoovercj.vscode-settings-cycler: 1.0.1
        mindaro-dev.file-downloader: 1.0.13
        ms-azuretools.vscode-containers: 2.4.5
        ms-kubernetes-tools.vscode-kubernetes-tools: 1.4.1
        ms-python.debugpy: 2026.6.0
        ms-python.python: 2026.4.0
        ms-python.vscode-python-envs: 1.36.0
        ms-vscode-remote.remote-containers: 0.466.0
        openai.chatgpt: 26.623.31921
        redhat.vscode-yaml: 1.24.0
        tamasfe.even-better-toml: 0.21.2
        yzhang.markdown-all-in-one: 3.6.3
packages:
    apt-transport-https:
        installers:
            - apt:
                verify:
                    pkgMgrVersionCheck: true
                    checkInPath: false
    aws:
        installers:
            - brew:
                packageName: awscli
            - binariesRemoteArchive:
                archScheme: uname
                platformEligibility: [linux-amd64, linux-arm64]
                extractBinaries: [aws/dist/aws, aws/dist/aws_completer]
                version: 2.36.18
                url: https://awscli.amazonaws.com/awscli-exe-linux-{arch}-{version}.zip
            - nix:
                packageName: awscli2
                versionMap: {"2.35.11": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    az:
        installers:
            - brew/cask:
                packageName: azure-cli-preview
                fromRegistry: azure/azure-cli
            - apt:
                packageName: azure-cli
                fromRegistry: packages.microsoft.com/repos/azure-cli
            - nix:
                packageName: azure-cli
                versionMap: {"2.89.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    bat:
        manpages: [bat.1]
        installers:
            - brew
            - apt:
                #[why] debian renames the binary (bat is taken by bacula-console-qt): alias it back
                #[why] debian ships no man page under either name
                aliasBinary:
                    batcat: bat
                manpages: []
            - nix:
                fromRegistry: nixpkgs-26.05
                versionMap: {"0.26.1": "02e08985a27c65ffd33d434eeb2e660a2e4dc84d"}
    bats:
        manpages: [bats.1]
        installers:
            - brew:
                packageName: bats-core
            - apt
            - nix:
                versionMap: {"1.14.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    beekeeper-studio:
        verify:
            pkgMgrVersionCheck: true
            checkInPath: false
        installers:
            - brew/cask
    brew:
        - script:
            url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
            os: darwin
            env:
                NONINTERACTIVE: "1"
    ca-certificates:
        verify:
            pkgMgrVersionCheck: true
            checkInPath: false
        installers:
            - apt
    ccstatusline:
        version: 2.2.27
        installers:
            - npm
    che:
        #[why] our own module
        version: latest
        completions:
            zsh:
                cmd: che completion zsh
        installers:
            - brew:
                fromRegistry: odwrotkonrad/tap
            - apt:
                fromRegistry: konradodwrot.gitlab.io/go-modules/apt
            - binariesRemoteArchive:
                archScheme: go
                platformEligibility: [darwin-arm64, linux-amd64, linux-arm64]
                extractBinaries: [che, render-tpl, render-dirs-tree, render-makefile-doc, render-repo-group-index]
                url: https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/{version}/che_{version}_{os}_{arch}.tar.gz
            - script:
                url: https://konradodwrot.gitlab.io/go-modules/install.sh
    cilium:
        versionCommand: cilium version --client
        installers:
            - brew:
                packageName: cilium-cli
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: [cilium]
                platformEligibility:
                    - linux-amd64: sha256:cd15e0983bf0acc7946cd05d453d1e58376ea92dec2642e745212df2b07d8852
                    - linux-arm64: sha256:9482937f14061fb239f2dbb2f97f4103de1b101f5d5defbff319f294f9bd540f
                version: 0.19.7
                url: https://github.com/cilium/cilium-cli/releases/download/v{version}/cilium-{os}-{arch}.tar.gz
            - nix:
                packageName: cilium-cli
                versionMap: {"0.19.7": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    claude:
        completions:
            zsh:
                url: https://raw.githubusercontent.com/wbingli/zsh-claudecode-completion/01f50d4a8a98b91cf6d9359deb37d60668c49806/_claude
                checksum: sha256:9bf8cd7077082b03f17d6b595544879ee401d2c8a3afafcdedcf141a298f1d79
        installers:
            - brew/cask:
                packageName: claude-code
            - npm:
                packageName: '@anthropic-ai/claude-code'
                version: 2.1.224
    code:
        verify:
            # [why] bare `code --version` fails as root: "You are trying to start Visual Studio Code as a super user which isn't recommended. If this was intended, please add the argument `--no-sandbox` and specify an alternate user data directory using the `--user-data-dir` argument."
            cmd: code --no-sandbox --user-data-dir /tmp/che-verify-code --version
        installers:
            - brew/cask:
                packageName: visual-studio-code
            - apt:
                fromRegistry: packages.microsoft.com/repos/code
    codex:
        requires:
            - ruby
        completions:
            zsh:
                cmd: codex completion zsh
        installers:
            - brew/cask
            - npm:
                packageName: '@openai/codex'
                version: 0.147.0
    copilot:
        version: 1.0.78
        installers:
            - npm:
                packageName: '@github/copilot'
    corepack:
        version: 0.35.0
        installers:
            - npm
    containerd:
        version: 2.3.3
        installers:
            - apt:
                packageName: containerd.io
                versionMap: {"2.3.3": "2.3.3-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: [bin/containerd, bin/containerd-shim-runc-v2, bin/ctr]
                platformEligibility:
                    - linux-amd64: sha256:ebf6e710056312628eaf6fb4a1c32f0a4ae5f812568321be4029389d66fc7c7c
                    - linux-arm64: sha256:9cc708f13c31588a2fbdbd13553d963356e990d50e9b95a2d6120f4ff2067910
                url: https://github.com/containerd/containerd/releases/download/v{version}/containerd-{version}-linux-{arch}.tar.gz
    curl:
        manpages: [curl.1]
        installers:
            - brew
            - apt:
                versionMap: {"8.14.1": "8.14.1-2+deb13u2~bpo13+1"}
                fromRegistry: deb.debian.org/debian
            #[why] the static build ships the binary alone, no man page
            - binariesRemoteArchive:
                manpages: []
                archScheme: uname
                extractBinaries: [curl]
                platformEligibility:
                    - linux-amd64: sha256:e955f211202ded2536164588331acfc987dc4b7857efa3577717b1ffeab22029
                    - linux-arm64: sha256:d3f10502a9c6ead9bc3763fde3d12467db03661a263e11fec2ef2edc70e98e9f
                version: 8.21.0
                url: https://github.com/stunnel/static-curl/releases/download/{version}/curl-linux-{arch}-musl-{version}.tar.xz
            - nix:
                versionMap: {"8.21.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    docker:
        version: 29.7.2
        requires:
            - dockerd
            - containerd
            - docker-buildx-plugin
            - docker-compose-plugin
        completions:
            zsh:
                cmd: docker completion zsh
        installers:
            - apt:
                packageName: docker-ce-cli
                versionMap: {"29.7.2": "5:29.7.2-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
            - binariesRemoteArchive:
                archScheme: uname
                extractBinaries: [docker/docker]
                platformEligibility:
                    - linux-amd64: sha256:803d433f226db4776e1768fd319fc6c6e4935a456acf84fcc0080818b854bc8f
                    - linux-arm64: sha256:43d143448adf2c2787704e7d7704fd6d62d367a54c5edaef0a3f75509cb0938d
                url: https://download.docker.com/linux/static/stable/{arch}/docker-{version}.tgz
            - binariesRemoteArchive:
                archScheme: uname
                extractBinaries: [docker/docker]
                platformEligibility:
                    - darwin-arm64: sha256:b8683ed19d1f06048a496f9b8429e2c71d0b088d475b7487c054ea3666c02a3c
                url: https://download.docker.com/mac/static/stable/{arch}/docker-{version}.tgz
    docker-buildx-plugin:
        version: 0.36.1
        verify:
            cmd: /usr/libexec/docker/cli-plugins/docker-buildx version
            checkInPath: false
        installers:
            - apt:
                versionMap: {"0.36.1": "0.36.1-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
            - binariesRemoteArchive:
                archScheme: go
                aliasBinary:
                    docker-buildx-plugin: ~/.docker/cli-plugins/docker-buildx
                platformEligibility:
                    - darwin-arm64: sha256:214cdc36788602862dbc82b523d58648b4585c7b0ff95218b0817c44db5573d7
                    - linux-amd64: sha256:48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
                    - linux-arm64: sha256:5d0cafd9d16afe1a0f0d9529885344ace2cc99efdd531b6c783c5455a6001569
                url: https://github.com/docker/buildx/releases/download/v{version}/buildx-v{version}.{os}-{arch}
                verify:
                    cmd: $HOME/.docker/cli-plugins/docker-buildx version
                    checkInPath: false
    docker-compose-plugin:
        version: 5.4.0
        verify:
            cmd: /usr/libexec/docker/cli-plugins/docker-compose version
            checkInPath: false
        installers:
            - apt:
                versionMap: {"5.4.0": "5.4.0-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
            - binariesRemoteArchive:
                archScheme: uname
                aliasBinary:
                    docker-compose-plugin: ~/.docker/cli-plugins/docker-compose
                platformEligibility:
                    - darwin-arm64: sha256:bc3d1fd4c01e3af9b481fc5ea153ea7c006c77eb39be78e9af3e2e8ebecc0d61
                    - linux-amd64: sha256:837fd1d35bf6a494f41b5b5988269a7be79de337cf1a1a6ff0e45ab51bb4e9be
                    - linux-arm64: sha256:fc5d1371f1ec7987e703da94ede49af3fbfb240b83f22991a98511de7bc4b93b
                url: https://github.com/docker/compose/releases/download/v{version}/docker-compose-{os}-{arch}
                verify:
                    cmd: $HOME/.docker/cli-plugins/docker-compose version
                    checkInPath: false
    dockerd:
        version: 29.7.2
        installers:
            - apt:
                packageName: docker-ce
                versionMap: {"29.7.2": "5:29.7.2-1~debian.12~bookworm"}
                fromRegistry: download.docker.com/linux/debian
            - binariesRemoteArchive:
                archScheme: uname
                extractBinaries: [docker/dockerd, docker/docker-init, docker/docker-proxy, docker/runc]
                platformEligibility:
                    - linux-amd64: sha256:803d433f226db4776e1768fd319fc6c6e4935a456acf84fcc0080818b854bc8f
                    - linux-arm64: sha256:43d143448adf2c2787704e7d7704fd6d62d367a54c5edaef0a3f75509cb0938d
                url: https://download.docker.com/linux/static/stable/{arch}/docker-{version}.tgz
    duti:
        verify:
            cmd: duti -V
        manpages: [duti.1]
        installers:
            - brew
    fd:
        manpages: [fd.1]
        installers:
            - brew
            - apt:
                packageName: fd-find
                aliasBinary:
                    fdfind: fd
                manpages: [fdfind.1]
            - nix:
                versionMap: {"10.4.2": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    ffmpeg:
        version: "5"
        verify:
            cmd: ffmpeg -version
        manpages: [ffmpeg.1]
        installers:
            - brew
            - apt:
                versionMap: {"5": "7:5.1.9-0+deb12u1"}
    font-jetbrains-mono:
        verify:
            pkgMgrVersionCheck: true
            checkInPath: false
        installers:
            - brew/cask
    gcc:
        version: "12"
        installers:
            - brew
            - apt:
                versionMap: {"12": "4:12.2.0-3"}
    gcloud:
        installers:
            - apt:
                packageName: google-cloud-cli
                versionMap: {"579.0.0": "579.0.0-0"}
                fromRegistry: packages.cloud.google.com/apt
            - brew/cask:
                packageName: gcloud-cli
    get-os-open-files-with:
        version: latest #[why] own module
        installers:
            - go:
                packageName: gitlab.com/konradodwrot/go-modules/get-os-open-files-with
    gh:
        manpages: [gh.1]
        installers:
            - brew
            - apt
            - nix:
                versionMap: {"2.97.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    git:
        manpages: [git.1]
        installers:
            - brew
            - apt:
                versionMap: {"2.39.5": "1:2.39.5-0+deb12u3"}
            - nix:
                versionMap: {"2.55.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    gitlab-runner:
        installers:
            - brew
            - apt:
                fromRegistry: packages.gitlab.com/runner/gitlab-runner/debian
            - binariesRemoteArchive:
                archScheme: go
                platformEligibility:
                    - linux-amd64: sha256:e59b67160f0f80528317d51fa3fc80981eb8de36f195c1726ec1af112ef7c1f8
                    - linux-arm64: sha256:7f83c7ee3c0cb2aafc1b9996433426867986421708dbfe355a6ff7bc36bfad4b
                version: 19.2.2
                url: https://s3.dualstack.us-east-1.amazonaws.com/gitlab-runner-downloads/v{version}/binaries/gitlab-runner-linux-{arch}
            - nix:
                versionMap: {"19.1.1": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    gitlab-tart-executor:
        installers:
            - brew:
                fromRegistry: cirruslabs/cli
    glab:
        installers:
            - brew
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: [bin/glab]
                platformEligibility:
                    - linux-amd64: sha256:f1c52907558b665f2032b615787d353cd06e54240b501a81f9489bfc8f6a8ebf
                    - linux-arm64: sha256:54a5fe7de0db23e34151c55e561c28e59e6ef6a7731f7d0ce8a00fa58cd8d8f8
                version: 1.112.0
                url: https://gitlab.com/gitlab-org/cli/-/releases/v{version}/downloads/glab_{version}_linux_{arch}.tar.gz
            - nix:
                versionMap: {"1.111.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    gpg:
        manpages: [gpg.1]
        installers:
            - brew:
                packageName: gnupg
            - apt:
                packageName: gnupg
                versionMap: {"2": "2.2.40-1.1+deb12u2"}
            - nix:
                packageName: gnupg
                versionMap: {"2.4.9": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    go:
        version: 1.26.5
        completions:
            zsh:
                name: _golang
                url: https://raw.githubusercontent.com/zsh-users/zsh-completions/398b4b74775102da7bc6a510a08d0914592f9e62/src/_golang
                checksum: sha256:f36054c235ecc827b66b61deb5cf98221254feefd997751cdc85a07dc6c451c3
        installers:
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: [go/bin/go, go/bin/gofmt]
                platformEligibility: [darwin-arm64, linux-amd64, linux-arm64]
                url: https://go.dev/dl/go{version}.{os}-{arch}.tar.gz
    gopls:
        version: 0.23.0
        installers:
            - go:
                packageName: golang.org/x/tools/gopls
    goreleaser:
        installers:
            - brew
            - binariesRemoteArchive:
                archScheme: odd
                extractBinaries: [goreleaser]
                platformEligibility:
                    - linux-amd64: sha256:a99bbc7ae0d8d897b07c4c497a9b62f222558804715ef219d1af05a7e417bc80
                    - linux-arm64: sha256:702f03769ac8bcb0e47839c82243cc614ae995633599a98c63062e13ea85f829
                version: 2.17.1
                url: https://github.com/goreleaser/goreleaser/releases/download/v{version}/goreleaser_Linux_{arch}.tar.gz
            - nix:
                versionMap: {"2.17.1": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    grafana:
        installers:
            - brew
            - apt:
                fromRegistry: apt.grafana.com
    htop:
        manpages: [htop.1]
        installers:
            - brew
            - apt
            - nix:
                versionMap: {"3.5.2": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    jaeger:
        version: 2.20.0
        installers:
            - binariesRemoteArchive:
                archScheme: go
                extractBinaries: ["jaeger-{version}-{os}-{arch}/jaeger"]
                platformEligibility:
                    - darwin-arm64: sha256:b2d21051b27f06535c288dd63e15a42d5aae653d0113695014d7e6b502736e5d
                    - linux-amd64: sha256:c967368ba09be356089ef7e8aab2a76d170dc007ff6ccf7925c8167ede2900d7
                    - linux-arm64: sha256:582261d2d8e46721246f5f8072dca7f6762355b248e0dc493bb85990e6226952
                url: https://github.com/jaegertracing/jaeger/releases/download/v{version}/jaeger-{version}-{os}-{arch}.tar.gz
    jq:
        manpages: [jq.1]
        installers:
            - brew
            - apt
            - nix:
                versionMap: {"1.8.2": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    kind:
        completions:
            zsh:
                cmd: kind completion zsh
        installers:
            - brew
            - binariesRemoteArchive:
                archScheme: go
                platformEligibility:
                    - linux-amd64: sha256:50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
                    - linux-arm64: sha256:b92cd615e97585de8ddade28ed5cd7feb4248d717c233eea5b03c37298900f5d
                version: 0.32.0
                url: https://github.com/kubernetes-sigs/kind/releases/download/v{version}/kind-{os}-{arch}
            - nix:
                versionMap: {"0.32.0": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
    kitty:
        installers:
            - script:
                os: darwin
                url: https://sw.kovidgoyal.net/kitty/installer.sh
                args: [launch=n]
        #[why] the installer only drops kitty.app: without the links the binary never reaches PATH
        postInstall:
            path: scripts/post-install-kitty.sh
    kubectl:
        completions:
            zsh:
                cmd: kubectl completion zsh
        manpages: [kubectl.1]
        installers:
            - brew
            #[why] the release is the bare binary, no man page
            - binariesRemoteArchive:
                manpages: []
                archScheme: go
                platformEligibility:
                    - linux-amd64: sha256:ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336
                    - linux-arm64: sha256:3d86f24401c41ae5a46ac50eef8865fe891d3647d324a0836f6c63757a126e62
                version: 1.36.3
                url: https://dl.k8s.io/release/v{version}/bin/{os}/{arch}/kubectl
            - nix:
                versionMap: {"1.36.3": "6b5e5b7a6631f065bf6908986990b37d845f847f"}
        versionCommand: kubectl version --client
    kubectx:
        version: 0.11.0
