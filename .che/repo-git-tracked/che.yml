# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
variablesDefinitions:
  profilesVariablesDefinitions:
    repo/filesTracked:
      CENTRALIZED_ASSETS_PROSE_HUMAN_REF:
        required: true
    repo/filesUntracked:
      CENTRALIZED_ASSETS_PROSE_COMMON_REF:
        required: true
profilesDefinitions:
  'repo/filesTracked':
    type: repo-git-tracked
    include:
      renderTemplates:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/human
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_HUMAN_REF }}"
            filepath: prose/repos/go-modules/docs
          dest: che/docs
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source: spec.md
              dest: spec.md
            - source: observability.md
              dest: observability.md

  'repo/filesUntracked':
    type: repo-git-untracked
    include:
      renderTemplates:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/common
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_COMMON_REF }}"
            filepath: prose/repos/go-modules
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source: che-purpose.md
              dest: che/assets/docs-agents/purpose.md
            - source: lib-purpose.md
              dest: lib/assets/docs-agents/purpose.md
            - source: get-os-open-files-with-purpose.md
              dest: get-os-open-files-with/assets/docs-agents/purpose.md
            - source: get-term-open-files-with-purpose.md
              dest: get-term-open-files-with/assets/docs-agents/purpose.md

##[<] 🤖🤖