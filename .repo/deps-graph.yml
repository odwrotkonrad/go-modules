dependsOn:
  #[why] che dependsOn both schemas, never the reverse: a che release ships the versions they were
  #   minted at. the schemas depend on nothing, which is what keeps the graph acyclic once
  #   che-packages depends on che-packages-schema while che still embeds the catalog
  gitlab.com/konradodwrot/go-modules/che:
    - uri: gitlab.com/konradodwrot/che-packages
      type: gitRepository
    - uri: gitlab.com/konradodwrot/go-modules/che-schema
      type: file
    - uri: gitlab.com/konradodwrot/go-modules/lib
      type: goModule
    - uri: gitlab.com/konradodwrot/go-modules/che-packages-schema
      type: file
  gitlab.com/konradodwrot/go-modules/che-schema: []
  gitlab.com/konradodwrot/go-modules/che-packages-schema: []
  gitlab.com/konradodwrot/go-modules/get-os-open-files-with:
    - uri: gitlab.com/konradodwrot/go-modules/lib
      type: goModule
  gitlab.com/konradodwrot/go-modules/get-term-open-files-with:
    - uri: gitlab.com/konradodwrot/go-modules/lib
      type: goModule
  gitlab.com/konradodwrot/go-modules/lib: []
  ciEnv:
    - uri: gitlab.com/konradodwrot/centralized/assets/generic
      type: gitRepository
    - uri: us-central1-docker.pkg.dev/staging-499418/ci/ci-linux
      type: ociImage
    - uri: us-central1-docker.pkg.dev/staging-499418/ci/ci-linux-dind
      type: ociImage
  repoContents:
    - uri: gitlab.com/konradodwrot/centralized/assets/prose/ai
      type: gitRepository
    - uri: gitlab.com/konradodwrot/centralized/assets/prose/human
      type: gitRepository
  devEnv:
    - uri: gitlab.com/konradodwrot/ai-harness/ai-tools-configs
      type: gitRepository
